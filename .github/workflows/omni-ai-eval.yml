name: Omni AI Eval

# Runs an Omni AI eval on every PR that touches the model YAML. It evaluates the
# PR's Omni model branch (matched by branch name) against a `main` baseline using
# the same prompt set, then posts a per-prompt regression report as a PR comment.
#
# The check FAILS if any prompt regresses (passed on main, failed on the branch),
# if no matching Omni branch is found (edit via omni-sync so the branch exists),
# or on an operational error (API failure / timeout). Cost changes never gate.
#
# Required repo secrets (Settings > Secrets and variables > Actions > Secrets):
#   OMNI_API_KEY   Organization API key (Settings > API access)
#   OMNI_BASE_URL  e.g. https://<your-org>.omniapp.co/api
# Required repo variables (Settings > Secrets and variables > Actions > Variables):
#   OMNI_MODEL_ID  default Omni model (omni/Snowflake); PRs under omni/MotherDuck Demos use 9200dd83
# Which prompt sets run is configured in .github/scripts/omni_eval.py
# (PROMPT_SETS list), not a repo variable -- edit that list to add/remove suites.
#
# To use this workflow in another Omni repo: copy this file and
# .github/scripts/omni_eval.py, set the secrets/variable above, set PROMPT_SETS
# in the script, and adjust the `paths:` filter below to match where your model
# YAML lives.

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: Omni model branch to evaluate against main (manual runs only; PRs use the head branch automatically)
        required: true
      model_id:
        description: Omni model the branch belongs to (manual runs only; PRs pick it from the folder they change). Blank means the OMNI_MODEL_ID variable.
        required: false
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "omni/**"

permissions:
  contents: read
  pull-requests: write

# One eval per PR at a time; new pushes cancel the in-flight run. This also keeps
# us under Omni's limit of 2 concurrent eval runs org-wide.
concurrency:
  group: omni-ai-eval-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The repo holds two models: omni/Snowflake (the OMNI_MODEL_ID variable) and
      # omni/MotherDuck Demos (9200dd83). ponytail: one model per PR; a PR touching
      # both folders is evaluated on MotherDuck Demos only.
      - name: Pick the Omni model this PR changes
        id: model
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          model="${{ inputs.model_id || vars.OMNI_MODEL_ID }}"
          if [ -n "$PR" ] && gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename' | grep -q '^omni/MotherDuck Demos/'; then
            model=9200dd83-80e3-4f24-9dd1-943555696b1b
          fi
          echo "Evaluating model $model"
          echo "id=$model" >> "$GITHUB_OUTPUT"

      - name: Run Omni AI eval
        id: eval
        env:
          OMNI_BASE_URL: ${{ secrets.OMNI_BASE_URL }}
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
          MODEL_ID: ${{ steps.model.outputs.id }}
          BRANCH_NAME: ${{ github.head_ref || github.event.inputs.branch_name }}
          SUMMARY_PATH: omni-eval-summary.md
          RESULTS_PATH: omni-eval-results.json
        run: python .github/scripts/omni_eval.py

      - name: Upload full results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: omni-eval-results
          path: |
            omni-eval-results.json
            omni-eval-summary.md
          if-no-files-found: ignore

      - name: Post / update PR comment
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('omni-eval-summary.md')) {
              core.info('No summary file produced; skipping comment.');
              return;
            }
            if (!context.payload.pull_request) {
              core.info('Not a pull_request event (manual run); skipping comment. See the summary in the uploaded artifact.');
              return;
            }
            const body = fs.readFileSync('omni-eval-summary.md', 'utf8');
            const marker = '<!-- omni-ai-eval -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
            }
