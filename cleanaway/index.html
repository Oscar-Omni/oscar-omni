<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>LGA margin explorer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.0.1/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.0.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@4.2.1/dist/pmtiles.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@protomaps/basemaps@5.7.2/dist/basemaps.js"></script>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;color:#e4eef4;background:#102732}*{box-sizing:border-box}body{margin:0}#map{position:absolute;inset:0}button,select{font:inherit;color:inherit;background:#102732;border:1px solid #38515f;border-radius:7px;padding:8px 10px;font-size:12px;cursor:pointer}button:hover,select:hover{border-color:#64c5ee}button:focus-visible,select:focus-visible{outline:2px solid #64c5ee;outline-offset:2px}.toolbar{position:absolute;top:12px;left:12px;right:48px;display:flex;gap:6px;z-index:2}select{width:min(270px,65%);text-overflow:ellipsis}.panel{background:rgba(10,31,43,.96);border:1px solid #38515f;border-radius:10px;box-shadow:0 3px 20px #0003}.legend{position:absolute;bottom:28px;left:12px;padding:11px 13px;z-index:2;width:225px;pointer-events:none}.legend strong{font-size:12px}.ramp{height:7px;margin:9px 0 5px;border-radius:5px;background:linear-gradient(90deg,#f79837,#d5c3a8,#7ebacb,#299ac6,#0085ca)}.ticks{display:flex;justify-content:space-between;color:#b9cbd7;font-size:10px}.meta{font-size:11px;color:#b9cbd7;margin-top:8px}.detail{position:absolute;right:12px;bottom:28px;width:230px;padding:14px;z-index:3}.detail[hidden]{display:none}.detail h2{font-size:16px;line-height:1.2;margin:0 24px 4px 0}.state{color:#9eb7c6;font-size:11px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.metrics b{display:block;font-size:18px}.metrics small{font-size:10px;color:#b9cbd7}.close{position:absolute;top:6px;right:7px;padding:3px 7px;border:0;background:transparent;font-size:18px}.hint{font-size:10px;color:#a4bccb;margin:12px 0 0}.maplibregl-ctrl-group{background:#dbe8ee}.maplibregl-ctrl-attrib{font-size:9px;background:#102732d9!important;color:#afc4d0!important}.maplibregl-ctrl-attrib a{color:#afc4d0!important}.maplibregl-popup-content{background:#102732;color:#e4eef4;border:1px solid #38515f;border-radius:7px;padding:10px 12px;font-size:12px;box-shadow:0 2px 12px #0005}.maplibregl-popup-tip{border-top-color:#102732!important;border-bottom-color:#102732!important}.maplibregl-popup-content b{display:block;margin-bottom:4px}.maplibregl-popup-content span{color:#b9cbd7}.status{position:absolute;top:57px;left:12px;max-width:320px;font-size:12px;padding:9px 12px;z-index:4}.status[hidden]{display:none}@media(max-width:540px){.detail{width:195px}.legend{width:175px}.toolbar{right:48px}.metrics b{font-size:16px}.legend strong{font-size:11px}}@media(max-width:390px){.detail{left:12px;right:12px;width:auto;bottom:105px}.legend{width:205px}}
</style>
</head>
<body>
<div id="map" role="region" aria-label="Interactive map of illustrative sales by Australian local government area"></div>
<div class="toolbar"><select id="search" aria-label="Find an LGA"><option value="">Find an LGA…</option></select><button id="reset" title="Fit map to current dashboard results">Reset view</button></div>
<div id="status" class="status panel" role="status">Loading LGA map…</div>
<div class="legend panel"><strong>Gross margin · lower → higher</strong><div class="ramp"></div><div class="ticks"><span>20%</span><span>30%</span><span>40%+</span></div><div id="summary" class="meta"></div></div>
<section id="detail" class="detail panel" aria-live="polite" hidden><button class="close" id="close" aria-label="Close LGA details">×</button><h2 id="name"></h2><div class="state" id="state"></div><div class="metrics"><div><b id="gm"></b><small>Gross margin</small></div><div><b id="revenue"></b><small>Net revenue</small></div><div><b id="orders"></b><small>Orders</small></div><div><b id="lines"></b><small>Order lines</small></div></div><p class="hint">Illustrative allocation · not real customer locations.</p></section>
<script src="map.js"></script>
</body>
</html>
