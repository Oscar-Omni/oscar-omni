base_view: oscar_demos_omnise__demo_grill_d_trial_scenarios
label: Trial planner scenarios (synthetic)
group_label: Grill'd
description: Three fixed scenario slots for the synthetic late night trial planner app.

joins: {}

ai_context: |
  Three fixed scenario slots for the synthetic late night trial planner. Saved values live in the input columns saved_label and saved_assumptions keyed on scenario_id. Not trading data.

sample_queries:
  saved_scenarios:
    query:
      fields:
        [
          oscar_demos_omnise__demo_grill_d_trial_scenarios.scenario_id,
          oscar_demos_omnise__demo_grill_d_trial_scenarios.default_label
        ]
      base_view: oscar_demos_omnise__demo_grill_d_trial_scenarios
      topic: demo_grill_d_trial_planner_scenarios
    prompt: Which late night trial scenarios are saved?
