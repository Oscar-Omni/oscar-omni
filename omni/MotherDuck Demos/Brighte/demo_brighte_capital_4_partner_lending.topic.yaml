base_view: oscar_demos_dbt__demo_brighte_capital_4__application_events
label: Partner lending (synthetic)
group_label: Brighte
description: Synthetic Brighte lending through retailer and installer partners,
  one row per application stage event, 1 Nov 2024 to 31 Oct 2026, AUD.

access_filters:
  - field: oscar_demos_dbt__demo_brighte_capital_4__partners.partner_name
    user_attribute: demo_tenant
    values_for_unfiltered: [ all ]

joins:
  oscar_demos_dbt__demo_brighte_capital_4__applications: {}
  oscar_demos_dbt__demo_brighte_capital_4__partners: {}
  oscar_demos_dbt__demo_brighte_capital_4__sales_reps: {}
  oscar_demos_dbt__demo_brighte_capital_4__products: {}

relationships:
  - join_from_view: oscar_demos_dbt__demo_brighte_capital_4__application_events
    join_to_view: oscar_demos_dbt__demo_brighte_capital_4__applications
    join_type: always_left
    on_sql: ${oscar_demos_dbt__demo_brighte_capital_4__application_events.application_id}
      = ${oscar_demos_dbt__demo_brighte_capital_4__applications.application_id}
    relationship_type: many_to_one

  - join_from_view: oscar_demos_dbt__demo_brighte_capital_4__application_events
    join_to_view: oscar_demos_dbt__demo_brighte_capital_4__partners
    join_type: always_left
    on_sql: ${oscar_demos_dbt__demo_brighte_capital_4__application_events.partner_id}
      = ${oscar_demos_dbt__demo_brighte_capital_4__partners.partner_id}
    relationship_type: many_to_one

  - join_from_view: oscar_demos_dbt__demo_brighte_capital_4__application_events
    join_to_view: oscar_demos_dbt__demo_brighte_capital_4__sales_reps
    join_type: always_left
    on_sql: ${oscar_demos_dbt__demo_brighte_capital_4__application_events.rep_id} =
      ${oscar_demos_dbt__demo_brighte_capital_4__sales_reps.rep_id}
    relationship_type: many_to_one

  - join_from_view: oscar_demos_dbt__demo_brighte_capital_4__application_events
    join_to_view: oscar_demos_dbt__demo_brighte_capital_4__products
    join_type: always_left
    on_sql: ${oscar_demos_dbt__demo_brighte_capital_4__application_events.product_id}
      = ${oscar_demos_dbt__demo_brighte_capital_4__products.product_id}
    relationship_type: many_to_one

ai_context: |
  Synthetic Brighte partner lending, 1 Nov 2024 to 31 Oct 2026, AUD. Say the data is synthetic.
  One row per application stage event. Every measure counts an event in the period it happened; filter event_date for any period.
  Decline rate is declines over applications submitted.
  Battery jobs means product Battery.
  For status as at 31 Oct 2026 (awaiting settlement, document status) use the applications view and count with Applications (status).

sample_queries:
  days_to_settle_by_product_aug_oct_2026:
    query:
      fields:
        [
          oscar_demos_dbt__demo_brighte_capital_4__products.product_category,
          oscar_demos_dbt__demo_brighte_capital_4__application_events.avg_days_to_settle
        ]
      base_view: oscar_demos_dbt__demo_brighte_capital_4__application_events
      filters:
        oscar_demos_dbt__demo_brighte_capital_4__application_events.event_date:
          between_dates: [ 2026-08-01, 2026-10-31 ]
      topic: demo_brighte_capital_4_partner_lending
    prompt: Average days from approval to settlement by product for loans settled 1
      August to 31 October 2026
  kestrel_certificate_backlog:
    query:
      fields:
        [
          oscar_demos_dbt__demo_brighte_capital_4__applications.install_doc_status,
          oscar_demos_dbt__demo_brighte_capital_4__applications.application_count,
          oscar_demos_dbt__demo_brighte_capital_4__applications.total_loan_amount
        ]
      base_view: oscar_demos_dbt__demo_brighte_capital_4__application_events
      filters:
        oscar_demos_dbt__demo_brighte_capital_4__partners.partner_name:
          is: Kestrel Solar and Battery
        oscar_demos_dbt__demo_brighte_capital_4__applications.current_status:
          is: Approved awaiting settlement
      topic: demo_brighte_capital_4_partner_lending
    prompt: How many Kestrel applications are awaiting settlement with an
      installation certificate pending, and how much is that?
