# Reference this view as oscar_demos_omnise__demo_mantel_group_partner_scenario_slots
label: Scenario slots
description: Three fixed scenario slots for the retention planner app; not member data.

catalog: oscar_demos
schema: omnise
table_name: demo_mantel_group_partner_scenario_slots

dimensions:
  scenario_id:
    label: Scenario ID
    format: ID
    primary_key: true
    synonyms: [ scenario, slot, plan ]

  slot_order:
    label: Slot order

  default_label:
    label: Default label

  editable:
    label: Editable

  default_assumptions_json:
    label: Default assumptions
    hidden: true

measures:
  count:
    hidden: true
    aggregate_type: count
