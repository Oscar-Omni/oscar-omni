# Reference this view as oscar_demos_omnise__demo_ab_equipment_ltd_2_operational_sites
label: Operational sites
description: Synthetic D365 operational sites (branches). 24 sites on real Stats
  NZ 2025 territorial authorities, 18 with a workshop. Names are the TA name
  plus a number, never a real branch.

catalog: oscar_demos
schema: omnise
table_name: demo_ab_equipment_ltd_2_operational_sites

dimensions:
  site_id:
    label: Site ID
    format: ID
    description: D365 site id, three letter area code plus a digit.
    primary_key: true

  site_name:
    label: Workshop
    description: Invented site name, the TA short name plus a number.
    synonyms: [ workshop, branch, site, service centre ]

  site_type:
    label: Site type
    description: Branch with workshop or Parts and sales branch.

  sales_region:
    label: Region
    description: Sales region, Northern, Central North, Lower North or South Island.
    synonyms:
      [
        region,
        sales region,
        Northern,
        Central North,
        Lower North,
        South Island
      ]

  island:
    label: Island

  ta_code:
    label: TA code
    format: ID
    hidden: true

  longitude:
    label: Longitude
    description: Town centre point inside the TA polygon, not a branch address.

  latitude:
    label: Latitude
    description: Town centre point inside the TA polygon, not a branch address.

measures:
  count:
    label: Sites
    aggregate_type: count
