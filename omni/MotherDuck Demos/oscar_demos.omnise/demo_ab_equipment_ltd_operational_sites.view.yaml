# Reference this view as oscar_demos_omnise__demo_ab_equipment_ltd_operational_sites
label: Operational sites
description: Synthetic D365 operational sites (branches), 24 sites, 18 with a
  workshop. Names are invented, a territorial authority short name plus a
  number; points are town centres, not branch addresses.

catalog: oscar_demos
schema: omnise
table_name: demo_ab_equipment_ltd_operational_sites

dimensions:
  site_id:
    label: Site ID
    format: ID
    description: D365 site id.
    primary_key: true

  site_name:
    label: Workshop
    description: Operational site (branch) name. Invented.
    synonyms: [ workshop, branch, site, service centre ]

  site_type:
    label: Site type
    description: Branch with workshop or Parts and sales branch.

  sales_region:
    label: Region
    description: Sales region, Northern, Central North, Lower North or South Island.
    synonyms:
      [
        region,
        sales region,
        Northern,
        Central North,
        Lower North,
        South Island
      ]

  island:
    label: Island

  ta_code:
    label: TA code
    hidden: true

  longitude:
    label: Longitude
    hidden: true

  latitude:
    label: Latitude
    hidden: true

measures:
  count:
    hidden: true
    aggregate_type: count
