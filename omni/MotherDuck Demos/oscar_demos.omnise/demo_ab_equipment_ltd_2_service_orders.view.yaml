# Reference this view as oscar_demos_omnise__demo_ab_equipment_ltd_2_service_orders
label: Service orders
description: Synthetic D365 service orders created 1 Nov 2025 to 31 Oct 2026,
  customer, warranty and internal jobs.

catalog: oscar_demos
schema: omnise
table_name: demo_ab_equipment_ltd_2_service_orders

dimensions:
  service_order_id:
    label: Service order
    format: ID
    primary_key: true
    synonyms: [ service order, job, work order ]

  created_date:
    label: Created date
    description: Date the order was opened, NZ time.

  completed_date:
    label: Completed date
    description: Date the job was completed; empty while open.

  site_id:
    label: Site ID
    format: ID
    hidden: true

  sales_region:
    hidden: true

  customer_account:
    label: Customer account
    format: ID
    hidden: true

  item_number:
    label: Machine model
    format: ID

  product_line:
    hidden: true

  service_order_type:
    label: Job type
    description: Scheduled service, Repair, Field service, Warranty, PDI and
      fit-out, Rework or Own fleet maintenance.
    synonyms: [ job type, service order type, PDI ]

  line_property_id:
    label: Line property
    format: ID
    description: Chargeable (customer jobs), Warranty (billed to the manufacturer)
      or Internal (PDI and fit-out, rework, own fleet).
    synonyms: [ chargeable, warranty, internal ]

  order_status:
    label: Status
    synonyms: [ status, open, completed ]

  days_to_complete:
    hidden: true

measures:
  count:
    hidden: true
    aggregate_type: count

  service_order_count:
    sql: ${service_order_id}
    label: Service orders
    format: "#,##0"
    description: Service orders created.
    aggregate_type: count_distinct
    synonyms: [ jobs, work orders, job count ]

  avg_days_to_complete:
    sql: ${days_to_complete}
    label: Days to complete
    format: "0.0"
    description: Average calendar days from created to completed, completed orders only.
    aggregate_type: average
    synonyms: [ turnaround, job time, wait time ]
