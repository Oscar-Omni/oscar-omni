# Reference this view as oscar_demos_omnise__demo_grill_d_trial_scenarios
label: Trial scenarios
description: Three fixed scenario slots for the synthetic late night trial planner app.

catalog: oscar_demos
schema: omnise
table_name: demo_grill_d_trial_scenarios

dimensions:
  scenario_id:
    label: Scenario
    format: ID
    primary_key: true
    synonyms: [ slot, plan ]

  slot_order:
    label: Slot order

  default_label:
    label: Default label

  editable:
    label: Editable

  default_assumptions_json:
    label: Default assumptions

measures:
  count:
    label: Scenarios
    aggregate_type: count
