# Reference this view as oscar_demos_omnise__demo_ab_equipment_ltd_customers
label: Customers
description: Synthetic D365 customer accounts. Names are invented; C-000001 is
  the internal workshop account and C-104400 is Northgate Distribution
  (synthetic).

catalog: oscar_demos
schema: omnise
table_name: demo_ab_equipment_ltd_customers

dimensions:
  customer_account:
    label: Customer account
    format: ID
    primary_key: true

  customer_name:
    label: Customer
    description: Invented customer name.
    synonyms: [ customer, account ]

  customer_group_id:
    label: Customer group
    format: ID
    synonyms: [ segment, industry ]

  home_site_id:
    label: Home site ID
    format: ID
    hidden: true

measures:
  count:
    hidden: true
    aggregate_type: count
