# Reference this view as oscar_demos_omnise__demo_mantel_group_partner_members
label: Members
description: Synthetic sample. One row per fictional member account open at any
  time from 1 Aug 2024 to 31 Oct 2026.

catalog: oscar_demos
schema: omnise
table_name: demo_mantel_group_partner_members

dimensions:
  lga_code: {}
  lga_name: {}

  member_id:
    label: Member ID
    format: ID
    primary_key: true

  join_date:
    label: Join date
    description: Date the account opened.

  state_name:
    hidden: true

  occupation_category:
    hidden: true

  insurance_cover:
    hidden: true

  employer_id:
    format: ID
    hidden: true

  member_status:
    label: Member status
    description: Open, Rolled out or Retired at 31 Oct 2026.

measures:
  count:
    label: Members
    format: "#,##0"
    description: Distinct member accounts.
    aggregate_type: count
