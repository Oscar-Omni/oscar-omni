# Reference this view as oscar_demos_omnise__demo_brighte_capital_3_partner_sites
label: Partner Sites

catalog: oscar_demos
schema: omnise
table_name: demo_brighte_capital_3_partner_sites

dimensions:
  partner_site_id:
    label: Partner Site ID
    format: ID
    primary_key: true

  partner_name:
    label: Partner
    hidden: true

  partner_tier:
    label: Partner Tier
    description: Premium or Standard partner package; one value per partner

  site_name:
    label: Partner Site
    description: Partner and site, for example Kestrel Brisbane
    synonyms: [ site, branch, store ]

  site_town:
    label: Site Town

  site_state:
    label: Site State

measures:
  count:
    aggregate_type: count
