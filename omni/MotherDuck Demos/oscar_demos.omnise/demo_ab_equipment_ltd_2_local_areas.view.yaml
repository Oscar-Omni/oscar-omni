# Reference this view as oscar_demos_omnise__demo_ab_equipment_ltd_2_local_areas
label: Territorial authorities
description: Stats NZ 2025 territorial authorities that have at least one
  synthetic site. Source Stats NZ, Territorial Authority 2025, CC BY 4.0.

catalog: oscar_demos
schema: omnise
table_name: demo_ab_equipment_ltd_2_local_areas

dimensions:
  code:
    label: TA code
    format: ID
    description: Stats NZ TA2025 code as three character text with leading zeros.
    primary_key: true

  name:
    label: Territorial authority
    description: Exact Stats NZ name, for example Hamilton City.
    synonyms: [ TA, territorial authority, district, council, city ]

  state:
    label: Country
    hidden: true

  longitude:
    label: Longitude
    hidden: true

  latitude:
    label: Latitude
    hidden: true

measures:
  count:
    hidden: true
    aggregate_type: count
