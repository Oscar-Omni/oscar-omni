# Reference this view as oscar_demos_omnise__demo_ab_equipment_ltd_warehouses
label: Warehouses
description: Synthetic D365 warehouses, a parts warehouse at every site plus the
  national parts DC.

catalog: oscar_demos
schema: omnise
table_name: demo_ab_equipment_ltd_warehouses

dimensions:
  warehouse_id:
    label: Warehouse ID
    format: ID
    primary_key: true

  warehouse_name:
    label: Warehouse
    synonyms: [ DC, parts warehouse ]

  site_id:
    label: Site ID
    format: ID
    hidden: true

  warehouse_type:
    label: Warehouse type
    description: Branch parts or National DC.

measures:
  count:
    hidden: true
    aggregate_type: count
