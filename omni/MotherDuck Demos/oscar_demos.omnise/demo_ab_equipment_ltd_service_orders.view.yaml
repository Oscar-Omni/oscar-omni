# Reference this view as oscar_demos_omnise__demo_ab_equipment_ltd_service_orders
label: Service orders
description: Synthetic sample shaped like Dynamics 365 F&O service orders. One
  row per service order created 1 Nov 2025 to 31 Oct 2026, customer, warranty
  and internal jobs.

catalog: oscar_demos
schema: omnise
table_name: demo_ab_equipment_ltd_service_orders

dimensions:
  service_order_id:
    label: Service order
    format: ID
    description: D365 service order ID.
    primary_key: true
    synonyms: [ job, work order ]

  created_date:
    label: Created date
    description: Date the order was opened, NZ time.

  completed_date:
    label: Completed date
    description: Date the job was completed; empty while open.

  site_id:
    label: Site ID
    format: ID
    hidden: true

  sales_region:
    hidden: true

  customer_account:
    label: Customer account
    format: ID
    hidden: true

  item_number:
    label: Item number
    format: ID
    hidden: true

  product_line:
    hidden: true

  service_order_type:
    label: Service order type
    description: Scheduled service, Repair, Field service, Warranty, PDI and
      fit-out, Rework or Own fleet maintenance.
    synonyms: [ job type, PDI ]

  line_property_id:
    label: Line property
    format: ID
    description: Chargeable is a customer job, Warranty is billed to the
      manufacturer, Internal is PDI and fit-out, rework and own fleet.
    synonyms: [ chargeable, warranty, internal ]

  order_status:
    label: Order status
    description: Completed or Open.
    synonyms: [ status, open, completed ]

  days_to_complete:
    label: Days to complete
    description: Calendar days from created to completed; empty while open.

measures:
  count:
    hidden: true
    aggregate_type: count

  service_order_count:
    sql: ${service_order_id}
    label: Service orders
    format: "#,##0"
    description: Service orders created.
    aggregate_type: count_distinct
    synonyms: [ jobs, work orders, job count ]

  total_days_to_complete:
    sql: ${days_to_complete}
    label: Total days to complete
    hidden: true
    aggregate_type: sum

  completed_orders:
    sql: ${days_to_complete}
    label: Completed orders
    format: "#,##0"
    hidden: true
    aggregate_type: count

  avg_days_to_complete:
    sql: ${total_days_to_complete} / NULLIF(${completed_orders}, 0)
    label: Average days to complete
    format: "0.0"
    description: Average calendar days from created to completed, completed orders only.
    synonyms: [ turnaround, days to complete, job time, wait time ]
