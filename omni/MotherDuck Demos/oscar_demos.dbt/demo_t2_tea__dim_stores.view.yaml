# Reference this view as oscar_demos_dbt__demo_t2_tea__dim_stores
label: Stores

catalog: oscar_demos
schema: dbt
table_name: demo_t2_tea__dim_stores

dimensions:
  location_name: {}
  city: {}
  country_name: {}
  store_format: {}
  first_trade_date: {}
  last_trade_date: {}
  lifetime_net_sales_aud: {}

  location_id:
    format: ID
    primary_key: true

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: demo_t2_tea__dim_stores
  target_schema: dbt
  config:
    materialized: table
  code: |-
    select
        l.location_id,
        l.location_name,
        l.city,
        l.country_name,
        l.store_format,
        min(s.trade_date) as first_trade_date,
        max(s.trade_date) as last_trade_date,
        sum(s.net_sales_aud) as lifetime_net_sales_aud
    from {{ source('demo_t2_tea', 'locations') }} as l
    left join {{ source('demo_t2_tea', 'sales_daily') }} as s on s.location_id = l.location_id
    group by all
  referenced_by: [ demo_t2_tea__fct_sales_daily ]
