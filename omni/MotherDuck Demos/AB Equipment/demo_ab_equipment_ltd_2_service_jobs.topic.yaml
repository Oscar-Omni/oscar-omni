hidden: true

base_view: oscar_demos_omnise__demo_ab_equipment_ltd_2_service_orders
label: Service jobs (synthetic)
group_label: AB Equipment
description: Synthetic D365 shaped service orders created 1 Nov 2025 to 31 Oct
  2026, for job flow and customer turnaround.

joins:
  oscar_demos_omnise__demo_ab_equipment_ltd_2_operational_sites: {}
  oscar_demos_omnise__demo_ab_equipment_ltd_2_customers: {}
  oscar_demos_omnise__demo_ab_equipment_ltd_2_released_products: {}

relationships:
  - join_from_view: oscar_demos_omnise__demo_ab_equipment_ltd_2_service_orders
    join_to_view: oscar_demos_omnise__demo_ab_equipment_ltd_2_operational_sites
    join_type: always_left
    on_sql: ${oscar_demos_omnise__demo_ab_equipment_ltd_2_service_orders.site_id} =
      ${oscar_demos_omnise__demo_ab_equipment_ltd_2_operational_sites.site_id}
    relationship_type: many_to_one

  - join_from_view: oscar_demos_omnise__demo_ab_equipment_ltd_2_service_orders
    join_to_view: oscar_demos_omnise__demo_ab_equipment_ltd_2_customers
    join_type: always_left
    on_sql: ${oscar_demos_omnise__demo_ab_equipment_ltd_2_service_orders.customer_account}
      =
      ${oscar_demos_omnise__demo_ab_equipment_ltd_2_customers.customer_account}
    relationship_type: many_to_one

  - join_from_view: oscar_demos_omnise__demo_ab_equipment_ltd_2_service_orders
    join_to_view: oscar_demos_omnise__demo_ab_equipment_ltd_2_released_products
    join_type: always_left
    on_sql: ${oscar_demos_omnise__demo_ab_equipment_ltd_2_service_orders.item_number}
      =
      ${oscar_demos_omnise__demo_ab_equipment_ltd_2_released_products.item_number}
    relationship_type: many_to_one

ai_context: |
  Same synthetic sites and window as Workshop time. One row per D365 service order created in the window. Say the data is synthetic.
  Turnaround means avg_days_to_complete over completed orders; open orders have no days.
  Customer jobs are line property Chargeable; Warranty jobs are billed to the manufacturer; Internal jobs are PDI and fit-out, rework and own fleet maintenance.
  Hours and utilisation belong to the Workshop time topic.

sample_queries:
  chargeable_turnaround_by_workshop:
    query:
      fields:
        [
          oscar_demos_omnise__demo_ab_equipment_ltd_2_operational_sites.site_name,
          "oscar_demos_omnise__demo_ab_equipment_ltd_2_service_orders.created\
            _date[month]",
          oscar_demos_omnise__demo_ab_equipment_ltd_2_service_orders.avg_days_to_complete
        ]
      base_view: oscar_demos_omnise__demo_ab_equipment_ltd_2_service_orders
      filters:
        oscar_demos_omnise__demo_ab_equipment_ltd_2_service_orders.created_date:
          between_dates: [ 2026-05-01, 2026-10-31 ]
        oscar_demos_omnise__demo_ab_equipment_ltd_2_service_orders.line_property_id:
          is: Chargeable
      topic: demo_ab_equipment_ltd_2_service_jobs
    prompt: What was average days to complete for Chargeable service orders by
      workshop from 1 August to 31 October 2026, against 1 May to 31 July 2026?
  pdi_orders_by_workshop_month:
    query:
      fields:
        [
          oscar_demos_omnise__demo_ab_equipment_ltd_2_operational_sites.site_name,
          "oscar_demos_omnise__demo_ab_equipment_ltd_2_service_orders.created\
            _date[month]",
          oscar_demos_omnise__demo_ab_equipment_ltd_2_service_orders.service_order_count
        ]
      base_view: oscar_demos_omnise__demo_ab_equipment_ltd_2_service_orders
      filters:
        oscar_demos_omnise__demo_ab_equipment_ltd_2_service_orders.created_date:
          between_dates: [ 2026-05-01, 2026-10-31 ]
        oscar_demos_omnise__demo_ab_equipment_ltd_2_service_orders.service_order_type:
          is: PDI and fit-out
      topic: demo_ab_equipment_ltd_2_service_jobs
    prompt: How many PDI and fit-out service orders did each workshop open each
      month from May to October 2026?
