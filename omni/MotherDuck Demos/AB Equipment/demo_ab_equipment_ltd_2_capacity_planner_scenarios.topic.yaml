base_view: oscar_demos_omnise__demo_ab_equipment_ltd_2_capacity_scenarios
label: Capacity planner scenarios (synthetic)
group_label: AB Equipment
description: Three fixed scenario slots for the synthetic workshop capacity
  planner app. Not operational data.

joins: {}

ai_context: |
  Three fixed scenario slots for the synthetic workshop capacity planner: baseline, contract_crew and overtime_plus_one. Saved values live in the input columns saved_label and saved_assumptions keyed on scenario_id. Not operational data; workshop questions belong to the Workshop time topic.

sample_queries:
  saved_scenarios:
    query:
      fields:
        [
          oscar_demos_omnise__demo_ab_equipment_ltd_2_capacity_scenarios.scenario_id,
          oscar_demos_omnise__demo_ab_equipment_ltd_2_capacity_scenarios.default_label
        ]
      base_view: oscar_demos_omnise__demo_ab_equipment_ltd_2_capacity_scenarios
      topic: demo_ab_equipment_ltd_2_capacity_planner_scenarios
    prompt: Which capacity scenarios are saved?
