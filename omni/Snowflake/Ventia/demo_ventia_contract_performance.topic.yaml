hidden: false

base_view: se_sandbox_oscar__demo_ventia_contract_months
label: Contract Performance
group_label: Ventia
description: Contract margin and cost for the value creation program. One row
  per contract per month, 2024-10 to 2026-09, across contracts whose finance
  data comes from three source systems. Synthetic Ventia data, money in AUD.

joins:
  se_sandbox_oscar__demo_ventia_contracts: {}

relationships:
  - join_from_view: se_sandbox_oscar__demo_ventia_contract_months
    join_to_view: se_sandbox_oscar__demo_ventia_contracts
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_ventia_contract_months.contract_id} =
      ${se_sandbox_oscar__demo_ventia_contracts.contract_id}
    relationship_type: many_to_one

ai_context: |-
  Synthetic Ventia data, every contract invented, money in AUD. One row per contract per calendar month from 2024-10-01 to 2026-09-30. Every period filter uses contract_months.month_start with an exclusive end date: 2026-04-01 to 2026-09-30 means month_start between 2026-04-01 and 2026-10-01, and 2025-10-01 to 2026-03-31 means between 2025-10-01 and 2026-04-01.

  Revenue means revenue. Margin, GM and gross margin mean gross_margin_pct, a ratio of sums; never average contract percentages. Margin dollars means gross_margin. Margin vs target means margin_vs_budget. Cost means total_cost. Subcontractor spend means supplier_spend. Off panel and non panel spend mean off_panel_share, the share of supplier spend paid to suppliers not on an approved panel. Leakage and premium mean off_panel_premium, what was paid above the panel schedule rate, in AUD. Unclassified vendors means unclassified_spend_share. Use the contract_months copies of sector, state, region and service_line; contract name and source system come from contracts.

  Analysis guidance. To compare two periods, run the same aggregate query once per period with identical filters and report both side by side with the change in percentage points, stating both periods with explicit dates. To explain a margin fall, split by sector, then by state, and show off_panel_share and off_panel_premium beside gross_margin_pct; the driver is off panel buying, not revenue or labour. Each answer is one aggregate query, never contract by contract. Supplier, spend category and PO line questions belong to the Supplier Spend topic. Lead with the headline numbers and keep answers short.

sample_queries:
  margin_and_off_panel_by_sector_current:
    query:
      fields:
        [
          se_sandbox_oscar__demo_ventia_contract_months.sector,
          se_sandbox_oscar__demo_ventia_contract_months.gross_margin_pct,
          se_sandbox_oscar__demo_ventia_contract_months.off_panel_share
        ]
      base_view: se_sandbox_oscar__demo_ventia_contract_months
      filters:
        se_sandbox_oscar__demo_ventia_contract_months.month_start:
          between_dates: [ 2026-04-01, 2026-10-01 ]
      sorts:
        - field: se_sandbox_oscar__demo_ventia_contract_months.gross_margin_pct
      topic: demo_ventia_contract_performance
    prompt: What were gross margin and off panel share by sector between 2026-04-01
      and 2026-09-30?
  margin_and_off_panel_by_sector_prior:
    query:
      fields:
        [
          se_sandbox_oscar__demo_ventia_contract_months.sector,
          se_sandbox_oscar__demo_ventia_contract_months.gross_margin_pct,
          se_sandbox_oscar__demo_ventia_contract_months.off_panel_share
        ]
      base_view: se_sandbox_oscar__demo_ventia_contract_months
      filters:
        se_sandbox_oscar__demo_ventia_contract_months.month_start:
          between_dates: [ 2025-10-01, 2026-04-01 ]
      sorts:
        - field: se_sandbox_oscar__demo_ventia_contract_months.gross_margin_pct
      topic: demo_ventia_contract_performance
    prompt: What were gross margin and off panel share by sector between 2025-10-01
      and 2026-03-31?
  transport_by_state_current:
    query:
      fields:
        [
          se_sandbox_oscar__demo_ventia_contract_months.state,
          se_sandbox_oscar__demo_ventia_contract_months.off_panel_share,
          se_sandbox_oscar__demo_ventia_contract_months.off_panel_premium
        ]
      base_view: se_sandbox_oscar__demo_ventia_contract_months
      filters:
        se_sandbox_oscar__demo_ventia_contract_months.month_start:
          between_dates: [ 2026-04-01, 2026-10-01 ]
        se_sandbox_oscar__demo_ventia_contract_months.sector:
          is: transport
      sorts:
        - field: se_sandbox_oscar__demo_ventia_contract_months.off_panel_premium
          desc: true
      topic: demo_ventia_contract_performance
    prompt: For transport, what were off panel share and off panel premium by state
      between 2026-04-01 and 2026-09-30?
    ai_context: Compare with the same breakdown for 2025-10-01 to 2026-03-31 and
      show the change in points of off panel share.
  top_contracts_by_premium:
    query:
      fields:
        [
          se_sandbox_oscar__demo_ventia_contracts.contract_name,
          se_sandbox_oscar__demo_ventia_contract_months.off_panel_premium
        ]
      base_view: se_sandbox_oscar__demo_ventia_contract_months
      filters:
        se_sandbox_oscar__demo_ventia_contract_months.month_start:
          between_dates: [ 2026-04-01, 2026-10-01 ]
      limit: 10
      sorts:
        - field: se_sandbox_oscar__demo_ventia_contract_months.off_panel_premium
          desc: true
      topic: demo_ventia_contract_performance
    prompt: Which contracts had the highest off panel premium between 2026-04-01 and
      2026-09-30?
  off_panel_by_state_by_month_2026:
    query:
      fields:
        [
          "se_sandbox_oscar__demo_ventia_contract_months.month_start[month]",
          se_sandbox_oscar__demo_ventia_contract_months.state,
          se_sandbox_oscar__demo_ventia_contract_months.off_panel_share
        ]
      base_view: se_sandbox_oscar__demo_ventia_contract_months
      filters:
        se_sandbox_oscar__demo_ventia_contract_months.month_start:
          between_dates: [ 2026-01-01, 2026-10-01 ]
      topic: demo_ventia_contract_performance
    prompt: How did off panel share change by state month by month from 2026-01 to
      2026-09?
