hidden: false

base_view: se_sandbox_oscar__demo_ventia_purchase_orders
label: Supplier Spend
group_label: Ventia
description: Spend by supplier, spend category and panel status for procurement
  and project teams. One row per purchase order line. Synthetic Ventia data,
  money in AUD.

joins:
  se_sandbox_oscar__demo_ventia_suppliers: {}
  se_sandbox_oscar__demo_ventia_contracts: {}
  se_sandbox_oscar__demo_ventia_contract_months: {}

relationships:
  - join_from_view: se_sandbox_oscar__demo_ventia_purchase_orders
    join_to_view: se_sandbox_oscar__demo_ventia_suppliers
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_ventia_purchase_orders.supplier_id} =
      ${se_sandbox_oscar__demo_ventia_suppliers.supplier_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__demo_ventia_purchase_orders
    join_to_view: se_sandbox_oscar__demo_ventia_contracts
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_ventia_purchase_orders.contract_id} =
      ${se_sandbox_oscar__demo_ventia_contracts.contract_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__demo_ventia_purchase_orders
    join_to_view: se_sandbox_oscar__demo_ventia_contract_months
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_ventia_purchase_orders.contract_id} =
      ${se_sandbox_oscar__demo_ventia_contract_months.contract_id} AND
      ${se_sandbox_oscar__demo_ventia_purchase_orders.month_start} =
      ${se_sandbox_oscar__demo_ventia_contract_months.month_start}
    relationship_type: many_to_one

ai_context: |-
  Synthetic Ventia data, every supplier and contract invented, money in AUD. One row per purchase order line from 2024-10-01 to 2026-09-30. Filter periods on contract_months.month_start with an exclusive end date: 2026-04-01 to 2026-09-30 means between 2026-04-01 and 2026-10-01.

  Spend means po_spend_aud. Off panel share means po_off_panel_share. Premium means po_off_panel_premium_aud. Use the po_ measures here and never the contract_months measures, which are monthly totals. Category means purchase_orders.spend_category. Vendor and supplier mean suppliers.supplier_name. Off panel means suppliers.panel_status = off_panel. Vendor classification means purchase_orders.classification_status from the vendor classification pipeline. New vendors means suppliers.onboarded_date in 2026. Sector and state for a PO line come from contract_months.sector and contract_months.state.

  Off panel lines cost 1.35 times the panel benchmark everywhere and throughout (po_price_ratio), so a rising premium is a mix effect: more spend goes off panel, the rate does not change. Each answer is one aggregate query. Lead with the headline numbers and keep answers short.

sample_queries:
  qld_transport_off_panel_suppliers:
    query:
      fields:
        [
          se_sandbox_oscar__demo_ventia_suppliers.supplier_name,
          se_sandbox_oscar__demo_ventia_suppliers.classification_status,
          se_sandbox_oscar__demo_ventia_purchase_orders.po_spend_aud,
          se_sandbox_oscar__demo_ventia_purchase_orders.po_off_panel_premium_aud
        ]
      base_view: se_sandbox_oscar__demo_ventia_purchase_orders
      filters:
        se_sandbox_oscar__demo_ventia_contract_months.month_start:
          between_dates: [ 2026-04-01, 2026-10-01 ]
        se_sandbox_oscar__demo_ventia_contract_months.sector:
          is: transport
        se_sandbox_oscar__demo_ventia_contract_months.state:
          is: Queensland
        se_sandbox_oscar__demo_ventia_suppliers.panel_status:
          is: off_panel
      limit: 15
      sorts:
        - field: se_sandbox_oscar__demo_ventia_purchase_orders.po_spend_aud
          desc: true
      topic: demo_ventia_supplier_spend
    prompt: Which off panel suppliers did Queensland transport contracts pay most
      between 2026-04-01 and 2026-09-30?
  traffic_management_off_panel_by_month_2026:
    query:
      fields:
        [
          "se_sandbox_oscar__demo_ventia_contract_months.month_start[month]",
          se_sandbox_oscar__demo_ventia_purchase_orders.po_off_panel_share
        ]
      base_view: se_sandbox_oscar__demo_ventia_purchase_orders
      filters:
        se_sandbox_oscar__demo_ventia_contract_months.month_start:
          between_dates: [ 2026-01-01, 2026-10-01 ]
        se_sandbox_oscar__demo_ventia_purchase_orders.spend_category:
          is: traffic_management
      topic: demo_ventia_supplier_spend
    prompt: What share of traffic management spend was off panel by month in 2026?
  premium_by_category_current:
    query:
      fields:
        [
          se_sandbox_oscar__demo_ventia_purchase_orders.spend_category,
          se_sandbox_oscar__demo_ventia_purchase_orders.po_off_panel_premium_aud,
          se_sandbox_oscar__demo_ventia_purchase_orders.po_off_panel_share
        ]
      base_view: se_sandbox_oscar__demo_ventia_purchase_orders
      filters:
        se_sandbox_oscar__demo_ventia_contract_months.month_start:
          between_dates: [ 2026-04-01, 2026-10-01 ]
      sorts:
        - field: se_sandbox_oscar__demo_ventia_purchase_orders.po_off_panel_premium_aud
          desc: true
      topic: demo_ventia_supplier_spend
    prompt: Which spend categories carried the off panel premium between 2026-04-01
      and 2026-09-30?
