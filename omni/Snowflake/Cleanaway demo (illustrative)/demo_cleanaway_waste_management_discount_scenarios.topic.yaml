hidden: false

base_view: se_sandbox_oscar__demo_cleanaway_waste_management_scenario_slots
label: Discount scenarios
group_label: Cleanaway demo (illustrative)
description: Planning slots for the Discount Guardrail Planner app. App store
  only, not sales data.

joins:
  se_sandbox_oscar__demo_cleanaway_waste_management_regions: {}

relationships:
  - join_from_view: se_sandbox_oscar__demo_cleanaway_waste_management_scenario_slots
    join_to_view: se_sandbox_oscar__demo_cleanaway_waste_management_regions
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_cleanaway_waste_management_scenario_slots.region_id}
      = ${se_sandbox_oscar__demo_cleanaway_waste_management_regions.region_id}
    relationship_type: many_to_one

ai_context: Saved planning slots for the Discount Guardrail Planner app, with
  default assumption values and a scenario_json input column the app saves into.
  Not sales data; do not use it to answer questions about orders, revenue or
  margin.

sample_queries:
  planning_slots:
    query:
      fields:
        [
          se_sandbox_oscar__demo_cleanaway_waste_management_scenario_slots.slot_name,
          se_sandbox_oscar__demo_cleanaway_waste_management_scenario_slots.discount_cap_pct
        ]
      base_view: se_sandbox_oscar__demo_cleanaway_waste_management_scenario_slots
      sorts:
        - field: se_sandbox_oscar__demo_cleanaway_waste_management_scenario_slots.slot_order
      topic: demo_cleanaway_waste_management_discount_scenarios
    prompt: Which planning slots exist and what discount cap does each hold?
