base_view: se_sandbox_oscar__demo_cleanaway_waste_management_order_lines
label: Sales
group_label: Cleanaway demo (illustrative)
description: Order lines with channel, category, state and customer segment,
  list value, discount, net revenue, cost and gross margin. One row per order
  line. Illustrative synthetic data, not any real company's figures.

joins:
  se_sandbox_oscar__demo_cleanaway_waste_management_customers: {}
  se_sandbox_oscar__demo_cleanaway_waste_management_regions: {}

relationships:
  - join_from_view: se_sandbox_oscar__demo_cleanaway_waste_management_order_lines
    join_to_view: se_sandbox_oscar__demo_cleanaway_waste_management_customers
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.customer_id}
      =
      ${se_sandbox_oscar__demo_cleanaway_waste_management_customers.customer_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__demo_cleanaway_waste_management_order_lines
    join_to_view: se_sandbox_oscar__demo_cleanaway_waste_management_regions
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.region_id}
      = ${se_sandbox_oscar__demo_cleanaway_waste_management_regions.region_id}
    relationship_type: many_to_one

ai_context: |-
  One row per order line, 1 August 2024 to 31 October 2026. Generic illustrative synthetic data for an Omni demo, not any real company's figures; customer names are generic samples. Money is AUD, so quote amounts as A$.

  The date field is order_lines.order_date. Net revenue is list value minus discount. Gross margin % is gross margin over net revenue. Discount rate is discount given over list value; never average the line discount %. Average order value is net revenue over distinct orders. Never average rates across lines, states, channels or months; always use the gross_margin_pct, discount_rate and average_order_value measures, which recompute from the sums.

  State means regions.state_name (full names such as Victoria). Channel is Online, Direct or Partner, where Partner means orders placed through a reseller partner. Category is Technology, Furniture, Consumables or Services. Segment is customers.segment: Consumer, Small business or Enterprise.

  Financial years run 1 July to 30 June: FY27 is 1 July 2026 to 30 June 2027 and FY27 to date is 1 July to 31 October 2026. June is the end of financial year sale, with deeper discounts in every state and channel, so a June dip is seasonal and not a cause.

  Date filters use an exclusive end: 1 July to 31 October 2026 is order_date between 2026-07-01 and 2026-11-01. To compare two periods, run the same query once per period with identical filters, show both side by side with the change in percentage points, and name both date ranges. In a follow up, keep the state and other filters from the previous answer unless the user changes them. To explain a margin change in one state, filter that state and split by order_date month and channel with gross_margin_pct, discount_rate and lines. Say which channel moved and which stayed flat. Stay on the data: never invent causes such as a named competitor or person. Lead with the headline numbers and keep answers short.

sample_queries:
  gross_margin_by_state_jul_oct_2026:
    query:
      fields:
        [
          se_sandbox_oscar__demo_cleanaway_waste_management_regions.state_name,
          se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.net_revenue,
          se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.gross_margin_pct
        ]
      base_view: se_sandbox_oscar__demo_cleanaway_waste_management_order_lines
      filters:
        se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.order_date:
          between_dates: [ 2026-07-01, 2026-11-01 ]
      sorts:
        - field: se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.gross_margin_pct
      topic: demo_cleanaway_waste_management_sales
    prompt: What was our gross margin % by state for orders from 1 July 2026 to 31
      October 2026?
  gross_margin_by_state_jul_oct_2025:
    query:
      fields:
        [
          se_sandbox_oscar__demo_cleanaway_waste_management_regions.state_name,
          se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.net_revenue,
          se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.gross_margin_pct
        ]
      base_view: se_sandbox_oscar__demo_cleanaway_waste_management_order_lines
      filters:
        se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.order_date:
          between_dates: [ 2025-07-01, 2025-11-01 ]
      sorts:
        - field: se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.gross_margin_pct
      topic: demo_cleanaway_waste_management_sales
    prompt: What was our gross margin % by state for orders from 1 July 2025 to 31
      October 2025?
  victoria_by_month_and_channel:
    query:
      fields:
        [
          "se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.orde\
            r_date[month]",
          se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.channel,
          se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.gross_margin_pct,
          se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.discount_rate,
          se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.lines
        ]
      base_view: se_sandbox_oscar__demo_cleanaway_waste_management_order_lines
      filters:
        se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.order_date:
          between_dates: [ 2026-05-01, 2026-11-01 ]
        se_sandbox_oscar__demo_cleanaway_waste_management_regions.state_name:
          is: Victoria
      sorts:
        - field: se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.order_date[month]
      topic: demo_cleanaway_waste_management_sales
    prompt: For Victoria, show gross margin %, discount rate and order lines by
      channel for each month from May 2026 to October 2026.
  discount_rate_by_channel_oct_2026:
    query:
      fields:
        [
          se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.channel,
          se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.discount_rate
        ]
      base_view: se_sandbox_oscar__demo_cleanaway_waste_management_order_lines
      filters:
        se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.order_date:
          between_dates: [ 2026-10-01, 2026-11-01 ]
      sorts:
        - field: se_sandbox_oscar__demo_cleanaway_waste_management_order_lines.discount_rate
          desc: true
      topic: demo_cleanaway_waste_management_sales
    prompt: Which channel had the highest discount rate in October 2026?
