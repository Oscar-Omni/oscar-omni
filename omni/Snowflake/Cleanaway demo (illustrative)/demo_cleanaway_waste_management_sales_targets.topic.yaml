hidden: true

base_view: se_sandbox_oscar__demo_cleanaway_waste_management_sales_targets
label: Sales targets
group_label: Cleanaway demo (illustrative)
description: The monthly sales plan by state and channel, with actuals rolled up
  to the same grain. Illustrative synthetic data.

joins:
  se_sandbox_oscar__demo_cleanaway_waste_management_regions: {}

relationships:
  - join_from_view: se_sandbox_oscar__demo_cleanaway_waste_management_sales_targets
    join_to_view: se_sandbox_oscar__demo_cleanaway_waste_management_regions
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_cleanaway_waste_management_sales_targets.region_id}
      = ${se_sandbox_oscar__demo_cleanaway_waste_management_regions.region_id}
    relationship_type: many_to_one

ai_context: "One row per month, state and channel: the illustrative synthetic
  sales plan. target_month is the first of the month. Targets are AUD amounts
  for net revenue and gross margin; a target margin % is target gross margin
  over target net revenue. Actual net revenue and actual gross margin are order
  lines already rolled up to this same month, state and channel grain, so
  compare actuals with targets here rather than joining targets to single order
  lines. Net revenue vs target and gross margin vs target are actual over target
  minus one. State means regions.state_name. Quote money as A$ and name the
  months."

sample_queries:
  victoria_partner_vs_target_aug_oct_2026:
    query:
      fields:
        [
          se_sandbox_oscar__demo_cleanaway_waste_management_sales_targets.target_month,
          se_sandbox_oscar__demo_cleanaway_waste_management_sales_targets.actual_net_revenue,
          se_sandbox_oscar__demo_cleanaway_waste_management_sales_targets.target_net_revenue,
          se_sandbox_oscar__demo_cleanaway_waste_management_sales_targets.actual_gross_margin,
          se_sandbox_oscar__demo_cleanaway_waste_management_sales_targets.target_gross_margin
        ]
      base_view: se_sandbox_oscar__demo_cleanaway_waste_management_sales_targets
      filters:
        se_sandbox_oscar__demo_cleanaway_waste_management_sales_targets.target_month:
          between_dates: [ 2026-08-01, 2026-11-01 ]
        se_sandbox_oscar__demo_cleanaway_waste_management_regions.state_name:
          is: Victoria
        se_sandbox_oscar__demo_cleanaway_waste_management_sales_targets.channel:
          is: Partner
      sorts:
        - field: se_sandbox_oscar__demo_cleanaway_waste_management_sales_targets.target_month
      topic: demo_cleanaway_waste_management_sales_targets
    prompt: What were the net revenue and gross margin targets against actuals for
      Victoria Partner in each month from August to October 2026?
