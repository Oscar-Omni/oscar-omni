# Reference this view as aged_care_quality_quarterly
label: Quality Indicators (Quarterly)

uploaded_table_name: quality_indicators_quarterly.csv::78faf31b-0798-40fa-b731-a6dcba92da8c

dimensions:
  facility_id:
    display_order: 0
    hidden: true

  quarter_start:
    label: Quarter
    display_order: 1

  pressure_injury_pct:
    display_order: 2

  restrictive_practices_pct:
    display_order: 3

  unplanned_weight_loss_pct:
    display_order: 4

  falls_pct:
    display_order: 5

  falls_major_injury_pct:
    display_order: 6

  med_incidents_per_1000_bed_days:
    display_order: 7

  hospitalisation_pct:
    display_order: 8

  workforce_turnover_pct:
    display_order: 9

  consumer_experience_score:
    display_order: 10

measures:
  avg_pressure_injury_pct:
    sql: ${pressure_injury_pct}
    label: Pressure Injury %
    format: number_1
    aggregate_type: average

  avg_restrictive_practices_pct:
    sql: ${restrictive_practices_pct}
    label: Restrictive Practices %
    format: number_1
    aggregate_type: average

  avg_unplanned_weight_loss_pct:
    sql: ${unplanned_weight_loss_pct}
    label: Unplanned Weight Loss %
    format: number_1
    aggregate_type: average

  avg_falls_pct:
    sql: ${falls_pct}
    label: Falls %
    format: number_1
    aggregate_type: average

  avg_falls_major_injury_pct:
    sql: ${falls_major_injury_pct}
    label: Falls with Major Injury %
    format: number_1
    aggregate_type: average

  avg_med_incidents_per_1000_bed_days:
    sql: ${med_incidents_per_1000_bed_days}
    label: Medication Incidents per 1,000 Bed Days
    format: number_1
    aggregate_type: average

  avg_hospitalisation_pct:
    sql: ${hospitalisation_pct}
    label: Hospitalisation %
    format: number_1
    aggregate_type: average

  avg_workforce_turnover_pct:
    sql: ${workforce_turnover_pct}
    label: Workforce Turnover %
    format: number_1
    aggregate_type: average

  avg_consumer_experience_score:
    sql: ${consumer_experience_score}
    label: Consumer Experience Score
    format: number_1
    aggregate_type: average

  count:
    aggregate_type: count

custom_compound_primary_key_sql:
  [
    "${aged_care_quality_quarterly.facility_id}",
    "${aged_care_quality_quarterly.quarter_start}"
  ]
