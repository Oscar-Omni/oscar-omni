base_view: se_sandbox_oscar__omnise_82_3d9a2b62_fact_admissions
label: RMIT Admissions - New Students
group_label: RMIT
description: Admissions team view of new student counts, by admission offer
  date. Joins through to commencement, faculty, campus and term dimensions for
  conversion and deferral analysis. Demo build omnise_82_3d9a2b62.

joins:
  se_sandbox_oscar__omnise_82_3d9a2b62_dim_faculty: {}
  se_sandbox_oscar__omnise_82_3d9a2b62_dim_campus: {}
  intake_term: {}
  se_sandbox_oscar__omnise_82_3d9a2b62_fact_commencements:
    commencement_term: {}

views:
  se_sandbox_oscar__omnise_82_3d9a2b62_fact_commencements:
    measures:
      tuition_revenue_actual:
        sql: ${se_sandbox_oscar__omnise_82_3d9a2b62_fact_commencements.eftsl_load} *
          CASE WHEN
          ${se_sandbox_oscar__omnise_82_3d9a2b62_fact_admissions.citizenship_status}
          = 'International' THEN 21000 ELSE 15000 END
        label: Tuition Revenue (Actual)
        format: audcurrency_0
        description: SUM(eftsl_load times revenue_per_eftsl by citizenship_status).
          Fictional placeholder rates (15000 AUD Domestic / 21000 AUD
          International per EFTSL), not a real published RMIT fee schedule. See
          build-report.md.
        aggregate_type: sum

  se_sandbox_oscar__omnise_82_3d9a2b62_fact_admissions:
    measures:
      conversion_rate:
        sql: ${se_sandbox_oscar__omnise_82_3d9a2b62_fact_commencements.new_students_term_basis}
          /
          NULLIF(${se_sandbox_oscar__omnise_82_3d9a2b62_fact_admissions.new_students_admission_basis},
          0)
        label: Admission-to-Commencement Conversion Rate
        format: percent_1
        description: COUNT(DISTINCT commencement_id) divided by COUNT(DISTINCT
          admission_id). Always the ratio of two summed counts, never an average
          of per-row percentages.

      not_yet_commenced:
        sql: ${se_sandbox_oscar__omnise_82_3d9a2b62_fact_admissions.new_students_admission_basis}
          -
          ${se_sandbox_oscar__omnise_82_3d9a2b62_fact_commencements.new_students_term_basis}
        label: Not Yet Commenced
        format: number_0
        description: Admission-basis new students minus term-basis new students, for the
          same filter context. A direct subtraction, not a re-aggregated
          average.

      deferral_gap_terms:
        sql: ${commencement_term.term_sequence} - ${intake_term.term_sequence}
        label: Average Deferral Gap (Terms)
        format: number_2
        description: Average of commencement-term sequence minus intake-term sequence,
          computed only over rows with a commencement. No-shows are excluded,
          not treated as a zero-term gap.
        aggregate_type: average

      teaching_cost:
        sql: ${se_sandbox_oscar__omnise_82_3d9a2b62_fact_commencements.eftsl_actual} *
          9500
        label: Teaching Cost (Actual)
        format: audcurrency_0
        description: SUM(eftsl_load) times a fictional placeholder
          cost_per_eftsl_teaching rate of 9500 AUD. Not a real published RMIT
          cost. See build-report.md.

      contribution_margin_actual:
        sql: ${se_sandbox_oscar__omnise_82_3d9a2b62_fact_commencements.tuition_revenue_actual}
          -
          ${se_sandbox_oscar__omnise_82_3d9a2b62_fact_admissions.teaching_cost}
        label: Contribution Margin (Actual)
        format: audcurrency_0
        description: Tuition Revenue (Actual) minus Teaching Cost (Actual), both
          fictional placeholder rates. See build-report.md.

relationships:
  - join_from_view: se_sandbox_oscar__omnise_82_3d9a2b62_fact_admissions
    join_to_view: se_sandbox_oscar__omnise_82_3d9a2b62_dim_faculty
    join_type: always_left
    on_sql: ${se_sandbox_oscar__omnise_82_3d9a2b62_fact_admissions.faculty_id} =
      ${se_sandbox_oscar__omnise_82_3d9a2b62_dim_faculty.faculty_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__omnise_82_3d9a2b62_fact_admissions
    join_to_view: se_sandbox_oscar__omnise_82_3d9a2b62_dim_campus
    join_type: always_left
    on_sql: ${se_sandbox_oscar__omnise_82_3d9a2b62_fact_admissions.campus_id} =
      ${se_sandbox_oscar__omnise_82_3d9a2b62_dim_campus.campus_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__omnise_82_3d9a2b62_fact_admissions
    join_to_view: se_sandbox_oscar__omnise_82_3d9a2b62_dim_term
    join_to_view_as: intake_term
    join_type: always_left
    on_sql: ${se_sandbox_oscar__omnise_82_3d9a2b62_fact_admissions.intake_term_id} =
      ${intake_term.term_id}
    relationship_type: many_to_one
    join_to_view_as_label: Intake Term

  - join_from_view: se_sandbox_oscar__omnise_82_3d9a2b62_fact_admissions
    join_to_view: se_sandbox_oscar__omnise_82_3d9a2b62_fact_commencements
    join_type: always_left
    on_sql: ${se_sandbox_oscar__omnise_82_3d9a2b62_fact_admissions.admission_id} =
      ${se_sandbox_oscar__omnise_82_3d9a2b62_fact_commencements.admission_id}
    relationship_type: one_to_one

  - join_from_view: se_sandbox_oscar__omnise_82_3d9a2b62_fact_commencements
    join_to_view: se_sandbox_oscar__omnise_82_3d9a2b62_dim_term
    join_to_view_as: commencement_term
    join_type: always_left
    on_sql: ${se_sandbox_oscar__omnise_82_3d9a2b62_fact_commencements.term_id} =
      ${commencement_term.term_id}
    relationship_type: many_to_one
    join_to_view_as_label: Commencement Term

ai_context: |
  Current user's RMIT department: {{omni_attributes.rmit_department}}.
  For an unqualified "How many students started?" or "How many new students do we have?", select the user's departmental definition: Admissions means accepted admissions (se_sandbox_oscar__omnise_82_3d9a2b62_fact_admissions.new_students_admission_basis, admission_offer_date); Faculty means recorded commencements (se_sandbox_oscar__omnise_82_3d9a2b62_fact_commencements.new_students_term_basis, commencement_term.term_start_date). In this synthetic demo, Admissions calls an accepted admission a start in its admissions process; never describe that count as attendance or actual commencement. An explicit request for accepted offers or actual commencements overrides the departmental default. If department is missing or unrecognized, ask which definition to use.
  Run the appropriate query; never invent or hard-code a count. Lead with the count and departmental definition, then end with one sentence naming the date basis used and the alternative department's definition. Keep answers concise and return only requested columns.
  All records are synthetic: 2023–2026 intake cohorts with eventual commencements including 2027 buffer terms. Without a date filter, use the full lifecycle; never claim current/YTD figures or that future starts happened today. Intake-cohort conversion follows the same admissions cohort; event-date reporting instead uses each measure's own date. Unmatched admissions are not proof of deferral: query deferral_gap_terms for lag, which excludes unmatched records. Both definitions remain accessible; personalization is not row-level security. Financial rates are fictional AUD assumptions.
