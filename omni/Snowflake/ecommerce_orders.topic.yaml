base_view: analytics_prod_ecomm__order_items
label: Ecommerce Orders
description: Line-item ecommerce sales with product, customer, spend, and
  fulfillment attributes.

joins:
  analytics_prod_ecomm__inventory_items:
    analytics_prod_ecomm__products:
      analytics_prod_ecomm__distribution_centers: {}
  analytics_prod_ecomm__users: {}
  analytics_prod_ecomm__user_spend: {}

ai_context: 'Line-item ecommerce sales; each row is one order item. Revenue =
  sum of order_items.sale_price. An "order" is order_items.order_id and usually
  spans several items — use order_count (distinct order_id) for orders and
  average_order_value for AOV. Product attributes (brand, category, department,
  SKU) come from the products view, not the denormalized product_* copies on
  inventory items. Returns come from order_items.is_returned / returned_at;
  return_rate is returned items over total items. Spend buckets: Low <$100,
  Medium $100-499, High $500+. Customer LTV, spend buckets, and cohort
  first_order_month come from the user_spend view. Three price fields differ:
  order_items.sale_price is transacted, products.retail_price is list,
  inventory_items.cost is unit cost. order_items.margin is dollar profit, not a
  rate.'

sample_queries:
  monthly_revenue_trend:
    prompt: "What has our monthly revenue trend looked like?"
    ai_context: Trend question, so sort chronologically ascending rather than
      by value descending.
    query:
      base_view: analytics_prod_ecomm__order_items
      fields:
        - analytics_prod_ecomm__order_items.created_at[month]
        - analytics_prod_ecomm__order_items.total_revenue
      topic: ecommerce_orders
      sorts:
        - field: analytics_prod_ecomm__order_items.created_at[month]
          desc: false

  return_rate_by_category:
    prompt: "What's our return rate by product category?"
    ai_context: Uses return_rate (returned items over total items) joined to
      products.category, not a raw count of is_returned rows.
    query:
      base_view: analytics_prod_ecomm__order_items
      fields:
        - analytics_prod_ecomm__products.category
        - analytics_prod_ecomm__order_items.return_rate
      topic: ecommerce_orders
      sorts:
        - field: analytics_prod_ecomm__order_items.return_rate
          desc: true

  aov_first_vs_repeat:
    prompt: "How does average order value compare between first-time and
      repeat customers?"
    ai_context: order_sequence_type splits first vs repeat purchases per
      customer; compare average_order_value across the two rather than
      filtering to one.
    query:
      base_view: analytics_prod_ecomm__order_items
      fields:
        - analytics_prod_ecomm__order_items.order_sequence_type
        - analytics_prod_ecomm__order_items.average_order_value
      topic: ecommerce_orders
