# Reference this view as se_sandbox_oscar__demo_need_2_care_transitions
catalog: SE_SANDBOX
schema: OSCAR
table_name: DEMO_NEED_2_CARE_TRANSITIONS

dimensions:
  transition_id:
    sql: '"TRANSITION_ID"'
    format: ID

  member_id:
    sql: '"MEMBER_ID"'
    format: ID

  partner_id:
    sql: '"PARTNER_ID"'
    format: ID

  acquisition_channel:
    sql: '"ACQUISITION_CHANNEL"'

  region:
    sql: '"REGION"'

  transition_date_kst:
    sql: '"TRANSITION_DATE_KST"'

  from_stage:
    sql: '"FROM_STAGE"'

  to_stage:
    sql: '"TO_STAGE"'

  is_treatment_entry:
    sql: '"IS_TREATMENT_ENTRY"'

  records_within_24h:
    sql: '"RECORDS_WITHIN_24H"'

  hours_to_records:
    sql: '"HOURS_TO_RECORDS"'

  engaged_prior_month:
    sql: '"ENGAGED_PRIOR_MONTH"'

  is_treatment_exit:
    sql: '"IS_TREATMENT_EXIT"'

  treatment_exit_lapsed:
    sql: '"TREATMENT_EXIT_LAPSED"'

measures:
  count:
    aggregate_type: count
