# Reference this view as se_sandbox_oscar__demo_need_2_care_transitions
label: Care Transitions
description: One row per change of care stage (Screening, Treatment, Recovery,
  Lapsed). Dates are KST. Synthetic Need data.

catalog: SE_SANDBOX
schema: OSCAR
table_name: DEMO_NEED_2_CARE_TRANSITIONS

dimensions:
  transition_id:
    sql: '"TRANSITION_ID"'
    label: Transition ID
    format: ID
    primary_key: true

  member_id:
    sql: '"MEMBER_ID"'
    label: Member ID
    format: ID

  partner_id:
    sql: '"PARTNER_ID"'
    label: Partner ID
    format: ID

  acquisition_channel:
    sql: '"ACQUISITION_CHANNEL"'
    label: Acquisition Channel
    synonyms: [ channel, insurer agents ]

  region:
    sql: '"REGION"'
    label: Region

  transition_date_kst:
    sql: '"TRANSITION_DATE_KST"'
    label: Transition Date (KST)
    synonyms: [ date, diagnosis date ]

  from_stage:
    sql: '"FROM_STAGE"'
    label: From Stage
    description: Screening, Treatment or Recovery
    synonyms: [ treatment stage, previous stage ]

  to_stage:
    sql: '"TO_STAGE"'
    label: To Stage
    description: Treatment, Recovery or Lapsed

  is_treatment_entry:
    sql: '"IS_TREATMENT_ENTRY"'
    label: Is Treatment Entry
    description: 1 when the member moved from Screening to Treatment (a diagnosis)
    synonyms: [ diagnosis ]

  records_within_24h:
    sql: '"RECORDS_WITHIN_24H"'
    label: Records Within 24 Hours
    description: 1 when hospital records were collected within 24 hours of entering
      Treatment. Set on the entry row and carried onto that member's Treatment
      exit row.
    synonyms: [ hospital records, timely records ]

  hours_to_records:
    sql: '"HOURS_TO_RECORDS"'
    label: Hours to Records
    description: On treatment entries, hours until hospital records were collected;
      empty when never collected

  engaged_prior_month:
    sql: '"ENGAGED_PRIOR_MONTH"'
    label: Engaged Prior Month
    description: 1 when the member was engaged (chatbot session or checkup upload)
      in the month before the transition
    synonyms: [ engaged before diagnosis ]

  is_treatment_exit:
    sql: '"IS_TREATMENT_EXIT"'
    label: Is Treatment Exit
    description: 1 when the member left Treatment, to Recovery or Lapsed

  treatment_exit_lapsed:
    sql: '"TREATMENT_EXIT_LAPSED"'
    label: Treatment Exit Lapsed
    description: 1 when the member left Treatment by lapsing instead of moving to Recovery

measures:
  count:
    label: Transitions
    aggregate_type: count

  treatment_entries:
    sql: ${is_treatment_entry}
    label: Treatment Entries
    format: number_0
    aggregate_type: sum
    synonyms: [ diagnoses ]

  entries_with_records_24h:
    sql: ${records_within_24h}
    label: Entries With Records in 24h
    format: number_0
    aggregate_type: sum
    filters:
      is_treatment_entry:
        is: 1

  records_24h_rate:
    sql: ${entries_with_records_24h} / NULLIF(${treatment_entries}, 0)
    label: Records Within 24h Rate
    format: percent_1
    description: Treatment entries whose hospital records were collected within 24
      hours. Counts entry rows only.
    synonyms: [ 24 hour collection, records rate ]

  treatment_exits:
    sql: ${is_treatment_exit}
    label: Treatment Exits
    format: number_0
    aggregate_type: sum

  treatment_exit_lapses:
    sql: ${treatment_exit_lapsed}
    label: Treatment Exit Lapses
    format: number_0
    aggregate_type: sum

  post_treatment_lapse_rate:
    sql: ${treatment_exit_lapses} / NULLIF(${treatment_exits}, 0)
    label: Post Treatment Lapse Rate
    format: percent_1
    description: Exits from Treatment that end in a lapse instead of Recovery
    synonyms: [ drop off after treatment ]

  avg_hours_to_records:
    sql: ${hours_to_records}
    label: Average Hours to Records
    format: number_1
    aggregate_type: average
    filters:
      is_treatment_entry:
        is: 1
