# Reference this view as se_sandbox_oscar__ticketek_ticket_sale
label: Ticket Sale
description: Ticket sale records per event, with tickets sold and revenue.

catalog: SE_SANDBOX
schema: OSCAR
table_name: TICKETEK_TICKET_SALE

dimensions:
  sale_id:
    sql: '"SALE_ID"'
    label: Sale ID
    format: ID
    primary_key: true

  event_id:
    sql: '"EVENT_ID"'
    label: Event ID
    format: ID

  tickets_sold:
    sql: '"TICKETS_SOLD"'
    label: Tickets Sold
    format: number_0
    description: Tickets sold on this sale record. Aggregate with Total Tickets Sold.
    synonyms: [ tickets, units, volume ]

  revenue:
    sql: '"REVENUE"'
    label: Revenue
    format: currency_2
    description: Revenue on this sale record. Aggregate with Total Revenue.
    synonyms: [ sales, amount ]

  sell_through_rate:
    sql: ${tickets_sold} / NULLIF(${se_sandbox_oscar__ticketek_venue.capacity}, 0)
    label: Sell-Through Rate
    format: percent_1
    description: Per-event sell-through - tickets sold on this record divided by the
      venue's capacity. Row-level rate, only meaningful per event.
    synonyms: [ sell through, fill rate, utilisation, occupancy ]

measures:
  count:
    label: Sale Count
    description: Distinct number of sale records. Not a ticket count — use Total
      Tickets Sold for tickets.
    aggregate_type: count
    synonyms: [ sale records, transactions ]

  total_tickets_sold:
    sql: ${tickets_sold}
    label: Total Tickets Sold
    format: number_0
    description: Total tickets sold. Default measure for ticket volume.
    aggregate_type: sum
    synonyms: [ tickets sold, tickets, attendance, units ]

  total_revenue:
    sql: ${revenue}
    label: Total Revenue
    format: currency_0
    description: Total ticket revenue. Default revenue metric for this model.
    aggregate_type: sum
    synonyms: [ sales, gross, revenue, takings, gross sales ]

  average_revenue_per_ticket:
    sql: ${total_revenue} / NULLIF(${total_tickets_sold}, 0)
    label: Average Revenue per Ticket
    format: currency_2
    description: Total revenue divided by total tickets sold. Use for yield /
      average selling price questions.
    synonyms: [ yield, average selling price, revenue per ticket, ASP ]

  average_sell_through:
    sql: ${sell_through_rate}
    label: Average Sell-Through
    format: percent_1
    description: The ONLY correct way to aggregate sell-through across events - the
      average of each event's own tickets sold divided by that event's venue
      capacity. Never compute sell-through by summing Total Tickets Sold across
      multiple events and dividing by a single venue capacity; that produces
      rates over 100%.
    aggregate_type: average
    synonyms:
      [
        average sell through,
        avg fill rate,
        average utilisation,
        average occupancy
      ]

  total_revenue_last_12_months:
    sql: ${revenue}
    label: Total Revenue (Last 12 Mo)
    format: currency_0
    description: Revenue for the rolling 12 months ending today. Compare against
      Total Revenue (Prior 12 Mo) for growth.
    aggregate_type: sum
    filters:
      se_sandbox_oscar__ticketek_event.event_date:
        time_for_duration: [ 12 months ago, 12 months ]

  total_revenue_prior_12_months:
    sql: ${revenue}
    label: Total Revenue (Prior 12 Mo)
    format: currency_0
    description: Revenue for the 12 months before the last 12 months (24 to 12
      months ago). Comparison base for Total Revenue (Last 12 Mo).
    aggregate_type: sum
    filters:
      se_sandbox_oscar__ticketek_event.event_date:
        time_for_duration: [ 24 months ago, 12 months ]

  total_tickets_last_12_months:
    sql: ${tickets_sold}
    label: Tickets Sold (Last 12 Mo)
    format: number_0
    description: Tickets sold for the rolling 12 months ending today. Compare
      against Tickets Sold (Prior 12 Mo) for growth.
    aggregate_type: sum
    filters:
      se_sandbox_oscar__ticketek_event.event_date:
        time_for_duration: [ 12 months ago, 12 months ]

  total_tickets_prior_12_months:
    sql: ${tickets_sold}
    label: Tickets Sold (Prior 12 Mo)
    format: number_0
    description: Tickets sold for the 12 months before the last 12 months (24 to 12
      months ago). Comparison base for Tickets Sold (Last 12 Mo).
    aggregate_type: sum
    filters:
      se_sandbox_oscar__ticketek_event.event_date:
        time_for_duration: [ 24 months ago, 12 months ]

  average_sell_through_last_12_months:
    sql: ${sell_through_rate}
    label: Average Sell-Through (Last 12 Mo)
    format: percent_1
    description: Average per-event sell-through for the rolling 12 months ending
      today. Compare against Average Sell-Through (Prior 12 Mo).
    aggregate_type: average
    filters:
      se_sandbox_oscar__ticketek_event.event_date:
        time_for_duration: [ 12 months ago, 12 months ]

  average_sell_through_prior_12_months:
    sql: ${sell_through_rate}
    label: Average Sell-Through (Prior 12 Mo)
    format: percent_1
    description: Average per-event sell-through for the 12 months before the last 12
      months (24 to 12 months ago). Comparison base for Average Sell-Through
      (Last 12 Mo).
    aggregate_type: average
    filters:
      se_sandbox_oscar__ticketek_event.event_date:
        time_for_duration: [ 24 months ago, 12 months ]

ai_context: Fact table, one row per ticket sale record per event. This is the
  base view of the Ticketek Ticket Sales topic. Default revenue metric is Total
  Revenue; default volume metric is Total Tickets Sold. Use Average Revenue per
  Ticket rather than dividing measures by hand. Sales have no date of their own
  - group and filter by Event Date on the Event view. For sell-through, fill
  rate, or occupancy questions ALWAYS use the Average Sell-Through measure (or
  the row-level Sell-Through Rate dimension at event grain). Never derive
  sell-through by dividing Total Tickets Sold by Venue Capacity across more than
  one event.
