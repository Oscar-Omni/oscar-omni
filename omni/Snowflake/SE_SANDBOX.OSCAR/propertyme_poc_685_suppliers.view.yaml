# Reference this view as se_sandbox_oscar__propertyme_poc_685_suppliers
catalog: SE_SANDBOX
schema: OSCAR
table_name: PROPERTYME_POC_685_SUPPLIERS

dimensions:
  synthetic_label:
    sql: '"SYNTHETIC_LABEL"'

  agency_id:
    sql: '"AGENCY_ID"'
    format: ID

  supplier_id:
    sql: '"SUPPLIER_ID"'
    format: ID

  supplier_name:
    sql: '"SUPPLIER_NAME"'

measures:
  count:
    aggregate_type: count
