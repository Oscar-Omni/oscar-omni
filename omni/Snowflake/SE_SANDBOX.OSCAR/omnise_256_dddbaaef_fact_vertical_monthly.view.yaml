# Reference this view as se_sandbox_oscar__omnise_256_dddbaaef_fact_vertical_monthly
label: Jet Synthesys - Vertical Monthly Actuals
description: "One row per vertical per calendar month, Jan-Aug 2026. All figures
  are synthetic. digiadz_ad_revenue_usd is a synthetic field name; DigiAdz is a
  legacy JetSynthesys brand, not a current one (see build-report.md). Demo build
  omnise_256_dddbaaef. Currency: USD, converted from INR at a fixed 95.8918 INR
  per USD (2026-09-25). Original INR fields are hidden for audit."

catalog: SE_SANDBOX
schema: OSCAR
table_name: OMNISE_256_DDDBAAEF_FACT_VERTICAL_MONTHLY

dimensions:
  vertical_id:
    sql: '"VERTICAL_ID"'
    label: Vertical ID
    format: ID
    ai_context: Join key to the vertical and budget views. Use the Vertical name
      from the vertical view for display.

  month_start_date:
    sql: '"MONTH_START_DATE"'
    label: Month
    description: First day of the calendar month. Native fact date; no separate
      calendar table since there are only 8 monthly points.
    ai_context: Monthly grain, January-August 2026. Use [month] granularity for
      trends; finer grains are meaningless. Joins to budget together with
      vertical_id.

  mau:
    sql: '"MAU"'
    label: Monthly Active Users (row)
    format: number_0
    description: Non-additive across months. Use the Average Monthly Active Users
      measure, never SUM, when aggregating over more than one month.
    ai_context: Row-level MAU for one vertical in one month. Do not sum across
      months; use Average Monthly Active Users. Summing across verticals is
      valid only within a single month.

  new_installs:
    sql: '"NEW_INSTALLS"'
    label: New Installs (row)
    format: number_0
    ai_context: Row-level installs; prefer the Total New Installs measure for aggregation.

  iap_revenue_inr:
    sql: '"IAP_REVENUE_INR"'
    label: IAP Revenue (row, INR)
    format: '"₹"#,##0'
    hidden: true

  digiadz_ad_revenue_inr:
    sql: '"DIGIADZ_AD_REVENUE_INR"'
    label: DigiAdz-branded Ad Revenue (row, INR) - legacy brand
    format: '"₹"#,##0'
    description: Ad revenue line originally branded DigiAdz. DigiAdz is a legacy
      JetSynthesys brand name, not current on jetsynthesys.com; see
      build-report.md.
    hidden: true

  vertical_month_key:
    sql: ${vertical_id} || CHR(45) || ${month_start_date}
    label: Vertical Month Key
    description: Composite key (vertical_id, month_start_date), synthesized because
      Omni requires a single primary key dimension per view.
    hidden: true
    primary_key: true

  iap_revenue_usd:
    sql: '"IAP_REVENUE_USD"'
    label: IAP Revenue (row, USD)
    format: '"$"#,##0'
    description: USD = IAP_REVENUE_INR / 95.8918; fixed demo FX rate 2026-09-25, MSE
      reference rate archive
    ai_context: Row-level IAP revenue in USD. Prefer Total IAP Revenue (USD) for
      aggregation.

  digiadz_ad_revenue_usd:
    sql: '"DIGIADZ_AD_REVENUE_USD"'
    label: DigiAdz-branded Ad Revenue (row, USD) - legacy brand
    format: '"$"#,##0'
    description: Ad revenue line originally branded DigiAdz. DigiAdz is a legacy
      JetSynthesys brand name, not current on jetsynthesys.com; see
      build-report.md.
    ai_context: Row-level ad revenue in USD. DigiAdz is a legacy brand; call it ad
      revenue and note the legacy brand if relevant. Prefer the total measure
      for aggregation.

measures:
  count:
    label: Row Count
    aggregate_type: count
    ai_context: Counts vertical-month rows, not users or events. Use only for
      data-coverage checks.

  average_mau:
    sql: '"MAU"'
    label: Average Monthly Active Users
    format: number_0
    description: AVERAGE(mau) over the filtered months. The only correct way to
      aggregate MAU across more than one month; never SUM.
    aggregate_type: average
    ai_context: "The governed way to report MAU across months. Synonyms: active
      users, audience, MAU. For a portfolio multi-month figure, average the
      monthly portfolio totals rather than averaging vertical rows."

  total_new_installs:
    sql: '"NEW_INSTALLS"'
    label: Total New Installs
    format: number_0
    aggregate_type: sum
    ai_context: Additive; sum freely across months and verticals. Use for
      acquisition or audience-growth questions.

  total_iap_revenue_inr:
    sql: '"IAP_REVENUE_INR"'
    label: Total IAP Revenue (INR)
    format: '"₹"#,##0'
    hidden: true
    aggregate_type: sum

  total_digiadz_ad_revenue_inr:
    sql: '"DIGIADZ_AD_REVENUE_INR"'
    label: Total DigiAdz-branded Ad Revenue (INR) - legacy brand
    format: '"₹"#,##0'
    description: Legacy DigiAdz-branded ad revenue line; DigiAdz is not a current
      JetSynthesys brand (see build-report.md).
    hidden: true
    aggregate_type: sum

  total_blended_revenue_inr:
    sql: '"IAP_REVENUE_INR" + "DIGIADZ_AD_REVENUE_INR"'
    label: Total Blended Revenue (INR)
    format: '"₹"#,##0'
    description: SUM(iap_revenue_inr + digiadz_ad_revenue_inr). IAP plus the legacy
      DigiAdz-branded ad revenue line.
    hidden: true
    aggregate_type: sum

  iap_only_arpu_inr:
    sql: ${total_iap_revenue_inr} / NULLIF(${average_mau}, 0)
    label: IAP-only ARPU (INR)
    format: '"₹"#,##0.00'
    description: SUM(iap_revenue_inr) / AVERAGE(mau) over the filtered months. Never
      average pre-computed monthly ARPU values directly.
    hidden: true

  blended_arpu_inr:
    sql: (${total_iap_revenue_inr} + ${total_digiadz_ad_revenue_inr}) /
      NULLIF(${average_mau}, 0)
    label: Blended ARPU (INR)
    format: '"₹"#,##0.00'
    description: SUM(iap_revenue_inr + digiadz_ad_revenue_inr) / AVERAGE(mau) over
      the filtered months. Includes the legacy DigiAdz-branded ad revenue line.
    hidden: true

  total_iap_revenue_usd:
    sql: '"IAP_REVENUE_USD"'
    label: Total IAP Revenue (USD)
    format: '"$"#,##0'
    aggregate_type: sum
    ai_context: In-app purchase revenue in USD, additive. Excludes ad revenue.

  total_digiadz_ad_revenue_usd:
    sql: '"DIGIADZ_AD_REVENUE_USD"'
    label: Total DigiAdz-branded Ad Revenue (USD) - legacy brand
    format: '"$"#,##0'
    description: Legacy DigiAdz-branded ad revenue line; DigiAdz is not a current
      JetSynthesys brand (see build-report.md).
    aggregate_type: sum
    ai_context: Ad revenue in USD, additive. Use for 'ad revenue' questions; DigiAdz
      is a legacy brand name.

  total_blended_revenue_usd:
    sql: '"IAP_REVENUE_USD" + "DIGIADZ_AD_REVENUE_USD"'
    label: Total Blended Revenue (USD)
    format: '"$"#,##0'
    description: SUM(iap_revenue_usd + digiadz_ad_revenue_usd). IAP plus the legacy
      DigiAdz-branded ad revenue line.
    aggregate_type: sum
    ai_context: "Default measure for 'revenue' or 'total revenue': IAP plus ad
      revenue in USD. Additive."

  iap_only_arpu_usd:
    sql: ${total_iap_revenue_usd} / NULLIF(${average_mau}, 0)
    label: IAP-only ARPU (USD)
    format: '"$"#,##0.00'
    description: SUM(iap_revenue_usd) / AVERAGE(mau) over the filtered months. Never
      average pre-computed monthly ARPU values directly.
    ai_context: Use when asked for IAP ARPU or ARPU excluding ads. Already computed
      as total IAP revenue / average MAU; never average monthly ARPU values.

  blended_arpu_usd:
    sql: (${total_iap_revenue_usd} + ${total_digiadz_ad_revenue_usd}) /
      NULLIF(${average_mau}, 0)
    label: Blended ARPU (USD)
    format: '"$"#,##0.00'
    description: SUM(iap_revenue_usd + digiadz_ad_revenue_usd) / AVERAGE(mau) over
      the filtered months. Includes the legacy DigiAdz-branded ad revenue line.
    ai_context: Default measure for 'ARPU' or revenue per user, including ad
      revenue. Pair with Average Monthly Active Users to separate volume from
      yield when explaining changes.

ai_context: "Monthly actuals, one row per vertical per month, January–August
  2026 (synthetic data). Always use USD fields; INR fields are hidden for audit
  only (fixed rate 95.8918 INR per USD). MAU is non-additive: use Average
  Monthly Active Users across months and never sum MAU over time. For a
  portfolio-level single month, MAU can be summed across verticals for that
  month; for multi-month portfolio figures, average the monthly portfolio
  totals. New installs and revenue measures are additive and can be summed.
  IAP-only ARPU excludes ad revenue; Blended ARPU includes IAP plus the legacy
  DigiAdz-branded ad revenue. Compute ARPU with the governed measures (total
  revenue / average MAU) and never average monthly ARPU values. To explain
  changes, separate audience volume (MAU, installs) from revenue per user
  (ARPU). No campaign, release, outage or event data exists, so do not invent
  operational causes. Always state the period and metric used."
