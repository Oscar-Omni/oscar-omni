# Reference this view as se_sandbox_oscar__ticketek_event
label: Event
description: Individual events/shows, with tour, artist, venue and list ticket price.

catalog: SE_SANDBOX
schema: OSCAR
table_name: TICKETEK_EVENT

dimensions:
  event_id:
    sql: '"EVENT_ID"'
    label: Event ID
    format: ID
    primary_key: true

  artist_id:
    sql: '"ARTIST_ID"'
    label: Artist ID
    format: ID

  venue_id:
    sql: '"VENUE_ID"'
    label: Venue ID
    format: ID

  event_date:
    sql: '"EVENT_DATE"'
    label: Event Date
    description: Date the event takes place. Primary date field for trend and time filters.
    synonyms: [ show date, date, performance date ]

  event_date_end:
    sql: '"EVENT_DATE_END"'
    label: Event End Date
    description: End date for multi-day events.
    synonyms: [ end date ]

  tour_title:
    sql: '"TOUR_TITLE"'
    label: Tour Title
    description: Name of the tour the event belongs to.
    synonyms: [ tour, show name ]

  ticket_price:
    sql: '"TICKET_PRICE"'
    label: Ticket Price
    format: currency_2
    description: List ticket price for the event. Not actual revenue collected.
    synonyms: [ list price, face value, price ]

  source:
    sql: '"SOURCE"'
    description: Technical load-source column; not useful for analysis.
    hidden: true

  empty_seat_value:
    sql: (${se_sandbox_oscar__ticketek_venue.capacity} -
      ${se_sandbox_oscar__ticketek_ticket_sale.tickets_sold}) * ${ticket_price}
    label: Empty Seat Value
    description: Row-level value of unsold seats for this event. Aggregate with
      Unrealized Revenue.
    hidden: true

measures:
  count:
    label: Event Count
    description: Distinct number of events.
    aggregate_type: count
    synonyms: [ shows, number of events, gigs ]

  average_ticket_price:
    sql: ${ticket_price}
    label: Average Ticket Price
    format: currency_2
    description: Average list ticket price across events.
    aggregate_type: average
    synonyms: [ avg price, average face value ]

  unrealized_revenue:
    sql: ${empty_seat_value}
    label: Unrealized Revenue
    format: currency_0
    description: Value of unsold seats - each event's empty seats (venue capacity
      minus tickets sold) times that event's list ticket price, summed. Requires
      venue and ticket sale to be joined. Use for missed revenue and oversizing
      questions.
    aggregate_type: sum
    synonyms:
      [
        unrealised revenue,
        missed revenue,
        empty seat value,
        lost revenue,
        unsold revenue
      ]

  unrealized_revenue_last_12_months:
    sql: ${empty_seat_value}
    label: Unrealized Revenue (Last 12 Mo)
    format: currency_0
    description: Unrealized revenue for the rolling 12 months ending today. Compare
      against Unrealized Revenue (Prior 12 Mo) for growth.
    aggregate_type: sum
    filters:
      event_date:
        time_for_duration: [ 12 months ago, 12 months ]

  unrealized_revenue_prior_12_months:
    sql: ${empty_seat_value}
    label: Unrealized Revenue (Prior 12 Mo)
    format: currency_0
    description: Unrealized revenue for the 12 months before the last 12 months (24
      to 12 months ago). Comparison base for Unrealized Revenue (Last 12 Mo).
    aggregate_type: sum
    filters:
      event_date:
        time_for_duration: [ 24 months ago, 12 months ]

  events_last_12_months:
    label: Event Count (Last 12 Mo)
    description: Events in the rolling 12 months ending today. Compare against Event
      Count (Prior 12 Mo) for growth.
    aggregate_type: count
    filters:
      event_date:
        time_for_duration: [ 12 months ago, 12 months ]

  events_prior_12_months:
    label: Event Count (Prior 12 Mo)
    description: Events in the 12 months before the last 12 months (24 to 12 months
      ago). Comparison base for Event Count (Last 12 Mo).
    aggregate_type: count
    filters:
      event_date:
        time_for_duration: [ 24 months ago, 12 months ]

ai_context: One row per event/show. This is the main time dimension for the
  model — use event_date for any "over time", "by month", or date-filtered
  question about ticket sales. Ticket Price is the list price on the event;
  actual money collected is Total Revenue on Ticket Sale. For the value of
  unsold seats use the Unrealized Revenue measure.
