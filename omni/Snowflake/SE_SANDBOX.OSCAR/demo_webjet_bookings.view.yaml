    sql: '"BOOKING_ID"'
    format: ID

  booking_date:
    sql: '"BOOKING_DATE"'

  product_id:
    sql: '"PRODUCT_ID"'
    format: ID

  channel_id:
    sql: '"CHANNEL_ID"'
    format: ID

  destination_id:
    sql: '"DESTINATION_ID"'
    format: ID

  customer_state:
    sql: '"CUSTOMER_STATE"'

  ttv_aud:
    sql: '"TTV_AUD"'

  service_fee_aud:
    sql: '"SERVICE_FEE_AUD"'

  revenue_aud:
    sql: '"REVENUE_AUD"'

  acquisition_cost_aud:
    sql: '"ACQUISITION_COST_AUD"'

measures:
  count:
    aggregate_type: count
