# Reference this view as se_sandbox_oscar__demo_australian_clinical_labs_regions
catalog: SE_SANDBOX
schema: OSCAR
table_name: DEMO_AUSTRALIAN_CLINICAL_LABS_REGIONS

dimensions:
  region_id:
    sql: '"REGION_ID"'
    format: ID

  region_name:
    sql: '"REGION_NAME"'

  state_name:
    sql: '"STATE_NAME"'

  area_type:
    sql: '"AREA_TYPE"'

measures:
  count:
    aggregate_type: count
