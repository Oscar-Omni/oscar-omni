  closing_accounts_sum:
    sql: ${closing_accounts}
    label: Closing Accounts
    format: NUMBER
    aggregate_type: sum

  retained_accounts_sum:
    sql: ${retained_accounts}
    label: Retained Accounts
    format: NUMBER
    aggregate_type: sum

  multi_module_accounts_sum:
    sql: ${multi_module_accounts}
    label: Multi Module Accounts
    format: NUMBER
    aggregate_type: sum

  weekly_active_accounts_sum:
    sql: ${weekly_active_accounts}
    label: Weekly Active Accounts
    format: NUMBER
    aggregate_type: sum

  assessments_completed_sum:
    sql: ${assessments_completed}
    label: Assessments Completed
    format: NUMBER
    aggregate_type: sum

  trial_count_sum:
    sql: ${trial_count}
    label: Trial Count
    format: NUMBER
    aggregate_type: sum

  first_vendor_7d_sum:
    sql: ${first_vendor_7d}
    label: First Vendor 7D
    format: NUMBER
    aggregate_type: sum

  five_vendors_7d_sum:
    sql: ${five_vendors_7d}
    label: Five Vendors 7D
    format: NUMBER
    aggregate_type: sum

  activated_7d_sum:
    sql: ${activated_7d}
    label: Activated 7D
    format: NUMBER
    aggregate_type: sum

  paid_30d_sum:
    sql: ${paid_30d}
    label: Paid 30D
    format: NUMBER
    aggregate_type: sum

  activation_rate:
    sql: ${activated_7d_sum} / NULLIF(${trial_count_sum}, 0)
    label: Activation Rate
    format: PERCENT_1

  coverage_rate:
    sql: ${five_vendors_7d_sum} / NULLIF(${first_vendor_7d_sum}, 0)
    label: Coverage Rate
    format: PERCENT_1

  paid_conversion_rate:
    sql: ${paid_30d_sum} / NULLIF(${trial_count_sum}, 0)
    label: Paid Conversion Rate
    format: PERCENT_1

  activated_to_paid_rate:
    sql: ${paid_30d_sum} / NULLIF(${activated_7d_sum}, 0)
    label: Activated To Paid Rate
    format: PERCENT_1

  monthly_nrr:
    sql: (${opening_arr_usd_sum} + ${expansion_arr_usd_sum} - ${churn_arr_usd_sum} -
      ${contraction_arr_usd_sum}) / NULLIF(${opening_arr_usd_sum}, 0)
    label: Monthly NRR
    format: PERCENT_1
