# Reference this view as se_sandbox_oscar__upguard_20260924_growth_month
label: UpGuard Growth Month
description: Synthetic demo. USD amounts. Snapshot balances must be grouped or
  filtered to one month, never summed over time.

catalog: SE_SANDBOX
schema: OSCAR
table_name: UPGUARD_20260924_GROWTH_MONTH

dimensions:
  month:
    sql: '"MONTH"'

  region:
    sql: '"REGION"'

