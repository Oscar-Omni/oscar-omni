  opening_arr_usd_sum:
    sql: ${opening_arr_usd}
    label: Opening Arr Usd
    format: USDCURRENCY
    aggregate_type: sum

  new_arr_usd_sum:
    sql: ${new_arr_usd}
    label: New Arr Usd
    format: USDCURRENCY
    aggregate_type: sum

  expansion_arr_usd_sum:
    sql: ${expansion_arr_usd}
    label: Expansion Arr Usd
    format: USDCURRENCY
    aggregate_type: sum

  contraction_arr_usd_sum:
    sql: ${contraction_arr_usd}
    label: Contraction Arr Usd
    format: USDCURRENCY
    aggregate_type: sum

  churn_arr_usd_sum:
    sql: ${churn_arr_usd}
    label: Churn Arr Usd
    format: USDCURRENCY
    aggregate_type: sum

  closing_arr_usd_sum:
    sql: ${closing_arr_usd}
    label: Closing Arr Usd
    format: USDCURRENCY
    aggregate_type: sum

  opening_accounts_sum:
    sql: ${opening_accounts}
    label: Opening Accounts
    format: NUMBER
    aggregate_type: sum

  new_accounts_sum:
    sql: ${new_accounts}
    label: New Accounts
    format: NUMBER
    aggregate_type: sum

  expanding_accounts_sum:
    sql: ${expanding_accounts}
    label: Expanding Accounts
    format: NUMBER
    aggregate_type: sum

  contracting_accounts_sum:
    sql: ${contracting_accounts}
    label: Contracting Accounts
    format: NUMBER
