# Reference this view as se_sandbox_oscar__ticketek_venue
label: Venue
description: Venues hosting events, with location, capacity and contracted promoter.

catalog: SE_SANDBOX
schema: OSCAR
table_name: TICKETEK_VENUE

dimensions:
  venue_id:
    sql: '"VENUE_ID"'
    label: Venue ID
    format: ID
    primary_key: true

  name:
    sql: '"NAME"'
    label: Venue Name
    description: Venue name. Use this rather than venue ID in results.
    synonyms: [ venue, arena, stadium ]

  city:
    sql: '"CITY"'
    label: City
    description: City the venue is in.
    synonyms: [ town, location ]

  state:
    sql: '"STATE"'
    label: State
    description: Australian state or territory abbreviation.
    sample_values: [ NSW, VIC, QLD, WA, SA, TAS, ACT, NT ]
    synonyms: [ region, territory ]

  capacity:
    sql: '"CAPACITY"'
    label: Capacity
    format: number_0
    description: Seated/standing capacity of the venue. Compare against tickets sold
      for sell-through.
    synonyms: [ seats, size, max attendance ]

  promoter_id:
    sql: '"PROMOTER_ID"'
    label: Promoter ID
    format: ID

  source:
    sql: '"SOURCE"'
    description: Technical load-source column; not useful for analysis.
    hidden: true

  latitude:
    sql: '"LATITUDE"'
    label: Latitude
    description: Venue latitude (approximate, city-level with venue offset). Pair
      with Longitude for map visualisations.

  longitude:
    sql: '"LONGITUDE"'
    label: Longitude
    description: Venue longitude (approximate, city-level with venue offset). Pair
      with Latitude for map visualisations.

measures:
  count:
    label: Venue Count
    description: Distinct number of venues.
    aggregate_type: count
    synonyms: [ number of venues ]

  total_capacity:
    sql: ${capacity}
    label: Total Capacity
    format: number_0
    description: Sum of venue capacity. Only meaningful across distinct venues.
    aggregate_type: sum
    synonyms: [ combined capacity ]

  average_capacity:
    sql: ${capacity}
    label: Average Capacity
    format: number_0
    description: Average venue capacity.
    aggregate_type: average
    synonyms: [ avg capacity, typical size ]

ai_context: One row per venue, with Australian location and seating capacity,
  and the contracted promoter. Use venue name for reporting and state/city for
  geographic breakdowns (states are Australian abbreviations). Capacity is per
  venue — use Average Capacity when grouping by venue attributes and Total
  Capacity only when summing distinct venues.
