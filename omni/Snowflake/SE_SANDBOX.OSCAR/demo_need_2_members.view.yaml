# Reference this view as se_sandbox_oscar__demo_need_2_members
label: Members
description: One row per policyholder ever enrolled through a partner since
  April 2024. Synthetic Need data.

catalog: SE_SANDBOX
schema: OSCAR
table_name: DEMO_NEED_2_MEMBERS

dimensions:
  member_id:
    sql: '"MEMBER_ID"'
    label: Member ID
    format: ID
    primary_key: true

  partner_id:
    sql: '"PARTNER_ID"'
    format: ID
    hidden: true

  acquisition_channel:
    sql: '"ACQUISITION_CHANNEL"'
    label: Member Acquisition Channel
    hidden: true

  region:
    sql: '"REGION"'
    label: Member Region
    hidden: true

  enrol_ts_utc:
    sql: '"ENROL_TS_UTC"'
    label: Enrolled At (UTC)
    description: Policy issue time as stored by the app, UTC
    convert_tz: false

  enrol_date_kst:
    sql: '"ENROL_DATE_KST"'
    label: Enrolment Date (KST)
    description: Governed business date of enrolment, UTC plus 9 hours

  cohort_month:
    sql: '"COHORT_MONTH"'
    label: Cohort Month (KST)
    description: First day of the KST month the member enrolled
    synonyms: [ cohort, enrolment cohort ]

  plan_tier:
    sql: '"PLAN_TIER"'
    label: Plan Tier
    description: Basic or Plus

  activated_90d:
    sql: '"ACTIVATED_90D"'
    label: Activated in First 90 Days
    description: 1 when the member used the AI chatbot in at least 2 of the first 3
      months or uploaded a health checkup in that time
    synonyms: [ activated, activation ]

  lapse_ts_utc:
    sql: '"LAPSE_TS_UTC"'
    label: Lapsed At (UTC)
    description: Time the policy lapsed, UTC. Non payment lapses show 15:30 UTC on
      the last day of a month, which is 00:30 KST on the 1st.
    convert_tz: false

  lapse_date_kst:
    sql: '"LAPSE_DATE_KST"'
    label: Lapse Date (KST)
    description: Governed lapse date, UTC plus 9 hours

  lapse_date_utc:
    sql: '"LAPSE_DATE_UTC"'
    label: Lapse Date (UTC, reconciliation)
    description: Lapse timestamp truncated in UTC. Kept only to reproduce the naive
      UTC count.

  lapse_reason:
    sql: '"LAPSE_REASON"'
    label: Lapse Reason
    description: customer_cancel, non_payment or partner_transfer; empty while in force
    synonyms: [ cancellation reason ]

measures:
  count:
    aggregate_type: count

  member_count:
    sql: ${member_id}
    label: Members
    format: number_0
    aggregate_type: count_distinct

  activated_rate:
    sql: ${activated_90d}
    label: Activation Rate (90 days)
    format: percent_1
    description: Share of members activated in their first 90 days
    aggregate_type: average
    synonyms: [ activation rate ]
