# Reference this view as se_sandbox_oscar__demo_shippit_2_shipments
label: Shipments
description: One row per synthetic parcel shipped by a merchant through Shippit,
  1 July 2024 to 30 September 2026.

catalog: SE_SANDBOX
schema: OSCAR
table_name: DEMO_SHIPPIT_2_SHIPMENTS

dimensions:
  shipment_id:
    sql: '"SHIPMENT_ID"'
    label: Shipment ID
    format: ID
    primary_key: true
    synonyms: [ consignment, parcel id, label ]

  ship_date:
    sql: '"SHIP_DATE"'
    label: Ship date
    description: Date the parcel was handed to the carrier. The dashboard date field.
    synonyms: [ shipped date, dispatch date ]

  merchant_name:
    sql: '"MERCHANT_NAME"'
    label: Merchant
    description: Embed tenant. Each user sees only their own merchant through the
      demo_tenant access filter.
    synonyms: [ retailer, store, brand ]

  carrier_id:
    sql: '"CARRIER_ID"'
    label: Carrier ID
    format: ID
    hidden: true

  zone_id:
    sql: '"ZONE_ID"'
    label: Zone ID
    format: ID
    hidden: true

  service_level:
    sql: '"SERVICE_LEVEL"'
    label: Service level
    description: Standard, Express or Same day.
    synonyms: [ service, delivery speed ]

  allocation_rule:
    sql: '"ALLOCATION_RULE"'
    label: Allocation rule
    description: Rule that picked the carrier for the parcel. Cheapest, Fastest or
      Preferred carrier.
    synonyms: [ carrier rule, allocation, rule ]

  promised_date:
    sql: '"PROMISED_DATE"'
    label: Promised date
    description: Delivery date promised to the receiver at checkout. On time is
      measured against it.
    synonyms: [ delivery promise, ETA, promise date ]

  delivered_date:
    sql: '"DELIVERED_DATE"'
    label: Delivered date
    description: Date delivered to the receiver. Null when returned to sender or lost.

  shipment_count:
    sql: '"SHIPMENT_COUNT"'
    hidden: true

  is_delivered:
    sql: '"IS_DELIVERED"'
    label: Is delivered
    description: 1 when delivered, else 0.

  is_on_time:
    sql: '"IS_ON_TIME"'
    label: Is on time
    description: 1 when delivered on or before the promised date.

  is_late:
    sql: '"IS_LATE"'
    label: Is late
    description: 1 when delivered after the promised date.

  is_failed_attempt:
    sql: '"IS_FAILED_ATTEMPT"'
    label: Failed first attempt flag
    description: 1 when the first delivery attempt failed (carded or redelivered).

  transit_days:
    sql: '"TRANSIT_DAYS"'
    label: Transit days
    description: Delivered date minus ship date, delivered parcels only.

  days_late:
    sql: '"DAYS_LATE"'
    label: Days late
    description: Days delivered after the promised date, 0 when on time.
    synonyms: [ lateness, delay ]

  carrier_cost_aud:
    sql: '"CARRIER_COST_AUD"'
    label: Carrier cost (A$)
    format: audcurrency_2
    description: Carrier charge for the parcel in AUD.

measures:
  count:
    aggregate_type: count

  parcels:
    sql: ${shipment_count}
    label: Parcels
    format: number_0
    description: Parcels shipped.
    aggregate_type: sum
    synonyms: [ orders shipped, volume, shipments, parcel count ]

  delivered_parcels:
    sql: ${is_delivered}
    label: Delivered parcels
    format: number_0
    aggregate_type: sum

  on_time_parcels:
    sql: ${is_on_time}
    label: On time parcels
    format: number_0
    description: Parcels delivered on or before the promised date.
    aggregate_type: sum

  late_parcels:
    sql: ${is_late}
    label: Late parcels
    format: number_0
    description: Parcels delivered after the promised date.
    aggregate_type: sum
    synonyms: [ late deliveries, missed promises ]

  on_time_rate:
    sql: ${on_time_parcels} / NULLIF(${delivered_parcels}, 0)
    label: On time rate
    format: percent_1
    description: On time parcels over delivered parcels. A ratio of sums; never
      average zone, carrier or month rates.
    synonyms: [ on time, OTD, on time delivery rate, delivery performance ]

  failed_attempts:
    sql: ${is_failed_attempt}
    label: Failed first attempts
    format: number_0
    aggregate_type: sum
    synonyms: [ carded, redelivery, redeliveries ]

  failed_attempt_rate:
    sql: ${failed_attempts} / NULLIF(${parcels}, 0)
    label: Failed first attempt rate
    format: percent_1
    description: Failed first attempts over all parcels.
    synonyms: [ failed delivery, failed delivery rate ]

  carrier_cost:
    sql: ${carrier_cost_aud}
    label: Carrier cost
    format: audcurrency_0
    description: Total carrier charges in AUD.
    aggregate_type: sum
    synonyms: [ shipping cost, carrier spend, freight spend ]

  cost_per_parcel:
    sql: ${carrier_cost} / NULLIF(${parcels}, 0)
    label: Cost per parcel
    format: audcurrency_2
    description: Carrier cost over parcels, in AUD.
    synonyms: [ cost per shipment, shipping cost per parcel ]

  total_transit_days:
    sql: ${transit_days}
    hidden: true
    aggregate_type: sum

  avg_transit_days:
    sql: ${total_transit_days} / NULLIF(${delivered_parcels}, 0)
    label: Average transit days
    format: number_1
    description: Transit days over delivered parcels.
    synonyms: [ transit time, delivery time ]
