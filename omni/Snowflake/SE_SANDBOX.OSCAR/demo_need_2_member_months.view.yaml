# Reference this view as se_sandbox_oscar__demo_need_2_member_months
label: Member Months
description: One row per member per KST calendar month from enrolment (or April
  2025) to lapse, including the lapse month. Synthetic Need data.

catalog: SE_SANDBOX
schema: OSCAR
table_name: DEMO_NEED_2_MEMBER_MONTHS

dimensions:
  member_id:
    sql: '"MEMBER_ID"'
    label: Member ID
    format: ID

  month_start:
    sql: '"MONTH_START"'
    label: Month (KST)
    description: First day of the Korea Standard Time calendar month. Use an
      exclusive end date in filters.
    synonyms: [ month, KST month, reporting month ]

  partner_id:
    sql: '"PARTNER_ID"'
    label: Partner ID
    format: ID

  acquisition_channel:
    sql: '"ACQUISITION_CHANNEL"'
    label: Acquisition Channel
    description: partner_app_embed, direct_app, telesales, employer_group or
      agent_branch (insurer agents)
    synonyms: [ channel, insurer agents, source ]

  region:
    sql: '"REGION"'
    label: Region
    description: Seoul, Gyeonggi, Incheon, Busan, Daegu or Daejeon
    synonyms: [ province, city ]

  months_since_enrol:
    sql: '"MONTHS_SINCE_ENROL"'
    label: Months Since Enrolment
    description: Tenure in months, 0 in the enrolment month
    synonyms: [ tenure ]

  is_enrol_month:
    sql: '"IS_ENROL_MONTH"'
    label: Is Enrolment Month
    description: 1 in the KST month the policy was issued

  exposed_in_month:
    sql: '"EXPOSED_IN_MONTH"'
    label: Exposed in Month
    description: 1 on every row, in force at month start or issued during the month

  in_force_eom:
    sql: '"IN_FORCE_EOM"'
    label: In Force at KST Month End
    description: 1 when the policy is in force at 24:00 KST on the last day of the month
    synonyms: [ in force ]

  in_force_eom_utc_naive:
    sql: '"IN_FORCE_EOM_UTC_NAIVE"'
    label: In Force at UTC Month End (reconciliation)
    description: Reproduces the UTC dated pull that disagrees with KST.
      Reconciliation only, never for reporting.

  lapsed_in_month:
    sql: '"LAPSED_IN_MONTH"'
    label: Lapsed in Month
    description: 1 in the KST month the policy lapsed
    synonyms: [ cancellations, cancelled ]

  chatbot_sessions:
    sql: '"CHATBOT_SESSIONS"'
    label: Chatbot Sessions
    description: AI chatbot sessions in the month
    synonyms: [ chatbot use ]

  checkup_uploaded:
    sql: '"CHECKUP_UPLOADED"'
    label: Checkup Uploaded
    description: 1 when a health checkup result was uploaded for analysis in the month
    synonyms: [ checkup upload ]

  engaged_in_month:
    sql: '"ENGAGED_IN_MONTH"'
    label: Engaged in Month
    description: 1 when the member had at least one AI chatbot session or uploaded a
      health checkup in the month
    synonyms: [ engaged, active ]

  stage_at_month_start:
    sql: '"STAGE_AT_MONTH_START"'
    label: Care Stage at Month Start
    description: Screening, Treatment or Recovery
    synonyms: [ care stage, stage ]

  stage_at_month_end:
    sql: '"STAGE_AT_MONTH_END"'
    label: Care Stage at Month End
    description: Screening, Treatment, Recovery or Lapsed

  early_exposed:
    sql: '"EARLY_EXPOSED"'
    label: Early Tenure Exposed
    description: 1 when the row is in tenure months 0 to 5

  early_engaged:
    sql: '"EARLY_ENGAGED"'
    label: Early Tenure Engaged
    description: engaged_in_month on rows in tenure months 0 to 5

  early_lapsed:
    sql: '"EARLY_LAPSED"'
    label: Early Tenure Lapsed
    description: lapsed_in_month on rows in tenure months 0 to 5

  premium_aud:
    sql: '"PREMIUM_AUD"'
    label: Monthly Premium (AUD)
    description: Synthetic premium charged this month, 36 Basic or 52 Plus when in
      force at month end
    hidden: true

  member_month_id:
    sql: "\"MEMBER_ID\" || '_' || TO_CHAR(\"MONTH_START\", 'YYYY-MM')"
    description: Member id and KST month, the grain of this table
    hidden: true
    primary_key: true

measures:
  count:
    label: Member Months
    aggregate_type: count

  new_policyholders:
    sql: ${is_enrol_month}
    label: New Policyholders
    format: number_0
    description: Policies issued in the period, counted on the KST enrolment month.
      Additive across months.
    aggregate_type: sum
    synonyms: [ new members, sign ups, enrolments, new business ]

  policyholder_count:
    sql: ${in_force_eom}
    label: Policyholders (KST)
    format: number_0
    description: Point in time count of policies in force at 24:00 KST on the last
      day of a month. Use per month or for the last month of a range only; never
      add months together. The one governed definition that replaces the UTC and
      KST variants pulled by hand.
    aggregate_type: sum
    synonyms: [ policyholders, policyholder count, in force, book size, members in force ]

  policyholder_count_utc_naive:
    sql: ${in_force_eom_utc_naive}
    label: Policyholders (UTC pull, reconciliation)
    format: number_0
    description: Reconciliation only. The count a UTC dated pull produces; it misses
      the partners' non payment batch processed at 00:30 KST on the 1st. Never
      use for reporting.
    aggregate_type: sum
    synonyms: [ UTC count ]

  total_premium_aud:
    sql: ${premium_aud}
    label: Premium (AUD)
    format: currency_0
    description: Synthetic premium in AUD on in force months. Invented price points,
      not Need or partner pricing.
    aggregate_type: sum
    synonyms: [ premium, revenue, premium aud ]

  lapses:
    sql: ${lapsed_in_month}
    label: Lapses
    format: number_0
    description: Policies that lapsed in the KST month
    aggregate_type: sum
    synonyms: [ cancellations ]

  exposed_months:
    sql: ${exposed_in_month}
    label: Exposed Member Months
    format: number_0
    aggregate_type: sum

  early_exposed_months:
    sql: ${early_exposed}
    label: Early Exposed Member Months
    format: number_0
    description: Member months in tenure months 0 to 5
    aggregate_type: sum

  early_engaged_months:
    sql: ${early_engaged}
    label: Early Engaged Member Months
    format: number_0
    aggregate_type: sum

  early_lapses:
    sql: ${early_lapsed}
    label: Early Lapses
    format: number_0
    description: Lapses in tenure months 0 to 5
    aggregate_type: sum

  early_engaged_rate:
    sql: ${early_engaged_months} / NULLIF(${early_exposed_months}, 0)
    label: Early Engaged Rate
    format: percent_1
    description: Share of member months in the first six months of tenure (months 0
      to 5) with an AI chatbot session or a health checkup upload
    synonyms: [ engagement, early engagement, engaged rate ]

  early_lapse_rate:
    sql: ${early_lapses} / NULLIF(${early_exposed_months}, 0)
    label: Early Lapse Rate
    format: percent_2
    description: Lapses in the first six months of tenure over member months exposed
      in that band. The rate to use for early churn questions.
    synonyms: [ early churn, early lapse ]

  monthly_lapse_rate:
    sql: ${lapses} / NULLIF(${exposed_months}, 0)
    label: Monthly Lapse Rate
    format: percent_2
    description: Lapses in the KST month over policies exposed in the month, whole book
    synonyms: [ churn, lapse rate, churn rate ]

  total_chatbot_sessions:
    sql: ${chatbot_sessions}
    label: Chatbot Sessions
    format: number_0
    aggregate_type: sum
    synonyms: [ chatbot use ]
