# Reference this view as se_sandbox_oscar__omnise_jet_creator_monthly_2026
label: Jet Synthesys Creator Monthly Demo
description: Synthetic creator-month demo metrics, Jan-Aug 2026. Roster names
  sourced from jetsynthesys.com/creators; all audience and financial values are
  invented.

catalog: SE_SANDBOX
schema: OSCAR
table_name: OMNISE_JET_CREATOR_MONTHLY_2026

dimensions:
  creator_id:
    sql: '"CREATOR_ID"'
    format: ID
    hidden: true

  creator_name:
    sql: '"CREATOR_NAME"'

  category:
    sql: '"CATEGORY"'

  creator_tag:
    sql: '"CREATOR_TAG"'

  month_start_date:
    sql: '"MONTH_START_DATE"'

  followers:
    sql: '"FOLLOWERS"'

  new_followers:
    sql: '"NEW_FOLLOWERS"'

  content_views:
    sql: '"CONTENT_VIEWS"'

  sponsorship_revenue_usd:
    sql: '"SPONSORSHIP_REVENUE_USD"'

  platform_revenue_usd:
    sql: '"PLATFORM_REVENUE_USD"'

  related_vertical_id:
    sql: '"RELATED_VERTICAL_ID"'
    format: ID
    hidden: true

  creator_month_key:
    sql: ${creator_id} || '-' || TO_VARCHAR(${month_start_date}, 'YYYY-MM')
    hidden: true
    primary_key: true

measures:
  count:
    aggregate_type: count

  total_content_views:
    sql: ${content_views}
    label: Content Views
    aggregate_type: sum

  total_sponsorship_revenue_usd:
    sql: ${sponsorship_revenue_usd}
    label: Sponsorship Revenue (USD)
    format: currency_2
    aggregate_type: sum

  total_platform_revenue_usd:
    sql: ${platform_revenue_usd}
    label: Platform Revenue (USD)
    format: currency_2
    aggregate_type: sum

  total_revenue_usd:
    sql: ${sponsorship_revenue_usd} + ${platform_revenue_usd}
    label: Creator Revenue (USD)
    format: currency_2
    aggregate_type: sum

  revenue_per_thousand_views_usd:
    sql: ${total_revenue_usd} * 1000 / NULLIF(${total_content_views}, 0)
    label: Revenue per 1,000 Views (USD)
    format: currency_2
