  supplier_spend_aud:
    sql: '"SUPPLIER_SPEND_AUD"'

  other_cost_aud:
    sql: '"OTHER_COST_AUD"'

  total_cost_aud:
    sql: '"TOTAL_COST_AUD"'

  gross_margin_aud:
    sql: '"GROSS_MARGIN_AUD"'

  budget_margin_aud:
    sql: '"BUDGET_MARGIN_AUD"'

  margin_vs_budget_aud:
    sql: '"MARGIN_VS_BUDGET_AUD"'

  off_panel_spend_aud:
    sql: '"OFF_PANEL_SPEND_AUD"'

