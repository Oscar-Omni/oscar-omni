# Reference this view as se_sandbox_oscar__omnise_326_b14b2ec5_brigade_availability
label: Brigade availability
description: One row per brigade, month and time band with the average crew able
  to respond and the crew required. Synthetic.

catalog: SE_SANDBOX
schema: OSCAR
table_name: OMNISE_326_B14B2EC5_BRIGADE_AVAILABILITY

dimensions:
  brigade_id:
    sql: '"BRIGADE_ID"'
    format: ID

  month_start:
    sql: '"MONTH_START"'
    description: First day of the calendar month for the availability snapshot
    ai_context: Use for all period filters with an exclusive end date.

  time_band:
    sql: '"TIME_BAND"'
    description: Time of week the availability applies to
    sample_values: [ Weekday daytime, Weekday evening and night, Weekend ]

  available_crew:
    sql: '"AVAILABLE_CREW"'
    label: Available crew per row
    hidden: true

  required_crew:
    sql: '"REQUIRED_CREW"'
    label: Required crew per row
    hidden: true

measures:
  count:
    aggregate_type: count

  crew_available:
    sql: ${available_crew}
    label: Available crew
    format: NUMBER_1
    description: Sum of average members able to respond. Divide by required crew
      after summing, never average row percentages.
    aggregate_type: sum
    synonyms: [ crew available, crewing ]

  crew_required:
    sql: ${required_crew}
    label: Required crew
    format: NUMBER_0
    description: Sum of crew needed to turn out a vehicle
    aggregate_type: sum

ai_context: "One row per synthetic brigade, month and time band (grain =
  brigade_id + month_start + time_band). crew_available is the average number of
  members able to respond in that slot; crew_required is the crew needed to turn
  out a vehicle. Both are summed by their measures. Crew cover = crew_available
  / crew_required, computed after summing both at the query grain; never average
  per-row cover percentages. A shortfall means crew_available below
  crew_required. Use month_start (first day of the month) for period filters
  with an exclusive end date. time_band values match incidents: Weekday daytime
  (Monday to Friday 07:00 to 17:59), Weekday evening and night, Weekend. The
  crew change starts on 2026-02-01, so compare months before and after that
  date. Do not join this view to incidents; answer response-rate questions from
  the Emergency response performance topic and compare at brigade, district or
  time band level after aggregating each separately."
