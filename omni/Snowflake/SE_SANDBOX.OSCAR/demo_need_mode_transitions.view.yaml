# Reference this view as se_sandbox_oscar__demo_need_mode_transitions
label: Mode transitions
description: One row per change of member journey mode (Healthy, Treatment,
  Recovery, Lapsed). Rates use the treatment entry and exit flags as
  denominators. Dates are Korea Standard Time. Synthetic data.

catalog: SE_SANDBOX
schema: OSCAR
table_name: DEMO_NEED_MODE_TRANSITIONS

dimensions:
  transition_id:
    sql: '"TRANSITION_ID"'
    label: Transition ID
    format: ID
    description: Unique key for each mode change
    group_label: Transition
    primary_key: true

  member_id:
    sql: '"MEMBER_ID"'
    label: Member ID
    format: ID
    description: Member that changed mode
    group_label: Transition

  partner_id:
    sql: '"PARTNER_ID"'
    label: Partner ID
    format: ID
    hidden: true

  acquisition_channel:
    sql: '"ACQUISITION_CHANNEL"'
    label: Acquisition channel
    description: partner_app_embed, direct_app, telesales, employer_group or agent_branch
    group_label: Member
    synonyms: [ channel, source ]

  region:
    sql: '"REGION"'
    label: Region
    description: Seoul, Gyeonggi, Incheon, Busan, Daegu or Daejeon
    group_label: Member

  transition_date_kst:
    sql: '"TRANSITION_DATE_KST"'
    label: Transition date (KST)
    description: Korea Standard Time date of the mode change
    group_label: Transition
    synonyms: [ date, change date ]

  from_mode:
    sql: '"FROM_MODE"'
    label: From mode
    description: Healthy, Treatment or Recovery
    group_label: Transition
    synonyms: [ Treatment mode, previous mode ]

  to_mode:
    sql: '"TO_MODE"'
    label: To mode
    description: Treatment, Recovery or Lapsed
    group_label: Transition

  is_treatment_entry:
    sql: '"IS_TREATMENT_ENTRY"'
    label: Treatment entry flag
    description: 1 when the member moved from Healthy to Treatment
    group_label: Transition
    synonyms: [ diagnosis, entered treatment ]

  nurse_contacted_14d:
    sql: '"NURSE_CONTACTED_14D"'
    label: Nurse reached within 14 days
    description: 1 when a Need nurse navigator reached the member within 14 days of
      entering Treatment. Set on the treatment entry row and carried onto that
      member's Treatment exit row, 0 elsewhere
    group_label: Nurse navigation
    synonyms: [ nurse contacted, nurse reached, nurse navigation ]

  days_to_nurse_contact:
    sql: '"DAYS_TO_NURSE_CONTACT"'
    label: Days to nurse contact
    format: NUMBER_0
    description: On treatment entries, days to first nurse contact. Null when never reached
    group_label: Nurse navigation

  wallet_active_prior_month:
    sql: '"WALLET_ACTIVE_PRIOR_MONTH"'
    label: Wallet active in prior month
    description: 1 when the member used Health Wallet in the month before the
      change, the engaged before diagnosis flag
    group_label: Engagement
    synonyms: [ engaged before diagnosis, engaged before treatment ]

  is_treatment_exit:
    sql: '"IS_TREATMENT_EXIT"'
    label: Treatment exit flag
    description: 1 when the member left Treatment, to Recovery or Lapsed
    group_label: Transition

  treatment_exit_lapsed:
    sql: '"TREATMENT_EXIT_LAPSED"'
    label: Treatment exit lapsed flag
    description: 1 when the member left Treatment by lapsing
    group_label: Transition
    hidden: true

measures:
  count:
    aggregate_type: count

  treatment_entries:
    sql: ${is_treatment_entry}
    label: Treatment entries
    group_label: Care journey measures
    format: NUMBER_0
    description: Members who moved from Healthy to Treatment, the denominator of the
      nurse reach rate
    aggregate_type: sum
    synonyms: [ diagnoses, treatment starts ]

  treatment_exits:
    sql: ${is_treatment_exit}
    label: Treatment exits
    group_label: Care journey measures
    format: NUMBER_0
    description: Members who left Treatment, the denominator of the post treatment
      lapse rate
    aggregate_type: sum

  treatment_exit_lapses:
    sql: ${treatment_exit_lapsed}
    label: Treatment exits that lapsed
    group_label: Care journey measures
    format: NUMBER_0
    description: Exits from Treatment that ended in a lapse instead of Recovery
    aggregate_type: sum

  nurse_reached_entries:
    sql: ${nurse_contacted_14d} * ${is_treatment_entry}
    label: Entries reached by a nurse within 14 days
    group_label: Care journey measures
    format: NUMBER_0
    description: Treatment entries where a nurse navigator reached the member within 14 days
    aggregate_type: sum

  nurse_reach_14d_rate:
    sql: ${nurse_reached_entries} / NULLIF(${treatment_entries}, 0)
    label: Nurse reach within 14 days
    group_label: Care journey rates
    format: PERCENT_1
    description: Treatment entries reached by a nurse navigator within 14 days, over
      all treatment entries
    synonyms: [ nurse reach, nurse navigation rate, nurse contact rate ]

  post_treatment_lapse_rate:
    sql: ${treatment_exit_lapses} / NULLIF(${treatment_exits}, 0)
    label: Post treatment lapse rate
    group_label: Care journey rates
    format: PERCENT_1
    description: Exits from Treatment that end in a lapse instead of Recovery
    synonyms: [ drop off after treatment, treatment lapse rate, treatment drop off ]
