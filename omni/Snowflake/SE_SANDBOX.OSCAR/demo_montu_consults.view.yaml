# Reference this view as se_sandbox_oscar__demo_montu_consults
catalog: SE_SANDBOX
schema: OSCAR
table_name: DEMO_MONTU_CONSULTS

dimensions:
  consult_id:
    sql: '"CONSULT_ID"'
    format: ID

  consult_date:
    sql: '"CONSULT_DATE"'

  month_start:
    sql: '"MONTH_START"'

  patient_key:
    sql: '"PATIENT_KEY"'

  state_id:
    sql: '"STATE_ID"'
    format: ID

  consult_type:
    sql: '"CONSULT_TYPE"'

  script_issued:
    sql: '"SCRIPT_ISSUED"'

measures:
  count:
    aggregate_type: count
