# Reference this view as se_sandbox_oscar__demo_need_partners
label: Partners
description: One row per insurer partner that distributes Need cancer
  protection. Partners are fictional. Synthetic data.

catalog: SE_SANDBOX
schema: OSCAR
table_name: DEMO_NEED_PARTNERS

dimensions:
  partner_id:
    sql: '"PARTNER_ID"'
    label: Partner ID
    format: ID
    description: Key for each insurer partner, prt_marae, prt_solbit or prt_nuri
    group_label: Partner
    primary_key: true

  partner_name:
    sql: '"PARTNER_NAME"'
    label: Partner
    description: Fictional insurer partner, Marae Insurance, Solbit Life or Nuri Mutual
    group_label: Partner
    synonyms: [ insurer, carrier, insurance company ]

  partner_type:
    sql: '"PARTNER_TYPE"'
    label: Partner type
    description: General insurer, Life insurer or Mutual
    group_label: Partner
    synonyms: [ insurer type ]

measures:
  count:
    aggregate_type: count

  partner_count:
    sql: ${partner_id}
    label: Partners
    group_label: Partner measures
    format: NUMBER_0
    description: Distinct insurer partners
    aggregate_type: count_distinct
