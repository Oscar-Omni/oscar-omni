# Reference this view as se_sandbox_oscar__demo_need_2_partners
label: Partners
description: The three fictional insurer partners. Invented names, never a real insurer.

catalog: SE_SANDBOX
schema: OSCAR
table_name: DEMO_NEED_2_PARTNERS

dimensions:
  partner_id:
    sql: '"PARTNER_ID"'
    label: Partner ID
    format: ID
    primary_key: true

  partner_name:
    sql: '"PARTNER_NAME"'
    label: Partner
    description: Marae Insurance, Solbit Life or Nuri Mutual (fictional)
    synonyms: [ insurer, carrier, partner name ]

  partner_type:
    sql: '"PARTNER_TYPE"'
    label: Partner Type
    description: General insurer, Life insurer or Mutual

measures:
  count:
    label: Partners
    aggregate_type: count
