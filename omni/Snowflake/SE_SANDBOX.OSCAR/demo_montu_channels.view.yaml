dimensions:
  channel_id:
    sql: '"CHANNEL_ID"'
    format: ID

  channel_name:
    sql: '"CHANNEL_NAME"'

  channel_group:
    sql: '"CHANNEL_GROUP"'

measures:
  count:
    aggregate_type: count
