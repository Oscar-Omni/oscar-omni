# Reference this view as se_sandbox_oscar__demo_titles_queensland_2_lodging_parties
label: Lodging parties
description: Coded synthetic lodging parties (subscribers and individuals who
  lodge). Never real firms, lenders or people.

catalog: SE_SANDBOX
schema: OSCAR
table_name: DEMO_TITLES_QUEENSLAND_2_LODGING_PARTIES

dimensions:
  party_id:
    sql: '"PARTY_ID"'
    label: Lodging party id
    format: ID
    primary_key: true

  party_name:
    sql: '"PARTY_NAME"'
    label: Lodging party
    description: Coded synthetic name, for example Conveyancer VIC-C014 or Lender NSW-F003
    synonyms: [ lodging party, conveyancer, law firm, lender, subscriber ]

  party_type:
    sql: '"PARTY_TYPE"'
    label: Lodging party type
    description: Conveyancer or law firm, Financial institution, Government, or Self
      represented
    synonyms: [ party type, customer type, self represented ]

measures:
  count:
    label: Lodging parties
    aggregate_type: count
