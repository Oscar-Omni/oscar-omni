# Reference this view as se_sandbox_oscar__omnise_326_b14b2ec5_incidents
label: Incidents
description: One row per synthetic emergency incident, first vehicle arrival
  only. Synthetic demo data with invented brigades, not CFA records.

catalog: SE_SANDBOX
schema: OSCAR
table_name: OMNISE_326_B14B2EC5_INCIDENTS

dimensions:
  incident_id:
    sql: '"INCIDENT_ID"'
    label: Incident ID
    format: ID
    description: Incident key such as INC-0000001
    primary_key: true

  incident_date:
    sql: '"INCIDENT_DATE"'
    label: Incident date
    description: Date the brigade was alerted. Use this for every period filter.
    timeframes: [ raw, date, week, month, quarter, year ]

  incident_month:
    sql: '"INCIDENT_MONTH"'

  incident_hour:
    sql: '"INCIDENT_HOUR"'
    description: Hour of day (0-23) the brigade was alerted

  day_type:
    sql: '"DAY_TYPE"'
    description: Weekday or Weekend
    sample_values: [ Weekday, Weekend ]

  time_band:
    sql: '"TIME_BAND"'
    description: Time of week the incident occurred
    sample_values: [ Weekday daytime, Weekday evening and night, Weekend ]
    ai_context: Weekday daytime is Monday to Friday 07:00 to 17:59, when volunteer
      crew availability is typically lowest.

  brigade_id:
    sql: '"BRIGADE_ID"'
    format: ID

  district_id:
    sql: '"DISTRICT_ID"'
    format: ID

  incident_type:
    sql: '"INCIDENT_TYPE"'
    description: Type of emergency incident
    sample_values:
      [
        Structure fire,
        Grass and bush fire,
        Vehicle fire,
        Road crash rescue,
        Other fire and alarm
      ]
    synonyms: [ job type, call type ]

  hazard_class:
    sql: '"HAZARD_CLASS"'
    description: Service delivery standard hazard class of the incident location
    sample_values: [ Significant urban, Other urban, Natural surroundings ]
    ai_context: "Values: Significant urban, Other urban, Natural surroundings. Each
      class has a different standard_minutes."

  response_minutes:
    sql: '"RESPONSE_MINUTES"'
    description: Minutes from alert to first vehicle on scene
    synonyms: [ response time, arrival time ]

  standard_minutes:
    sql: '"STANDARD_MINUTES"'
    description: Target minutes for first vehicle arrival for the incident's hazard class

  met_standard:
    sql: '"MET_STANDARD"'
    description: True when response_minutes is within standard_minutes for the hazard class

  met_count:
    sql: '"MET_COUNT"'
    label: Met flag
    description: 1 when the standard was met else 0
    hidden: true

  over_standard_count:
    sql: '"OVER_STANDARD_COUNT"'
    label: Over standard flag
    description: 1 when the standard was missed else 0
    hidden: true

  incident_count:
    sql: '"INCIDENT_COUNT"'
    label: Incident helper
    description: Always 1, a numeric helper
    hidden: true

measures:
  count:
    aggregate_type: count

  total_incidents:
    sql: ${incident_id}
    label: Incidents
    format: NUMBER_0
    description: Count of emergency incidents
    aggregate_type: count
    synonyms: [ incidents, emergency incidents, call outs ]

  incidents_met:
    sql: ${met_count}
    label: Incidents within standard
    format: NUMBER_0
    description: Incidents where the first vehicle arrived within the standard
    aggregate_type: sum

  incidents_over_standard:
    sql: ${over_standard_count}
    label: Incidents over standard
    format: NUMBER_0
    description: Incidents where the first vehicle arrived after the standard. Additive.
    aggregate_type: sum
    synonyms: [ missed standard, late responses ]

  standard_met_rate:
    sql: 1.0 * ${incidents_met} / NULLIF(${total_incidents}, 0)
    label: Standard met rate
    format: PERCENT_1
    description: Sum of met count over the count of incidents, the share of
      incidents where the first vehicle arrived within the service delivery
      standard. Recompute after any grouping, never average rows. Always filter
      or group by incident date.
    synonyms: [ compliance, standard compliance, response standard rate, SDS rate ]

  avg_response_minutes:
    sql: ${response_minutes}
    label: Average response (min)
    format: NUMBER_1
    description: Average minutes from alert to first vehicle on scene
    aggregate_type: average
    synonyms: [ average response time, mean response ]

ai_context: "One row per synthetic emergency incident (grain = incident_id),
  first vehicle arrival only. Synthetic demo data with invented brigades, not
  CFA records. Use incident_date (date the brigade was alerted) for every period
  filter, with an exclusive end date; incident_month is a convenience bucket
  only. Headline metric is standard_met_rate (share of incidents where the first
  vehicle arrived within the standard for the hazard class). It is a ratio of
  sums (incidents_met / total_incidents) and must be recomputed at the grain of
  the query, never averaged across rows, months or brigades.
  incidents_over_standard and incidents_met are additive counts. Use
  total_incidents for incident counts. avg_response_minutes is a mean of
  response_minutes; report it alongside, not instead of, standard_met_rate.
  hazard_class values: Significant urban, Other urban, Natural surroundings;
  each has its own standard_minutes, so compare response times within a hazard
  class, not across them. incident_type values: Structure fire, Grass and bush
  fire, Vehicle fire, Road crash rescue, Other fire and alarm. time_band values:
  Weekday daytime (Monday to Friday 07:00 to 17:59), Weekday evening and night,
  Weekend. day_type is Weekday or Weekend. Synonyms: compliance, SDS, response
  standard and turnout performance all mean standard_met_rate; call outs and
  jobs mean incidents."
