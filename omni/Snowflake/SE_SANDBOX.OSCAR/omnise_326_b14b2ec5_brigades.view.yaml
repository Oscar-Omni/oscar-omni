# Reference this view as se_sandbox_oscar__omnise_326_b14b2ec5_brigades
label: Brigades
description: One row per invented brigade. Synthetic, not real CFA brigades.

catalog: SE_SANDBOX
schema: OSCAR
table_name: OMNISE_326_B14B2EC5_BRIGADES

dimensions:
  brigade_id:
    sql: '"BRIGADE_ID"'
    label: Brigade ID
    format: ID
    primary_key: true

  brigade_name:
    sql: '"BRIGADE_NAME"'
    label: Brigade
    description: Invented brigade name
    synonyms: [ station, fire brigade ]

  district_id:
    sql: '"DISTRICT_ID"'
    label: District ID
    format: ID
    hidden: true

  brigade_type:
    sql: '"BRIGADE_TYPE"'
    label: Brigade type
    description: Volunteer or Integrated
    sample_values: [ Volunteer, Integrated ]
    synonyms: [ volunteer or integrated ]

  primary_hazard_class:
    sql: '"PRIMARY_HAZARD_CLASS"'
    label: Primary hazard class
    description: Main hazard class of the brigade area

  registered_volunteers:
    sql: '"REGISTERED_VOLUNTEERS"'
    label: Registered volunteers
    format: NUMBER_0
    description: Synthetic registered volunteer members

measures:
  count:
    aggregate_type: count

  volunteers_on_roll:
    sql: ${registered_volunteers}
    label: Volunteers on the roll
    format: NUMBER_0
    description: Total registered volunteers
    aggregate_type: sum
    synonyms: [ volunteers ]

ai_context: One row per invented brigade (grain = brigade_id). Synthetic, not
  real CFA brigades. Use brigade_name to label results. brigade_type is
  Volunteer or Integrated (integrated brigades have career staff alongside
  volunteers). primary_hazard_class is the main hazard class of the brigade area
  and may differ from an individual incident's hazard_class.
  registered_volunteers is an attribute; use the volunteers_on_roll measure to
  total it, and do not sum it through incident or availability rows. Each
  brigade belongs to one district.
