# Reference this view as analytics_prod_ecomm__order_items
catalog: ANALYTICS_PROD
schema: ECOMM
table_name: ORDER_ITEMS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  order_id:
    sql: '"ORDER_ID"'
    format: ID

  user_id:
    sql: '"USER_ID"'
    format: ID

  inventory_item_id:
    sql: '"INVENTORY_ITEM_ID"'
    format: ID

  sale_price:
    sql: '"SALE_PRICE"'

  status:
    sql: '"STATUS"'
    all_values: [ Cancelled, Complete, Processing, Returned, Shipped ]
    ai_context: Raw per-item status. Prefer status_group for business rollups.
      Cancelled and Returned are distinct statuses here, but status_group rolls
      both into Complete.

  created_at:
    sql: '"CREATED_AT"'

  returned_at:
    sql: '"RETURNED_AT"'

  shipped_at:
    sql: '"SHIPPED_AT"'

  delivered_at:
    sql: '"DELIVERED_AT"'

  is_returned:
    sql: '"IS_RETURNED"'
    ai_context: Boolean flag; use for filtering returns. Use returned_at when
      trending returns over time.

  is_delivered:
    sql: '"IS_DELIVERED"'
    ai_context: Boolean flag; use for filtering. Use delivered_at when trending over time.

  is_shipped:
    sql: '"IS_SHIPPED"'
    ai_context: Boolean flag; use for filtering. Use shipped_at when trending over time.

  margin:
    sql: '"MARGIN"'
    format: usdcurrency_2
    description: "Profit in dollars on the item: sale price minus unit cost"
    ai_context: Dollar profit per item, not a percentage or rate. For a margin rate,
      divide total_margin by total_revenue.

  months_since_signup:
    sql: '"MONTHS_SINCE_SIGNUP"'
    description: Whole months between the customer's signup date and this order
    ai_context: Order-level tenure at time of purchase. Use for tenure/recency
      cohorting; for acquisition cohorts use user_spend.first_order_month.

  time_to_ship:
    sql: '"TIME_TO_SHIP"'
    description: Days between order creation and shipment
    ai_context: Whole days, null until the item ships. Aggregate via average_time_to_ship.

  status_group:
    sql: CASE WHEN ${status} IN ('Complete','Returned','Cancelled') THEN 'Complete'
      WHEN ${status} IN ('Shipped','Processing') THEN 'In Progress' ELSE
      ${status} END
    description: Business grouping of order status - Complete/Returned/Cancelled
      roll up to Complete; Shipped/Processing roll up to In Progress
    ai_context: "Gotcha: Cancelled and Returned roll up into 'Complete', not a
      separate bucket. Use is_returned for actual returns."

  hour_of_day:
    sql: HOUR(${created_at})
    label: Order Hour of Day

  order_sequence_type:
    sql: CASE WHEN ${created_at} = MIN(${created_at}) OVER (PARTITION BY ${user_id})
      THEN 'First Order' ELSE 'Repeat Order' END
    description: Whether the order this item belongs to was the customer's
      first-ever order or a repeat order, based on the earliest order date per
      customer.
    all_values: [ First Order, Repeat Order ]
    ai_context: First vs repeat purchase, derived per customer from earliest order
      date. Applies to the whole order, not the individual item.

measures:
  count:
    aggregate_type: count
    ai_context: Counts order items, not orders. Use order_count for orders.

  total_revenue:
    sql: ${sale_price}
    format: usdcurrency_2
    description: Total sales revenue (sum of item sale prices)
    aggregate_type: sum
    synonyms: [ sales, gmv, gross merchandise value ]

  average_sale_price:
    sql: ${sale_price}
    format: usdcurrency_2
    aggregate_type: average

  total_margin:
    sql: ${margin}
    format: usdcurrency_2
    description: Total dollar profit (sum of item margin)
    aggregate_type: sum
    synonyms: [ profit, gross profit ]

  order_count:
    sql: ${order_id}
    aggregate_type: count_distinct
    synonyms: [ orders, transactions ]
    ai_context: Distinct order_id. Use this for 'how many orders', never the
      item-level count.

  average_order_value:
    sql: SUM(${sale_price}) / NULLIF(COUNT(DISTINCT ${order_id}),0)
    format: usdcurrency_2
    description: Revenue per distinct order
    synonyms: [ aov, basket size ]

  average_items_per_order:
    sql: COUNT(${id}) / NULLIF(COUNT(DISTINCT ${order_id}),0)
    label: Average Items per Order

  returned_item_count:
    aggregate_type: count
    filters:
      is_returned:
        is: true

  return_rate:
    sql: ${returned_item_count} / NULLIF(${count},0)
    format: percent_2
    description: Share of order items that were returned

  average_time_to_ship:
    sql: ${time_to_ship}
    label: Average Days to Ship
    description: Average days between order creation and shipment
    aggregate_type: average

  user_count:
    sql: ${user_id}
    label: Customer Count
    aggregate_type: count_distinct
    synonyms: [ customers, buyers, shoppers ]

ai_context: "Line-item grain: one row per order item. An order is order_id and
  usually spans several items, so item counts and order counts differ.
  sale_price is the transacted amount and drives all revenue;
  products.retail_price is list price and inventory_items.cost is unit cost."
