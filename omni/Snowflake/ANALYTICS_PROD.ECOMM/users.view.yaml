# Reference this view as analytics_prod_ecomm__users
catalog: ANALYTICS_PROD
schema: ECOMM
table_name: USERS

dimensions:
  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  first_name:
    sql: '"FIRST_NAME"'

  last_name:
    sql: '"LAST_NAME"'

  email:
    sql: '"EMAIL"'

  age:
    sql: '"AGE"'
    synonyms: [ customer age ]

  city:
    sql: '"CITY"'

  state:
    sql: '"STATE"'
    synonyms: [ region, province ]

  country:
    sql: '"COUNTRY"'
    sample_values: [ UK, USA ]

  zip:
    sql: '"ZIP"'

  latitude:
    sql: '"LATITUDE"'

  longitude:
    sql: '"LONGITUDE"'

  gender:
    sql: '"GENDER"'
    sample_values: [ Female, Male ]

  created_at:
    sql: '"CREATED_AT"'
    ai_context: Customer signup date. Do not confuse with order_items.created_at
      (order date) or user_spend.first_order_date (first purchase).

  traffic_source:
    sql: '"TRAFFIC_SOURCE"'
    sample_values: [ Display, Email, Facebook, Organic, Search ]
    synonyms: [ channel, acquisition channel, marketing source ]
    ai_context: How the customer was acquired. A customer attribute, fixed at signup
      — not per-order attribution.

  full_name:
    sql: CONCAT(${analytics_prod_ecomm__users.first_name},' ',
      ${analytics_prod_ecomm__users.last_name})
    label: Full Name

  spend_bucket:
    sql: CASE WHEN (SELECT SUM(oi.SALE_PRICE) FROM ANALYTICS_PROD.ECOMM.ORDER_ITEMS
      oi WHERE oi.USER_ID = ${analytics_prod_ecomm__users.id}) < 100 THEN 'Low'
      WHEN (SELECT SUM(oi.SALE_PRICE) FROM ANALYTICS_PROD.ECOMM.ORDER_ITEMS oi
      WHERE oi.USER_ID = ${analytics_prod_ecomm__users.id}) < 500 THEN 'Medium'
      ELSE 'High' END
    description: "Customer spend tier based on total lifetime spend: Low (<$100),
      Medium ($100-$499), High ($500+)."
    hidden: true
    suggestion_list:
      - value: High
      - value: Medium
      - value: Low
    order_by_field: spend_bucket_order
    sample_values: [ Low, Medium, High ]
    ai_context: Deprecated and hidden. Use
      analytics_prod_ecomm__user_spend.spend_bucket instead, which computes the
      same buckets from a pre-aggregated view rather than a per-row correlated
      subquery.

  spend_bucket_order:
    sql: CASE ${analytics_prod_ecomm__users.spend_bucket} WHEN 'High' THEN 1 WHEN
      'Medium' THEN 2 ELSE 3 END
    hidden: true

measures:
  count:
    aggregate_type: count
    ai_context: Counts customers. Within this topic only customers with at least one
      order item appear.

  average_age:
    sql: ${age}
    format: number_1
    aggregate_type: average

  lifetime_revenue:
    sql: ${analytics_prod_ecomm__order_items.sale_price}
    label: Lifetime Value (LTV)
    format: usdcurrency_2
    description: Total revenue from this customer across all orders
    aggregate_type: sum
    synonyms: [ ltv, lifetime value, customer value ]
    ai_context: Sums order_items.sale_price across the customer's orders. Equivalent
      to user_spend.total_spend_sum; prefer this when already querying user
      attributes.

ai_context: Customer/account attributes, one row per registered user.
  Demographics (age, gender), location (city/state/country), and acquisition
  channel (traffic_source) all live here.
