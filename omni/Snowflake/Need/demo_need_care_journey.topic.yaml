hidden: false

base_view: se_sandbox_oscar__demo_need_mode_transitions
label: Care Journey
group_label: Need
description: Member journey mode changes between Healthy, Treatment, Recovery
  and Lapsed, with nurse navigation reach and drop off after Treatment. One row
  per mode change. Synthetic data.

joins:
  se_sandbox_oscar__demo_need_members: {}
  se_sandbox_oscar__demo_need_partners: {}

relationships:
  - join_from_view: se_sandbox_oscar__demo_need_mode_transitions
    join_to_view: se_sandbox_oscar__demo_need_members
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_need_mode_transitions.member_id} =
      ${se_sandbox_oscar__demo_need_members.member_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__demo_need_mode_transitions
    join_to_view: se_sandbox_oscar__demo_need_partners
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_need_mode_transitions.partner_id} =
      ${se_sandbox_oscar__demo_need_partners.partner_id}
    relationship_type: many_to_one

ai_context: |-
  One row per change of journey mode (Healthy, Treatment, Recovery, Lapsed), dated on the KST calendar with an exclusive end date in period filters. nurse_reach_14d_rate and post_treatment_lapse_rate are the governed rates. nurse_reach_14d_rate is treatment entries reached by a nurse within 14 days over treatment_entries. post_treatment_lapse_rate is treatment_exit_lapses over treatment_exits, and nurse_contacted_14d is carried onto each member's Treatment exit row so exits can be split by whether the nurse reached the member. Do not mix entry and exit rows in one rate. Partners are fictional: Marae Insurance, Solbit Life and Nuri Mutual. Answer from this governed topic in one query; do not loop over members.

  Vocabulary. Diagnosis and treatment start mean mode_transitions.treatment_entries. Nurse navigation and nurse reach mean mode_transitions.nurse_reach_14d_rate. Drop off after treatment means mode_transitions.post_treatment_lapse_rate. Engaged before diagnosis means mode_transitions.wallet_active_prior_month. Channel means mode_transitions.acquisition_channel. Insurer and carrier mean partners.partner_name.

  Analysis guidance. To show the leak between Treatment and Recovery, split nurse_reach_14d_rate by wallet_active_prior_month and then by acquisition_channel for the named period, then split post_treatment_lapse_rate by nurse_contacted_14d. State both rates side by side and say the data is synthetic.

sample_queries:
  nurse_reach_by_prior_engagement:
    query:
      fields:
        [
          se_sandbox_oscar__demo_need_mode_transitions.wallet_active_prior_month,
          se_sandbox_oscar__demo_need_mode_transitions.nurse_reach_14d_rate,
          se_sandbox_oscar__demo_need_mode_transitions.treatment_entries
        ]
      base_view: se_sandbox_oscar__demo_need_mode_transitions
      filters:
        se_sandbox_oscar__demo_need_mode_transitions.transition_date_kst:
          between_dates: [ 2026-04-01, 2026-10-01 ]
      topic: demo_need_care_journey
    prompt: What share of treatment entries from 1 April 2026 to 30 September 2026
      were reached by a nurse within 14 days, split by
      wallet_active_prior_month?
  nurse_reach_by_channel:
    query:
      fields:
        [
          se_sandbox_oscar__demo_need_mode_transitions.acquisition_channel,
          se_sandbox_oscar__demo_need_mode_transitions.nurse_reach_14d_rate,
          se_sandbox_oscar__demo_need_mode_transitions.treatment_entries
        ]
      base_view: se_sandbox_oscar__demo_need_mode_transitions
      filters:
        se_sandbox_oscar__demo_need_mode_transitions.transition_date_kst:
          between_dates: [ 2026-04-01, 2026-10-01 ]
      sorts:
        - field: se_sandbox_oscar__demo_need_mode_transitions.nurse_reach_14d_rate
          desc: true
      topic: demo_need_care_journey
    prompt: How does nurse reach within 14 days differ by acquisition channel from 1
      April 2026 to 30 September 2026?
  post_treatment_lapse_by_nurse_reach:
    query:
      fields:
        [
          se_sandbox_oscar__demo_need_mode_transitions.nurse_contacted_14d,
          se_sandbox_oscar__demo_need_mode_transitions.post_treatment_lapse_rate,
          se_sandbox_oscar__demo_need_mode_transitions.treatment_exits
        ]
      base_view: se_sandbox_oscar__demo_need_mode_transitions
      filters:
        se_sandbox_oscar__demo_need_mode_transitions.transition_date_kst:
          between_dates: [ 2026-04-01, 2026-10-01 ]
        se_sandbox_oscar__demo_need_mode_transitions.from_mode:
          is: Treatment
      topic: demo_need_care_journey
    prompt: How does post treatment lapse rate differ when the nurse reached the
      member within 14 days, from 1 April 2026 to 30 September 2026?
