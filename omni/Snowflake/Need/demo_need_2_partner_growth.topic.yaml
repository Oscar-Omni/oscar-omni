hidden: false

base_view: se_sandbox_oscar__demo_need_2_member_months
label: Partner Growth and Engagement
group_label: Need
description: New policyholders, the KST policyholder count, early engagement and
  early lapse for Need's insurer partners. One row per member per KST month.
  Synthetic data.

joins:
  se_sandbox_oscar__demo_need_2_members: {}
  se_sandbox_oscar__demo_need_2_partners: {}

relationships:
  - join_from_view: se_sandbox_oscar__demo_need_2_member_months
    join_to_view: se_sandbox_oscar__demo_need_2_members
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_need_2_member_months.member_id} =
      ${se_sandbox_oscar__demo_need_2_members.member_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__demo_need_2_member_months
    join_to_view: se_sandbox_oscar__demo_need_2_partners
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_need_2_member_months.partner_id} =
      ${se_sandbox_oscar__demo_need_2_partners.partner_id}
    relationship_type: many_to_one

ai_context: |-
  Synthetic Need data. One row per member per KST month. Business months are Korea Standard Time (UTC+9, no daylight saving), so every period filter uses member_months.month_start with an exclusive end date: 2026-04-01 to 2026-09-30 means month_start between 2026-04-01 and 2026-10-01.

  Policyholders means member_months.policyholder_count, in force at 24:00 KST on the month's last day. Use it only per month or for the last month of a range; never sum it across months. Never answer with policyholder_count_utc_naive unless the user asks about the UTC reconciliation. new_policyholders is a flow and is additive across months.

  Early rates (early_engaged_rate, early_lapse_rate) cover tenure months 0 to 5. Engaged means an AI chatbot session or a health checkup upload in the month. For early churn or early lapse questions use early_lapse_rate, never a raw lapse count and never monthly_lapse_rate, which is whole book churn.

  Channels are partner_app_embed, direct_app, telesales, employer_group and agent_branch (insurer agents). Partners are fictional: Marae Insurance, Solbit Life, Nuri Mutual. Regions are Seoul, Gyeonggi, Incheon, Busan, Daegu and Daejeon. Money is AUD.

  Vocabulary. Policyholders, policyholder count and book size mean policyholder_count. UTC count means policyholder_count_utc_naive. New members and sign ups mean new_policyholders. Engagement means early_engaged_rate. Early churn means early_lapse_rate; churn means monthly_lapse_rate. Cancellations means lapses. Channel and insurer agents mean member_months.acquisition_channel. Insurer and carrier mean partners.partner_name. Cohort means members.cohort_month. Activated means members.activated_90d. Lapse reason means members.lapse_reason. Premium means total_premium_aud.

  Analysis guidance. To compare two periods, run the same query once per period with identical filters and report both side by side with the change in percentage points. To explain a change in a blended rate, split by region, then by acquisition_channel, and show each channel's rate in both periods beside new_policyholders so each channel's share of new policyholders is visible. A rise in a blended rate can come from channel mix with every channel's own rate flat; check that before calling it a decline. Care journey questions about Treatment, hospital records and drop off belong to the Care Journey topic. Lead with the headline numbers and keep answers short.

sample_queries:
  early_lapse_by_region_current:
    query:
      fields:
        [
          se_sandbox_oscar__demo_need_2_member_months.region,
          se_sandbox_oscar__demo_need_2_member_months.early_lapse_rate
        ]
      base_view: se_sandbox_oscar__demo_need_2_member_months
      filters:
        se_sandbox_oscar__demo_need_2_member_months.month_start:
          between_dates: [ 2026-04-01, 2026-10-01 ]
      sorts:
        - field: se_sandbox_oscar__demo_need_2_member_months.early_lapse_rate
          desc: true
      topic: demo_need_2_partner_growth
    prompt: What was the early lapse rate by region between 2026-04-01 and 2026-09-30?
  early_lapse_by_region_prior:
    query:
      fields:
        [
          se_sandbox_oscar__demo_need_2_member_months.region,
          se_sandbox_oscar__demo_need_2_member_months.early_lapse_rate
        ]
      base_view: se_sandbox_oscar__demo_need_2_member_months
      filters:
        se_sandbox_oscar__demo_need_2_member_months.month_start:
          between_dates: [ 2025-10-01, 2026-04-01 ]
      sorts:
        - field: se_sandbox_oscar__demo_need_2_member_months.early_lapse_rate
          desc: true
      topic: demo_need_2_partner_growth
    prompt: What was the early lapse rate by region between 2025-10-01 and 2026-03-31?
  gyeonggi_by_channel_current:
    query:
      fields:
        [
          se_sandbox_oscar__demo_need_2_member_months.acquisition_channel,
          se_sandbox_oscar__demo_need_2_member_months.new_policyholders,
          se_sandbox_oscar__demo_need_2_member_months.early_lapse_rate
        ]
      base_view: se_sandbox_oscar__demo_need_2_member_months
      filters:
        se_sandbox_oscar__demo_need_2_member_months.month_start:
          between_dates: [ 2026-04-01, 2026-10-01 ]
        se_sandbox_oscar__demo_need_2_member_months.region:
          is: Gyeonggi
      sorts:
        - field: se_sandbox_oscar__demo_need_2_member_months.new_policyholders
          desc: true
      topic: demo_need_2_partner_growth
    prompt: For Gyeonggi, what were new policyholders and the early lapse rate by
      acquisition channel between 2026-04-01 and 2026-09-30?
    ai_context: Show each channel's share of new policyholders and compare with the
      same breakdown for 2025-10-01 to 2026-03-31.
  agent_branch_share_by_month:
    query:
      fields:
        [
          "se_sandbox_oscar__demo_need_2_member_months.month_start[month]",
          se_sandbox_oscar__demo_need_2_member_months.acquisition_channel,
          se_sandbox_oscar__demo_need_2_member_months.new_policyholders
        ]
      base_view: se_sandbox_oscar__demo_need_2_member_months
      filters:
        se_sandbox_oscar__demo_need_2_member_months.month_start:
          between_dates: [ 2026-04-01, 2026-10-01 ]
      topic: demo_need_2_partner_growth
    prompt: What share of new policyholders came through agent_branch each month
      from April to September 2026?
  early_engaged_by_partner_q3:
    query:
      fields:
        [
          se_sandbox_oscar__demo_need_2_partners.partner_name,
          se_sandbox_oscar__demo_need_2_member_months.early_engaged_rate
        ]
      base_view: se_sandbox_oscar__demo_need_2_member_months
      filters:
        se_sandbox_oscar__demo_need_2_member_months.month_start:
          between_dates: [ 2026-07-01, 2026-10-01 ]
      sorts:
        - field: se_sandbox_oscar__demo_need_2_member_months.early_engaged_rate
      topic: demo_need_2_partner_growth
    prompt: Which partner had the lowest early engaged rate between 2026-07-01 and
      2026-09-30?
  policyholders_sep_2026:
    query:
      fields:
        [
          se_sandbox_oscar__demo_need_2_partners.partner_name,
          se_sandbox_oscar__demo_need_2_member_months.policyholder_count
        ]
      base_view: se_sandbox_oscar__demo_need_2_member_months
      filters:
        se_sandbox_oscar__demo_need_2_member_months.month_start:
          between_dates: [ 2026-09-01, 2026-10-01 ]
      topic: demo_need_2_partner_growth
    prompt: How many policyholders were in force at the end of September 2026?
