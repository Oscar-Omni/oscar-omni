hidden: true

base_view: se_sandbox_oscar__demo_australian_clinical_labs_scenario_slots
label: Weekend Cover Scenarios
group_label: Australian Clinical Labs
description: Saved what if slots for the SA Country Weekend Cover Planner app. Synthetic.

joins:
  se_sandbox_oscar__demo_australian_clinical_labs_labs: {}

relationships:
  - join_from_view: se_sandbox_oscar__demo_australian_clinical_labs_scenario_slots
    join_to_view: se_sandbox_oscar__demo_australian_clinical_labs_labs
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_australian_clinical_labs_scenario_slots.lab_id}
      = ${se_sandbox_oscar__demo_australian_clinical_labs_labs.lab_id}
    relationship_type: many_to_one

ai_context: Three saved what if slots for SA Country Lab weekend cover, one row
  per slot. SCN-BASE is the read only baseline, Keep weekends at SA Hub Lab;
  SCN-A is Add a second weekend courier run; SCN-B is Reroster Saturday at SA
  Country Lab. The slot columns hold each slot's default assumptions and the
  scenario_json input column holds the saved assumptions as JSON. Synthetic,
  illustrative values in AUD.

sample_queries:
  saved_scenarios:
    query:
      fields:
        [
          se_sandbox_oscar__demo_australian_clinical_labs_scenario_slots.scenario_id,
          se_sandbox_oscar__demo_australian_clinical_labs_scenario_slots.slot_name,
          se_sandbox_oscar__demo_australian_clinical_labs_scenario_slots.gap_closed_pct,
          se_sandbox_oscar__demo_australian_clinical_labs_scenario_slots.added_cost_aud_per_month
        ]
      base_view: se_sandbox_oscar__demo_australian_clinical_labs_scenario_slots
      sorts:
        - field: se_sandbox_oscar__demo_australian_clinical_labs_scenario_slots.slot_order
      topic: demo_australian_clinical_labs_weekend_scenarios
    prompt: Show the saved weekend cover scenarios
