  join_type: always_left
  on_sql: ${analytics_prod_ecomm__order_items.inventory_item_id} =
    ${analytics_prod_ecomm__inventory_items.id}
  relationship_type: many_to_one

- join_from_view: analytics_prod_ecomm__inventory_items
