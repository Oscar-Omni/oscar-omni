  join_type: always_left
  on_sql: ${analytics_prod_ecomm__inventory_items.product_id} =
    ${analytics_prod_ecomm__products.id}
  relationship_type: many_to_one

- join_from_view: analytics_prod_ecomm__products
  join_to_view: analytics_prod_ecomm__distribution_centers
  join_type: always_left
  on_sql: ${analytics_prod_ecomm__products.distribution_center_id} =
    ${analytics_prod_ecomm__distribution_centers.id}
  relationship_type: many_to_one

- join_from_view: analytics_prod_ecomm__order_items
  join_to_view: analytics_prod_ecomm__users
  join_type: always_left
  on_sql: ${analytics_prod_ecomm__order_items.user_id} =
    ${analytics_prod_ecomm__users.id}
  relationship_type: many_to_one

- join_from_view: analytics_prod_ecomm__order_items
  join_to_view: analytics_prod_ecomm__user_spend
  join_type: always_left
  on_sql: ${analytics_prod_ecomm__order_items.user_id} =
    ${analytics_prod_ecomm__user_spend.user_id}
  relationship_type: many_to_one
