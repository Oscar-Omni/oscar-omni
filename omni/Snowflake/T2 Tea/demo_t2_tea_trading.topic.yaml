base_view: se_sandbox_oscar__demo_t2_tea_sales_daily
label: Trading
group_label: T2 Tea
description: Daily trading by location, SKU and channel, 1 Jul to 31 Oct 2026,
  with locations, products and promotions. Synthetic data for an Omni demo, AUD
  ex GST.

joins:
  se_sandbox_oscar__demo_t2_tea_locations: {}
  se_sandbox_oscar__demo_t2_tea_products: {}
  se_sandbox_oscar__demo_t2_tea_promotions: {}

relationships:
  - join_from_view: se_sandbox_oscar__demo_t2_tea_sales_daily
    join_to_view: se_sandbox_oscar__demo_t2_tea_locations
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_t2_tea_sales_daily.location_id} =
      ${se_sandbox_oscar__demo_t2_tea_locations.location_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__demo_t2_tea_sales_daily
    join_to_view: se_sandbox_oscar__demo_t2_tea_products
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_t2_tea_sales_daily.sku_id} =
      ${se_sandbox_oscar__demo_t2_tea_products.sku_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__demo_t2_tea_sales_daily
    join_to_view: se_sandbox_oscar__demo_t2_tea_promotions
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_t2_tea_sales_daily.promo_id} =
      ${se_sandbox_oscar__demo_t2_tea_promotions.promo_id}
    relationship_type: many_to_one

ai_context: |
  Synthetic trading data for an Omni demo, not T2's figures. Say the data is synthetic.
  One row per location, SKU and trade date from 1 Jul to 31 Oct 2026: every ranged SKU day for 58 stores and 2 online storefronts, zero sale days included, and dispatch days for 24 wholesale accounts.
  Money is AUD ex GST; New Zealand is converted to AUD at a fixed synthetic 0.91.
  channel is Stores, Ecommerce or Wholesale. Filter on sales_daily.channel and sales_daily.category, which live on the fact. state_name is the Australian state or New Zealand region of a store or wholesale account, and Online for ecommerce.
  In-stock rate is in-stock SKU days over ranged SKU days and covers stores and online only; wholesale rows carry no ranged days. Use in_stock_rate, in_stock_days and ranged_days; never average daily rates or sum a rate.
  Out of stock days are ranged days minus in-stock days.
  September has 30 days and October 31; say so when comparing their totals.
  Sales per in-stock day is net sales divided by in-stock days.
  There is no governed lost sales measure yet: estimate lost sales as sales per in-stock day times out of stock days at the grain asked, compute it in the query and call it an estimate.
  No green tea promotion ran in September or October 2026; do not blame a promotion for green tea.
  Describe what changed, where and when; do not claim a cause the data cannot show.

sample_queries:
  net_sales_by_category_channel_oct_2026:
    query:
      fields:
        [
          se_sandbox_oscar__demo_t2_tea_sales_daily.category,
          se_sandbox_oscar__demo_t2_tea_sales_daily.channel,
          se_sandbox_oscar__demo_t2_tea_sales_daily.net_sales
        ]
      base_view: se_sandbox_oscar__demo_t2_tea_sales_daily
      filters:
        se_sandbox_oscar__demo_t2_tea_sales_daily.trade_date:
          between_dates: [ 2026-10-01, 2026-10-31 ]
      topic: demo_t2_tea_trading
    prompt: What were net sales by category and channel from 1 October 2026 to 31
      October 2026?
  net_sales_by_category_channel_sep_2026:
    query:
      fields:
        [
          se_sandbox_oscar__demo_t2_tea_sales_daily.category,
          se_sandbox_oscar__demo_t2_tea_sales_daily.channel,
          se_sandbox_oscar__demo_t2_tea_sales_daily.net_sales
        ]
      base_view: se_sandbox_oscar__demo_t2_tea_sales_daily
      filters:
        se_sandbox_oscar__demo_t2_tea_sales_daily.trade_date:
          between_dates: [ 2026-09-01, 2026-09-30 ]
      topic: demo_t2_tea_trading
    prompt: What were net sales by category and channel from 1 September 2026 to 30
      September 2026?
  green_tea_store_instock_by_state_oct_2026:
    query:
      fields:
        [
          se_sandbox_oscar__demo_t2_tea_sales_daily.state_name,
          se_sandbox_oscar__demo_t2_tea_sales_daily.in_stock_rate,
          se_sandbox_oscar__demo_t2_tea_sales_daily.net_sales,
          se_sandbox_oscar__demo_t2_tea_sales_daily.in_stock_days,
          se_sandbox_oscar__demo_t2_tea_sales_daily.ranged_days
        ]
      base_view: se_sandbox_oscar__demo_t2_tea_sales_daily
      filters:
        se_sandbox_oscar__demo_t2_tea_sales_daily.trade_date:
          between_dates: [ 2026-10-01, 2026-10-31 ]
        se_sandbox_oscar__demo_t2_tea_sales_daily.category:
          is: Green tea
        se_sandbox_oscar__demo_t2_tea_sales_daily.channel:
          is: Stores
      topic: demo_t2_tea_trading
    prompt: Which states had the lowest green tea in-stock rate in stores from 1 to
      31 October 2026?
  japanese_green_tea_out_of_stock_wa_oct_2026:
    query:
      fields:
        [
          se_sandbox_oscar__demo_t2_tea_products.product_name,
          se_sandbox_oscar__demo_t2_tea_sales_daily.out_of_stock_days,
          se_sandbox_oscar__demo_t2_tea_sales_daily.in_stock_rate
        ]
      base_view: se_sandbox_oscar__demo_t2_tea_sales_daily
      filters:
        se_sandbox_oscar__demo_t2_tea_sales_daily.trade_date:
          between_dates: [ 2026-10-01, 2026-10-31 ]
        se_sandbox_oscar__demo_t2_tea_products.origin_country:
          is: Japan
        se_sandbox_oscar__demo_t2_tea_sales_daily.state_name:
          is: Western Australia
      topic: demo_t2_tea_trading
    prompt: Which green tea products from Japan were out of stock most often in
      Western Australia in October 2026?
