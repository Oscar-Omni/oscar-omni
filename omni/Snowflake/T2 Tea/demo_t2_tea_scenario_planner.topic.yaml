base_view: se_sandbox_oscar__demo_t2_tea_scenario_slots
label: Green tea recovery scenarios
group_label: T2 Tea
description: The three saved scenario slots behind the Green tea recovery planner app.

joins: {}

ai_context: |
  Three saved scenario slots for the Green tea recovery planner app: SCN-WAIT, SCN-TOPUP and SCN-EXPRESS. Percent columns hold 0 to 100; freight is AUD per unit. Saving changes a slot's current values; there is no history. Synthetic.

sample_queries:
  scenario_seeds:
    query:
      fields:
        [
          se_sandbox_oscar__demo_t2_tea_scenario_slots.scenario_id,
          se_sandbox_oscar__demo_t2_tea_scenario_slots.scenario_name,
          se_sandbox_oscar__demo_t2_tea_scenario_slots.seed_expedite_share_pct,
          se_sandbox_oscar__demo_t2_tea_scenario_slots.seed_freight_cost_aud
        ]
      base_view: se_sandbox_oscar__demo_t2_tea_scenario_slots
      topic: demo_t2_tea_scenario_planner
    prompt: Show the seeded expedite share and freight cost for each scenario
