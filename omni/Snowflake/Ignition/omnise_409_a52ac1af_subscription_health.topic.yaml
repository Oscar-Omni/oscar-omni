hidden: false

base_view: se_sandbox_oscar__omnise_409_a52ac1af_subscriptions
label: Subscription Health
group_label: Ignition
description: Monthly subscription fees, plan tiers and downgrades for Ignition's
  client firms by referral partner. Account month grain. Synthetic data.

joins:
  se_sandbox_oscar__omnise_409_a52ac1af_accounts:
    se_sandbox_oscar__omnise_409_a52ac1af_partners: {}

relationships:
  - join_from_view: se_sandbox_oscar__omnise_409_a52ac1af_subscriptions
    join_to_view: se_sandbox_oscar__omnise_409_a52ac1af_accounts
    join_type: always_left
    on_sql: ${se_sandbox_oscar__omnise_409_a52ac1af_subscriptions.account_id} =
      ${se_sandbox_oscar__omnise_409_a52ac1af_accounts.account_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__omnise_409_a52ac1af_accounts
    join_to_view: se_sandbox_oscar__omnise_409_a52ac1af_partners
    join_type: always_left
    on_sql: ${se_sandbox_oscar__omnise_409_a52ac1af_accounts.partner_id} =
      ${se_sandbox_oscar__omnise_409_a52ac1af_partners.partner_id}
    relationship_type: many_to_one

ai_context: |-
  Account month grain: one row per account per active month. A downgrade rate is downgrades divided by active account months (subscriptions.subscription_downgrade_rate). Fees are AUD. Dates are subscriptions.month_start and any period filter uses an exclusive end date. Never add subscription fees to payment fees in one query; the payments_health topic holds payments, and the two are combined only after aggregating both to partner and month.

  Vocabulary. Downgrades means subscriptions.downgrade_count. Downgrade rate means subscriptions.subscription_downgrade_rate. MRR means subscriptions.total_subscription_fee_aud. Plan means subscriptions.plan_tier. Partner means partners.partner_name. Synthetic data, say so when presenting.

  Analysis guidance. For a change in downgrades, show the monthly downgrade rate by partner so a ramp is visible month by month, and compare against the same partner in earlier months. Keep answers concise.

sample_queries:
  downgrade_rate_by_partner_and_month:
    query:
      fields:
        [
          "se_sandbox_oscar__omnise_409_a52ac1af_subscriptions.month_start[mo\
            nth]",
          se_sandbox_oscar__omnise_409_a52ac1af_partners.partner_name,
          se_sandbox_oscar__omnise_409_a52ac1af_subscriptions.subscription_downgrade_rate
        ]
      base_view: se_sandbox_oscar__omnise_409_a52ac1af_subscriptions
      filters:
        se_sandbox_oscar__omnise_409_a52ac1af_subscriptions.month_start:
          between_dates: [ 2026-04-01, 2026-10-01 ]
      topic: omnise_409_a52ac1af_subscription_health
    prompt: What was the monthly downgrade rate by partner from 1 April 2026 to 30
      September 2026?
  downgrades_by_plan_for_harbourline:
    query:
      fields:
        [
          se_sandbox_oscar__omnise_409_a52ac1af_subscriptions.plan_tier,
          se_sandbox_oscar__omnise_409_a52ac1af_subscriptions.downgrade_count
        ]
      base_view: se_sandbox_oscar__omnise_409_a52ac1af_subscriptions
      filters:
        se_sandbox_oscar__omnise_409_a52ac1af_subscriptions.month_start:
          between_dates: [ 2026-09-01, 2026-10-01 ]
        se_sandbox_oscar__omnise_409_a52ac1af_partners.partner_name:
          is: Harbourline Advisory Network
      topic: omnise_409_a52ac1af_subscription_health
    prompt: Which plan tiers did Harbourline Advisory Network accounts downgrade to
      in September 2026?
    ai_context: The plan tier on a downgrade row is the tier the account moved to
      this month.
