hidden: false

base_view: se_sandbox_oscar__demo_ignition_firms
label: Firm Cohorts
group_label: Ignition
description: Cohort and onboarding questions for RevOps and customer success.
  One row per firm ever signed up. Synthetic data.

joins: {}

ai_context: "Synthetic Ignition data, every firm invented. One row per firm ever
  signed up. Cohort means firms.cohort_month. Went live on payments and
  onboarding mean firms.payments_live_60d: payments live within 60 days of
  signup; use payments_live_60d_rate for shares and firms_live_60d for counts.
  Signup means firms.signup_date; churned means firms.churn_date is not empty.
  Cohorts after 2026-07 are not yet complete for the 60 day flag, so say so when
  they appear. Opening book firms (is_opening_book = 1) signed up before
  2024-10-01; exclude them from cohort questions inside the window unless asked.
  Channels are partner_referral, direct_sales, events_webinar and
  self_serve_trial. Firm size means segment. Date filters use an exclusive end
  date. Revenue and monthly adoption questions belong to the Revenue Performance
  topic."

sample_queries:
  live_60d_by_channel_apr_jul_2026:
    query:
      fields:
        [
          se_sandbox_oscar__demo_ignition_firms.acquisition_channel,
          se_sandbox_oscar__demo_ignition_firms.count,
          se_sandbox_oscar__demo_ignition_firms.payments_live_60d_rate
        ]
      base_view: se_sandbox_oscar__demo_ignition_firms
      filters:
        se_sandbox_oscar__demo_ignition_firms.signup_date:
          between_dates: [ 2026-04-01, 2026-08-01 ]
      sorts:
        - field: se_sandbox_oscar__demo_ignition_firms.payments_live_60d_rate
      topic: demo_ignition_firm_cohorts
    prompt: What share of firms that signed up between 2026-04-01 and 2026-07-31
      went live on payments within 60 days, by acquisition channel?
  us_self_serve_june_never_live:
    query:
      fields:
        [
          se_sandbox_oscar__demo_ignition_firms.firm_id,
          se_sandbox_oscar__demo_ignition_firms.firm_name,
          se_sandbox_oscar__demo_ignition_firms.region,
          se_sandbox_oscar__demo_ignition_firms.segment,
          se_sandbox_oscar__demo_ignition_firms.signup_date
        ]
      base_view: se_sandbox_oscar__demo_ignition_firms
      filters:
        se_sandbox_oscar__demo_ignition_firms.signup_date:
          between_dates: [ 2026-06-01, 2026-07-01 ]
        se_sandbox_oscar__demo_ignition_firms.country:
          is: United States
        se_sandbox_oscar__demo_ignition_firms.acquisition_channel:
          is: self_serve_trial
        se_sandbox_oscar__demo_ignition_firms.payments_live_date:
          is: null
      topic: demo_ignition_firm_cohorts
    prompt: List self serve firms in the United States that signed up in June 2026
      and never went live on payments.
