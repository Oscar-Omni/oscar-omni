hidden: true

base_view: se_sandbox_oscar__demo_zitcha_ad_performance_daily
label: Retail Media Performance
group_label: Zitcha
description: Retail media delivery sold through Zitcha by campaign, state and
  day, with spend, attributed sales, ROAS and new to brand sales. Synthetic data
  for an Omni demo.

access_filters:
  - field: se_sandbox_oscar__demo_zitcha_ad_performance_daily.retailer_name
    user_attribute: demo_tenant
    values_for_unfiltered: [ all ]

joins:
  se_sandbox_oscar__demo_zitcha_campaigns: {}
  se_sandbox_oscar__demo_zitcha_brands: {}
  se_sandbox_oscar__demo_zitcha_placements: {}
  se_sandbox_oscar__demo_zitcha_regions: {}

relationships:
  - join_from_view: se_sandbox_oscar__demo_zitcha_ad_performance_daily
    join_to_view: se_sandbox_oscar__demo_zitcha_campaigns
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_zitcha_ad_performance_daily.campaign_id} =
      ${se_sandbox_oscar__demo_zitcha_campaigns.campaign_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__demo_zitcha_ad_performance_daily
    join_to_view: se_sandbox_oscar__demo_zitcha_brands
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_zitcha_ad_performance_daily.brand_id} =
      ${se_sandbox_oscar__demo_zitcha_brands.brand_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__demo_zitcha_ad_performance_daily
    join_to_view: se_sandbox_oscar__demo_zitcha_placements
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_zitcha_ad_performance_daily.placement_id} =
      ${se_sandbox_oscar__demo_zitcha_placements.placement_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__demo_zitcha_ad_performance_daily
    join_to_view: se_sandbox_oscar__demo_zitcha_regions
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_zitcha_ad_performance_daily.region_id} =
      ${se_sandbox_oscar__demo_zitcha_regions.region_id}
    relationship_type: many_to_one

ai_context: |-
  One row per synthetic campaign line, state and delivery day of retail media sold through Zitcha, 1 July 2024 to 30 September 2026. The data is synthetic, built for an Omni demo, and is never any real retailer's or brand's figures.

  Retailers. The two retailers are Cornerstone Grocery Co. and Ironbark Home and Hardware, in ad_performance_daily.retailer_name. The demo_tenant access filter already limits a retailer's users to their own rows. When the question names a retailer, add a filter on ad_performance_daily.retailer_name for that retailer to every query in the answer, including follow ups in the same conversation. When no retailer is named, do not add one. Never group by retailer unless asked to compare retailers.

  ROAS means ad_performance_daily.roas: sum of attributed sales divided by sum of spend. Never average daily, campaign or placement ROAS. Spend, sales and budgets are AUD. Channel is Onsite, Offsite or In-store and lives on ad_performance_daily.channel; screens means the In-store channel. Brand tier and brand category also live on ad_performance_daily. Screens have no clicks, so CTR applies to Onsite and Offsite only. New to brand sales are part of attributed sales, not added to them. campaign_budget is booked budget counted once per campaign; ad_spend is delivered per day.

  Dates. Use ad_performance_daily.perf_date for every date filter, and the end of a period is exclusive: 1 July to 30 September 2026 is perf_date from 2026-07-01 up to but not including 2026-10-01. Quarters are Australian financial year quarters: Q1 FY27 is 1 July to 30 September 2026, last quarter means Q1 FY27, and the same quarter last year is 1 July to 30 September 2025.

  Analysis guidance. To compare two periods, run the same query once per period with identical filters and state both date ranges with the values side by side. To explain a ROAS change, split by channel for both periods first, then by placements.placement_name and regions.state_name within the channel that fell, then show that placement and state by month with perf_date at month grain, and finally rerun the period total excluding that placement and state combination. Report what the data shows; do not invent causes such as store refits, weather or pricing. Lead with the headline numbers and keep answers short.

sample_queries:
  roas_q1_fy27:
    query:
      fields:
        [
          se_sandbox_oscar__demo_zitcha_ad_performance_daily.ad_spend,
          se_sandbox_oscar__demo_zitcha_ad_performance_daily.attributed_sales,
          se_sandbox_oscar__demo_zitcha_ad_performance_daily.roas
        ]
      base_view: se_sandbox_oscar__demo_zitcha_ad_performance_daily
      filters:
        se_sandbox_oscar__demo_zitcha_ad_performance_daily.perf_date:
          between_dates: [ 2026-07-01, 2026-10-01 ]
        se_sandbox_oscar__demo_zitcha_ad_performance_daily.retailer_name:
          is: Cornerstone Grocery Co.
      topic: demo_zitcha_retail_media_performance
    prompt: What was ROAS for Cornerstone Grocery Co. from 1 July 2026 to 30
      September 2026?
  roas_q1_fy26:
    query:
      fields:
        [
          se_sandbox_oscar__demo_zitcha_ad_performance_daily.ad_spend,
          se_sandbox_oscar__demo_zitcha_ad_performance_daily.attributed_sales,
          se_sandbox_oscar__demo_zitcha_ad_performance_daily.roas
        ]
      base_view: se_sandbox_oscar__demo_zitcha_ad_performance_daily
      filters:
        se_sandbox_oscar__demo_zitcha_ad_performance_daily.perf_date:
          between_dates: [ 2025-07-01, 2025-10-01 ]
      topic: demo_zitcha_retail_media_performance
    prompt: What was ROAS from 1 July 2025 to 30 September 2025?
  roas_by_channel_q1_fy27:
    query:
      fields:
        [
          se_sandbox_oscar__demo_zitcha_ad_performance_daily.channel,
          se_sandbox_oscar__demo_zitcha_ad_performance_daily.ad_spend,
          se_sandbox_oscar__demo_zitcha_ad_performance_daily.roas
        ]
      base_view: se_sandbox_oscar__demo_zitcha_ad_performance_daily
      filters:
        se_sandbox_oscar__demo_zitcha_ad_performance_daily.perf_date:
          between_dates: [ 2026-07-01, 2026-10-01 ]
      topic: demo_zitcha_retail_media_performance
    prompt: Show spend and ROAS by channel from 1 July 2026 to 30 September 2026
  instore_placements_states:
    query:
      fields:
        [
          se_sandbox_oscar__demo_zitcha_placements.placement_name,
          se_sandbox_oscar__demo_zitcha_regions.state_name,
          se_sandbox_oscar__demo_zitcha_ad_performance_daily.ad_spend,
          se_sandbox_oscar__demo_zitcha_ad_performance_daily.roas
        ]
      base_view: se_sandbox_oscar__demo_zitcha_ad_performance_daily
      filters:
        se_sandbox_oscar__demo_zitcha_ad_performance_daily.perf_date:
          between_dates: [ 2026-07-01, 2026-10-01 ]
        se_sandbox_oscar__demo_zitcha_ad_performance_daily.channel:
          is: In-store
      sorts:
        - field: se_sandbox_oscar__demo_zitcha_ad_performance_daily.ad_spend
          desc: true
      topic: demo_zitcha_retail_media_performance
    prompt: Which In-store placements and states had the most spend and what was
      their ROAS last quarter?
  weekly_spend_by_channel:
    query:
      fields:
        [
          "se_sandbox_oscar__demo_zitcha_ad_performance_daily.perf_date[week]",
          se_sandbox_oscar__demo_zitcha_ad_performance_daily.channel,
          se_sandbox_oscar__demo_zitcha_ad_performance_daily.ad_spend
        ]
      base_view: se_sandbox_oscar__demo_zitcha_ad_performance_daily
      filters:
        se_sandbox_oscar__demo_zitcha_ad_performance_daily.perf_date:
          between_dates: [ 2026-07-01, 2026-10-01 ]
      sorts:
        - field: se_sandbox_oscar__demo_zitcha_ad_performance_daily.perf_date[week]
      topic: demo_zitcha_retail_media_performance
    prompt: Show weekly spend by channel last quarter
  top_brands_sept:
    query:
      fields:
        [
          se_sandbox_oscar__demo_zitcha_brands.brand_name,
          se_sandbox_oscar__demo_zitcha_ad_performance_daily.attributed_sales
        ]
      base_view: se_sandbox_oscar__demo_zitcha_ad_performance_daily
      filters:
        se_sandbox_oscar__demo_zitcha_ad_performance_daily.perf_date:
          between_dates: [ 2026-09-01, 2026-10-01 ]
      limit: 10
      sorts:
        - field: se_sandbox_oscar__demo_zitcha_ad_performance_daily.attributed_sales
          desc: true
      topic: demo_zitcha_retail_media_performance
    prompt: Which brands drove the most attributed sales in September 2026?
