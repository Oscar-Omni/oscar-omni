hidden: true

base_view: se_sandbox_oscar__demo_brighte_capital_scenario_slots
label: Voice Agent Scenarios
group_label: Brighte Capital
description: Saved slots for the Payment Arrangement Fix Planner app. Synthetic.

joins:
  se_sandbox_oscar__demo_brighte_capital_intents: {}

relationships:
  - join_from_view: se_sandbox_oscar__demo_brighte_capital_scenario_slots
    join_to_view: se_sandbox_oscar__demo_brighte_capital_intents
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_brighte_capital_scenario_slots.intent_id} =
      ${se_sandbox_oscar__demo_brighte_capital_intents.intent_id}
    relationship_type: many_to_one

ai_context: |
  Three saved scenario slots for fixing the v3.2 payment arrangement identity step, one row per slot. SCN-BASE is the read only baseline, Keep v3.2 as released; SCN-FIX is Ship v3.2.1 with a code retry and fallback check; SCN-APPCB is Steer payment arrangements to app callback.
  The slot columns hold each slot's default assumptions and the scenario_json input column holds saved assumptions as JSON. Illustrative values in AUD, not Brighte plans.

sample_queries:
  saved_scenarios:
    query:
      fields:
        [
          se_sandbox_oscar__demo_brighte_capital_scenario_slots.scenario_id,
          se_sandbox_oscar__demo_brighte_capital_scenario_slots.slot_name,
          se_sandbox_oscar__demo_brighte_capital_scenario_slots.id_fail_rate_pct,
          se_sandbox_oscar__demo_brighte_capital_scenario_slots.link_close_share_pct,
          se_sandbox_oscar__demo_brighte_capital_scenario_slots.app_callback_share_pct
        ]
      base_view: se_sandbox_oscar__demo_brighte_capital_scenario_slots
      sorts:
        - field: se_sandbox_oscar__demo_brighte_capital_scenario_slots.slot_order
      topic: demo_brighte_capital_voice_agent_scenarios
    prompt: What does each payment arrangement fix scenario assume?
