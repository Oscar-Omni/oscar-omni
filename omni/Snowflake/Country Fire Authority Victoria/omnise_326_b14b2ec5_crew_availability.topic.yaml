hidden: true

base_view: se_sandbox_oscar__omnise_326_b14b2ec5_brigade_availability
label: Crew availability
group_label: Country Fire Authority Victoria
description: Synthetic average crew able to respond and crew required, by
  brigade, month and time band. Invented brigades, not CFA records.

joins:
  se_sandbox_oscar__omnise_326_b14b2ec5_brigades:
    se_sandbox_oscar__omnise_326_b14b2ec5_districts: {}

relationships:
  - join_from_view: se_sandbox_oscar__omnise_326_b14b2ec5_brigade_availability
    join_to_view: se_sandbox_oscar__omnise_326_b14b2ec5_brigades
    join_type: always_left
    on_sql: ${se_sandbox_oscar__omnise_326_b14b2ec5_brigade_availability.brigade_id}
      = ${se_sandbox_oscar__omnise_326_b14b2ec5_brigades.brigade_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__omnise_326_b14b2ec5_brigades
    join_to_view: se_sandbox_oscar__omnise_326_b14b2ec5_districts
    join_type: always_left
    on_sql: ${se_sandbox_oscar__omnise_326_b14b2ec5_brigades.district_id} =
      ${se_sandbox_oscar__omnise_326_b14b2ec5_districts.district_id}
    relationship_type: many_to_one

ai_context: |-
  One row per synthetic brigade, month and time band with the average crew able to respond (crew_available) and the crew required to turn out a vehicle (crew_required). Synthetic demo data, not CFA records; say so when presenting results.

  Metrics. Crew cover is crew_available divided by crew_required, calculated after summing both at the grain of the query. Never average per-row cover percentages. A brigade or slot has a shortfall when crew_available is below crew_required; report the gap (required minus available) alongside cover. Both measures are sums of monthly averages, so for a multi-month total say it is crew-months, or group by month_start when reporting typical crew levels.

  Dimensions. time_band values: Weekday daytime (Monday to Friday 07:00 to 17:59), Weekday evening and night, Weekend. Weekday daytime is usually the tightest band for volunteer brigades. brigade_type is Volunteer or Integrated. District comes from the districts view via brigades.

  Periods. Use month_start for period filters with an exclusive end date. The current period is 2025-10-01 to 2026-10-01 and the prior period is 2024-10-01 to 2025-10-01. The crew change starts on 2026-02-01, so compare months before and after that date.

  Do not join to incidents for cover questions; response performance belongs to the Emergency response performance topic. To relate crew cover to response performance, aggregate each topic separately to the same brigade, district or time band and compare. Synonyms: crewing and turnout crew mean crew_available; region or area means district.

sample_queries:
  crew_by_time_band:
    query:
      fields:
        [
          se_sandbox_oscar__omnise_326_b14b2ec5_brigade_availability.time_band,
          se_sandbox_oscar__omnise_326_b14b2ec5_brigade_availability.crew_available,
          se_sandbox_oscar__omnise_326_b14b2ec5_brigade_availability.crew_required
        ]
      base_view: se_sandbox_oscar__omnise_326_b14b2ec5_brigade_availability
      filters:
        se_sandbox_oscar__omnise_326_b14b2ec5_brigade_availability.month_start:
          between_dates: [ 2025-10-01, 2026-10-01 ]
      topic: omnise_326_b14b2ec5_crew_availability
    prompt: What was average available crew by time band from 1 October 2025 to 30
      September 2026?
  daytime_gap_by_brigade:
    query:
      fields:
        [
          se_sandbox_oscar__omnise_326_b14b2ec5_brigades.brigade_name,
          se_sandbox_oscar__omnise_326_b14b2ec5_brigade_availability.crew_available,
          se_sandbox_oscar__omnise_326_b14b2ec5_brigade_availability.crew_required
        ]
      base_view: se_sandbox_oscar__omnise_326_b14b2ec5_brigade_availability
      filters:
        se_sandbox_oscar__omnise_326_b14b2ec5_brigade_availability.month_start:
          between_dates: [ 2025-10-01, 2026-10-01 ]
        se_sandbox_oscar__omnise_326_b14b2ec5_brigade_availability.time_band:
          is: Weekday daytime
      topic: omnise_326_b14b2ec5_crew_availability
    prompt: Which brigades had available crew below required crew on weekday daytime
      in the 12 months to 30 September 2026?
