hidden: true

base_view: se_sandbox_oscar__omnise_326_b14b2ec5_incidents
label: Emergency response performance
group_label: Country Fire Authority Victoria
description: Synthetic emergency incidents with the minutes taken for the first
  vehicle to arrive, by brigade, district and hazard class. Invented brigades,
  not CFA records.

joins:
  se_sandbox_oscar__omnise_326_b14b2ec5_brigades:
    se_sandbox_oscar__omnise_326_b14b2ec5_districts: {}

relationships:
  - join_from_view: se_sandbox_oscar__omnise_326_b14b2ec5_incidents
    join_to_view: se_sandbox_oscar__omnise_326_b14b2ec5_brigades
    join_type: always_left
    on_sql: ${se_sandbox_oscar__omnise_326_b14b2ec5_incidents.brigade_id} =
      ${se_sandbox_oscar__omnise_326_b14b2ec5_brigades.brigade_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__omnise_326_b14b2ec5_brigades
    join_to_view: se_sandbox_oscar__omnise_326_b14b2ec5_districts
    join_type: always_left
    on_sql: ${se_sandbox_oscar__omnise_326_b14b2ec5_brigades.district_id} =
      ${se_sandbox_oscar__omnise_326_b14b2ec5_districts.district_id}
    relationship_type: many_to_one

ai_context: |-
  Each row of incidents is one synthetic emergency incident with the minutes taken for the first vehicle to arrive. Synthetic demo data, not CFA records; say so when presenting results. Use incident_date for any period filter, with an exclusive end date.

  Metrics. The headline metric is standard_met_rate (label Standard met rate): incidents_met over total_incidents. It must be recomputed at the grain of every query, never averaged across rows, months, brigades or districts. Always state the metric used and the exact period. incidents_over_standard and incidents_met are additive counts and can be summed across any grouping. Use total_incidents for incident counts. avg_response_minutes is a supporting measure; do not use it to judge compliance because the standard differs by hazard class. met_standard compares response_minutes with standard_minutes for the incident's hazard_class.

  Dimensions. time_band has three values: Weekday daytime (Monday to Friday 07:00 to 17:59), Weekday evening and night, Weekend. hazard_class: Significant urban, Other urban, Natural surroundings. incident_type: Structure fire, Grass and bush fire, Vehicle fire, Road crash rescue, Other fire and alarm. District comes from the districts view via brigades; brigade_type is Volunteer or Integrated.

  Periods. Fixed periods: the current period is 2025-10-01 to 2026-10-01 and the prior period is 2024-10-01 to 2025-10-01 (exclusive ends). Do not use calendar year buckets to compare them; filter each period explicitly and name both with exact dates. The crew change starts on 2026-02-01, so for its effect compare incidents before and after that date over comparable months.

  Analysis guidance. When asked where performance fell, rank by the change in standard_met_rate in percentage points and also give incidents_over_standard so small groups are not over-weighted. Do not join to brigade_availability for rate questions; crew questions belong to the Crew availability topic, and any link between crew cover and response performance should be made by aggregating each topic separately to brigade, district or time band and comparing. Synonyms: compliance, SDS rate and response standard mean standard_met_rate; call outs and jobs mean incidents; region or area means district.

sample_queries:
  standard_met_current_vs_prior:
    query:
      fields:
        [
          "se_sandbox_oscar__omnise_326_b14b2ec5_incidents.incident_date[year]",
          se_sandbox_oscar__omnise_326_b14b2ec5_incidents.standard_met_rate
        ]
      base_view: se_sandbox_oscar__omnise_326_b14b2ec5_incidents
      filters:
        se_sandbox_oscar__omnise_326_b14b2ec5_incidents.incident_date:
          between_dates: [ 2024-10-01, 2026-10-01 ]
      topic: omnise_326_b14b2ec5_emergency_response
    prompt: What percentage of emergency incidents met the response standard from 1
      October 2025 to 30 September 2026 compared with 1 October 2024 to 30
      September 2025?
    ai_context: The year buckets are calendar years, so group by explicit period
      instead and name both periods with exact dates.
  time_band_fall:
    query:
      fields:
        [
          se_sandbox_oscar__omnise_326_b14b2ec5_incidents.time_band,
          se_sandbox_oscar__omnise_326_b14b2ec5_incidents.standard_met_rate
        ]
      base_view: se_sandbox_oscar__omnise_326_b14b2ec5_incidents
      filters:
        se_sandbox_oscar__omnise_326_b14b2ec5_incidents.incident_date:
          between_dates: [ 2025-10-01, 2026-10-01 ]
      topic: omnise_326_b14b2ec5_emergency_response
    prompt: Which time band had the largest fall in standard met between those two
      periods?
  over_standard_by_district:
    query:
      fields:
        [
          se_sandbox_oscar__omnise_326_b14b2ec5_districts.district_name,
          se_sandbox_oscar__omnise_326_b14b2ec5_incidents.incidents_over_standard
        ]
      base_view: se_sandbox_oscar__omnise_326_b14b2ec5_incidents
      filters:
        se_sandbox_oscar__omnise_326_b14b2ec5_incidents.incident_date:
          between_dates: [ 2025-10-01, 2026-10-01 ]
      sorts:
        - field: se_sandbox_oscar__omnise_326_b14b2ec5_incidents.incidents_over_standard
          desc: true
      topic: omnise_326_b14b2ec5_emergency_response
    prompt: Show incidents over standard by district for the 12 months to 30
      September 2026.
