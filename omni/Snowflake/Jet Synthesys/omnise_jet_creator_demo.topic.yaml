ai_context: All audience and revenue fields in this topic are synthetic Jan-Aug
  2026 demo data. Creator names, tags and categories came from
  jetsynthesys.com/creators. Currency is USD. Join to existing Jet Synthesys
  vertical dimension via related_vertical_id for thematic demo context only;
  this is not a business affiliation or revenue attribution. Do not sum follower
  counts across months. Do not join creator-month rows to vertical-month fact
  and sum its measures across creators, because multiple creators map to the
  same vertical. When asked which creator earned the most money so far, rank
  creators by the total_revenue_usd measure across all available months, grouped
  by creator_name. Do not use the vertical revenue measures.
