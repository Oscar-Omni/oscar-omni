          se_sandbox_oscar__demo_healthdirect_australia_calls.avg_wait_minutes,
          se_sandbox_oscar__demo_healthdirect_australia_calls.avg_handle_minutes
        ]
      base_view: se_sandbox_oscar__demo_healthdirect_australia_calls
      filters:
        se_sandbox_oscar__demo_healthdirect_australia_months.month_start:
          between_dates: [ 2025-07-01, 2026-10-01 ]
      sorts:
        - field: se_sandbox_oscar__demo_healthdirect_australia_months.month_start[month]
      topic: demo_healthdirect_australia_helpline_calls
    prompt: What was average wait and handle time by month from July 2025 to
