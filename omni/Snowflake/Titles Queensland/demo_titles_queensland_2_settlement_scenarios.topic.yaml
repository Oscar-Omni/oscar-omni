base_view: se_sandbox_oscar__demo_titles_queensland_2_scenario_slots
label: Settlement scenarios (synthetic)
group_label: Titles Queensland
description: Saved what if slots for the Gold Coast Settlement Program Planner app.

joins:
  se_sandbox_oscar__demo_titles_queensland_2_lodging_parties: {}

relationships:
  - join_from_view: se_sandbox_oscar__demo_titles_queensland_2_scenario_slots
    join_to_view: se_sandbox_oscar__demo_titles_queensland_2_lodging_parties
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_titles_queensland_2_scenario_slots.party_id} =
      ${se_sandbox_oscar__demo_titles_queensland_2_lodging_parties.party_id}
    relationship_type: many_to_one

ai_context: |
  Three saved what if slots for the synthetic Gold Coast settlement program lodged by Conveyancer VIC-C014, one row per slot.
  SCN-BASE is the read only baseline. The scenario_json input column holds each slot's saved assumptions; the slot columns hold the defaults. Synthetic.

sample_queries:
  Saved settlement program scenarios:
    query:
      fields:
        [
          se_sandbox_oscar__demo_titles_queensland_2_scenario_slots.scenario_id,
          se_sandbox_oscar__demo_titles_queensland_2_scenario_slots.slot_name,
          se_sandbox_oscar__demo_titles_queensland_2_scenario_slots.program_lodgements_per_month,
          se_sandbox_oscar__demo_titles_queensland_2_scenario_slots.requisition_rate_pct,
          se_sandbox_oscar__demo_titles_queensland_2_scenario_slots.response_business_days
        ]
      base_view: se_sandbox_oscar__demo_titles_queensland_2_scenario_slots
      limit: 10
      sorts:
        - field: se_sandbox_oscar__demo_titles_queensland_2_scenario_slots.slot_order
      topic: demo_titles_queensland_2_settlement_scenarios
    description: The three saved scenario slots with their default assumptions
    prompt: Show the saved settlement program scenarios
