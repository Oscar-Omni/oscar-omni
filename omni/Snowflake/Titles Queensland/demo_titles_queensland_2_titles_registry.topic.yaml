hidden: true

base_view: se_sandbox_oscar__demo_titles_queensland_2_lodgements
label: Titles Registry (synthetic)
group_label: Titles Queensland
description: Synthetic Queensland land titles registry operations. One row per
  dealing lodged, 1 Jul 2024 to 31 Oct 2026, outcomes as at 12 Nov 2026.

joins:
  se_sandbox_oscar__demo_titles_queensland_2_land_regions: {}
  se_sandbox_oscar__demo_titles_queensland_2_lodging_parties: {}
  se_sandbox_oscar__demo_titles_queensland_2_dealing_types: {}

relationships:
  - join_from_view: se_sandbox_oscar__demo_titles_queensland_2_lodgements
    join_to_view: se_sandbox_oscar__demo_titles_queensland_2_land_regions
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_titles_queensland_2_lodgements.region_id} =
      ${se_sandbox_oscar__demo_titles_queensland_2_land_regions.region_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__demo_titles_queensland_2_lodgements
    join_to_view: se_sandbox_oscar__demo_titles_queensland_2_lodging_parties
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_titles_queensland_2_lodgements.party_id} =
      ${se_sandbox_oscar__demo_titles_queensland_2_lodging_parties.party_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__demo_titles_queensland_2_lodgements
    join_to_view: se_sandbox_oscar__demo_titles_queensland_2_dealing_types
    join_type: always_left
    on_sql: ${se_sandbox_oscar__demo_titles_queensland_2_lodgements.dealing_type_code}
      =
      ${se_sandbox_oscar__demo_titles_queensland_2_dealing_types.dealing_type_code}
    relationship_type: many_to_one

ai_context: |
  Synthetic Queensland land titles registry data for an Omni demo, not Titles Queensland data.
  The grain is one row per dealing lodged, lodged 1 Jul 2024 to 31 Oct 2026, with outcomes as at 12 Nov 2026.
  The financial year runs 1 July to 30 June, so FY27 to date is 1 Jul to 31 Oct 2026 and the same period last year is 1 Jul to 31 Oct 2025. Filter periods on lodged date.
  Processing time means avg_processing_days: business days from lodgement to registration end to end, including time waiting on customers to answer requisitions. Say so when you use it.
  Time waiting on customers is avg_customer_wait_days, averaged over the same registered dealings, so Processing time minus Time waiting on customers is the time a dealing spent with the registry.
  Requisition response time is avg_requisition_response_days and covers requisitioned dealings only.
  Within target is within_target_rate over decided dealings, against illustrative targets in dealing_types.target_business_days. Targets and fees are illustrative.
  Rates are ratios over dealing rows; never average region, party or month rates.
  party_state is the lodging party's home state, not where the land is. All land is in Queensland and land_regions.region_name holds the land region.
  To place a delay, compare Processing time with Time waiting on customers for the same dealings, by lodging party when asked why.
  Lodging parties are coded synthetic firms and people. Describe what changed and when; do not invent business reasons the data cannot show. Money is AUD.

sample_queries:
  Within target by land region, Sep to Oct 2026 against last year:
    query:
      fields:
        [
          se_sandbox_oscar__demo_titles_queensland_2_land_regions.region_name,
          se_sandbox_oscar__demo_titles_queensland_2_lodgements.within_target_rate,
          se_sandbox_oscar__demo_titles_queensland_2_lodgements.lodgement_count
        ]
      base_view: se_sandbox_oscar__demo_titles_queensland_2_lodgements
      limit: 50
      sorts:
        - field: se_sandbox_oscar__demo_titles_queensland_2_lodgements.within_target_rate
      topic: demo_titles_queensland_2_titles_registry
    description: Within target by land region for 1 Sep to 31 Oct 2026, compared
      with 1 Sep to 31 Oct 2025, lowest first
    prompt: Which land regions had the lowest share of lodgements registered within
      target between 1 September and 31 October 2026, and how does that compare
      with 1 September to 31 October 2025?
    ai_context: Filter lodged date to 2026-09-01 through 2026-10-31 and separately
      2025-09-01 through 2025-10-31, and compare within_target_rate by land
      region.
  Requisition rate by lodging party state, FY27 to date:
    query:
      fields:
        [
          se_sandbox_oscar__demo_titles_queensland_2_lodgements.party_state,
          se_sandbox_oscar__demo_titles_queensland_2_lodgements.requisition_rate,
          se_sandbox_oscar__demo_titles_queensland_2_lodgements.lodgement_count
        ]
      base_view: se_sandbox_oscar__demo_titles_queensland_2_lodgements
      limit: 50
      sorts:
        - field: se_sandbox_oscar__demo_titles_queensland_2_lodgements.requisition_rate
          desc: true
      topic: demo_titles_queensland_2_titles_registry
    description: Requisition rate by lodging party state for 1 Jul to 31 Oct 2026,
      compared with 1 Jul to 31 Oct 2025
    prompt: Requisition rate by lodging party state for 1 July to 31 October 2026
      against 1 July to 31 October 2025
  Gold Coast transfers by lodging party, Sep to Oct 2026:
    query:
      fields:
        [
          se_sandbox_oscar__demo_titles_queensland_2_lodging_parties.party_name,
          se_sandbox_oscar__demo_titles_queensland_2_lodgements.lodgement_count,
          se_sandbox_oscar__demo_titles_queensland_2_lodgements.requisitioned_count,
          se_sandbox_oscar__demo_titles_queensland_2_lodgements.requisition_rate,
          se_sandbox_oscar__demo_titles_queensland_2_lodgements.avg_requisition_response_days,
          se_sandbox_oscar__demo_titles_queensland_2_lodgements.avg_processing_days,
          se_sandbox_oscar__demo_titles_queensland_2_lodgements.avg_customer_wait_days
        ]
      base_view: se_sandbox_oscar__demo_titles_queensland_2_lodgements
      limit: 10
      sorts:
        - field: se_sandbox_oscar__demo_titles_queensland_2_lodgements.requisitioned_count
          desc: true
      topic: demo_titles_queensland_2_titles_registry
    description: Gold Coast transfers lodged 1 Sep to 31 Oct 2026 by lodging party,
      with requisitions, processing time and time waiting on customers
    prompt: Top 10 lodging parties by requisitions on Gold Coast transfers from 1
      September to 31 October 2026, with their requisition response time
    ai_context: Filter land region to Gold Coast, dealing type to Transfer and
      lodged date to 2026-09-01 through 2026-10-31.
  Weekly processing time by channel, FY27 to date:
    query:
      fields:
        [
          "se_sandbox_oscar__demo_titles_queensland_2_lodgements.lodged_date[\
            week]",
          se_sandbox_oscar__demo_titles_queensland_2_lodgements.channel,
          se_sandbox_oscar__demo_titles_queensland_2_lodgements.avg_processing_days
        ]
      base_view: se_sandbox_oscar__demo_titles_queensland_2_lodgements
      limit: 500
      sorts:
        - field: se_sandbox_oscar__demo_titles_queensland_2_lodgements.lodged_date[week]
      topic: demo_titles_queensland_2_titles_registry
    description: Weekly processing time by channel from 1 Jul to 31 Oct 2026
    prompt: Weekly processing time by channel from 1 July to 31 October 2026
