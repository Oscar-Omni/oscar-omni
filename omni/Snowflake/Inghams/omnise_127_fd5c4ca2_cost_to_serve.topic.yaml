hidden: true

base_view: se_sandbox_oscar__omnise_127_fd5c4ca2_daily_shipments
label: Inghams - Cost to Serve and Product Performance
group_label: Inghams
description: Daily shipment grain (date x channel x product category x facility)
  covering freight, warehousing, order servicing cost, revenue and COGS. Used
  for the Cost to Serve dashboard and the freight-cost-per-case AI questions.
  Demo build omnise_127_fd5c4ca2.

joins:
  se_sandbox_oscar__omnise_127_fd5c4ca2_dim_channel: {}
  se_sandbox_oscar__omnise_127_fd5c4ca2_dim_product: {}
  se_sandbox_oscar__omnise_127_fd5c4ca2_dim_facility: {}

relationships:
  - join_from_view: se_sandbox_oscar__omnise_127_fd5c4ca2_daily_shipments
    join_to_view: se_sandbox_oscar__omnise_127_fd5c4ca2_dim_channel
    join_type: always_left
    on_sql: ${se_sandbox_oscar__omnise_127_fd5c4ca2_daily_shipments.channel_id} =
