ai_context: |
  This topic covers Inghams cost-to-serve: freight, warehousing and order
  servicing cost per case, and gross margin percent, by shipment date, channel
  (retailer, QSR or food service), product category and distribution facility.

  Default metric for an unqualified cost-per-case or freight-cost question is
  freight_cost_per_case (SUM freight_cost_aud divided by SUM case_count), never
  an average of daily ratios. If asked for a broader definition including
  warehousing and order servicing, use cost_to_serve_per_case instead and name
  it explicitly.

  There is no brand dimension in this model: Inghams is a single consumer
  brand, so any breakdown that would previously have been by brand should use
  product_category_name instead (see build-report.md).

  Keep answers concise: state the metric definition used, return only the
  requested grouping columns, and lead with the headline number or finding.
