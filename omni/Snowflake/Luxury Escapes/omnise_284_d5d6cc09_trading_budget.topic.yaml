ai_context: |
  One row per destination per calendar month (budget_month is the first day of the month), 2026-01-01 to 2026-08-01. Amounts in AUD. Budget = plan = target. budget_margin_over_gbv = budget_margin_amount / budget_gbv on summed values, never an average of percentages. This topic has no booking actuals, for actuals use the Luxury Escapes Trading Bookings topic. Keep answers concise and name the metric used.
