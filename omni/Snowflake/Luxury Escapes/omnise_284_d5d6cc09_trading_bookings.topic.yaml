base_view: se_sandbox_oscar__omnise_284_d5d6cc09_bookings
label: Luxury Escapes Trading Bookings
group_label: Luxury Escapes
description: Booking level trading performance (GBV, discounts, supplier cost,
  margin) by destination, offer and promotion. Synthetic demo data.

joins:
  se_sandbox_oscar__omnise_284_d5d6cc09_offers:
    se_sandbox_oscar__omnise_284_d5d6cc09_destinations: {}
    se_sandbox_oscar__omnise_284_d5d6cc09_promotions: {}

relationships:
  - join_from_view: se_sandbox_oscar__omnise_284_d5d6cc09_bookings
    join_to_view: se_sandbox_oscar__omnise_284_d5d6cc09_offers
    join_type: always_left
    on_sql: ${se_sandbox_oscar__omnise_284_d5d6cc09_bookings.offer_id} =
      ${se_sandbox_oscar__omnise_284_d5d6cc09_offers.offer_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__omnise_284_d5d6cc09_offers
    join_to_view: se_sandbox_oscar__omnise_284_d5d6cc09_destinations
    join_type: always_left
    on_sql: ${se_sandbox_oscar__omnise_284_d5d6cc09_offers.destination_id} =
      ${se_sandbox_oscar__omnise_284_d5d6cc09_destinations.destination_id}
    relationship_type: many_to_one

  - join_from_view: se_sandbox_oscar__omnise_284_d5d6cc09_offers
    join_to_view: se_sandbox_oscar__omnise_284_d5d6cc09_promotions
    join_type: always_left
    on_sql: ${se_sandbox_oscar__omnise_284_d5d6cc09_offers.promo_code} =
      ${se_sandbox_oscar__omnise_284_d5d6cc09_promotions.promo_code}
    relationship_type: many_to_one

ai_context: |
  One row per confirmed booking in the bookings view, dated by booking_date (the sale date, travel dates are not modelled). All money is in AUD. Bookings join many to one to offers, and offers to destinations and promotions, so there is no fanout.

  Definitions. GBV (gross booking value) is before discounts. margin_amount = gbv - discount_amount - supplier_cost. Margin over GBV (also called margin percent or margin rate) = margin_amount / gbv, always computed on summed values (ratio of sums), never an average of percentages. If a shared field named margin_over_gbv is not available, compute margin_amount divided by gbv and say so. State the method used. Mention once, briefly, the alternative margin_over_net_revenue = margin_amount / net_revenue. average_booking_value = gbv / bookings.

  Vocabulary. GBV, gross booking value, booking value, sales = gbv. Orders = bookings. ABV = average_booking_value. Margin, margin dollars = margin_amount. Discount = discount_amount (rate = discount_rate). Hotel cost, cost of goods = supplier_cost. Nights = room_nights_total. Flash or member flash = promo_type Member Flash. Promo or code = promo_code. Villa = property_type Villa. ANZ = region Australia & New Zealand. SEA = region South East Asia. YoY = same period one year earlier.

  Dates. The data covers 2025-01-01 to 2026-08-31. Always use explicit dates for both periods, never relative periods. The house comparison is 2026-06-01 to 2026-08-31 versus 2025-06-01 to 2025-08-31.

  Style. Keep answers concise. Lead with the finding, name the metric definition used, and do not average percentages. When the user lists specific columns, return exactly those columns and no others, do not add helper or ratio columns. If asked to sort by a ratio that is not one of the listed columns, sort by it without displaying it.

sample_queries:
  gbv_and_margin_by_destination:
    query:
      fields:
        [
          se_sandbox_oscar__omnise_284_d5d6cc09_destinations.destination_name,
          se_sandbox_oscar__omnise_284_d5d6cc09_bookings.gbv,
          se_sandbox_oscar__omnise_284_d5d6cc09_bookings.margin_amount
        ]
      base_view: se_sandbox_oscar__omnise_284_d5d6cc09_bookings
      limit: 50
      topic: omnise_284_d5d6cc09_trading_bookings
    description: GBV and margin amount by destination. Filter booking date to
      2026-06-01 to 2026-08-31 and again to 2025-06-01 to 2025-08-31 to compare
      the periods.
    prompt: For Jun 1 to Aug 31 2026 versus Jun 1 to Aug 31 2025, which destinations
      grew GBV the most and what happened to margin over GBV in each?
  promotion_drivers:
    query:
      fields:
        [
          se_sandbox_oscar__omnise_284_d5d6cc09_destinations.destination_name,
          se_sandbox_oscar__omnise_284_d5d6cc09_promotions.promo_code,
          se_sandbox_oscar__omnise_284_d5d6cc09_bookings.gbv,
          se_sandbox_oscar__omnise_284_d5d6cc09_bookings.discount_amount,
          se_sandbox_oscar__omnise_284_d5d6cc09_bookings.supplier_cost,
          se_sandbox_oscar__omnise_284_d5d6cc09_bookings.margin_amount
        ]
      base_view: se_sandbox_oscar__omnise_284_d5d6cc09_bookings
      limit: 50
      topic: omnise_284_d5d6cc09_trading_bookings
    description: Promotion level GBV, discount, supplier cost and margin for
      2026-06-01 to 2026-08-31, lowest margin over GBV first.
    prompt: Within the destinations where margin over GBV fell, which promotions are
      driving it, for Jun 1 to Aug 31 2026 versus Jun 1 to Aug 31 2025?
  gbv_by_region:
    query:
      fields:
        [
          se_sandbox_oscar__omnise_284_d5d6cc09_destinations.region,
          se_sandbox_oscar__omnise_284_d5d6cc09_bookings.gbv,
          se_sandbox_oscar__omnise_284_d5d6cc09_bookings.bookings,
          se_sandbox_oscar__omnise_284_d5d6cc09_bookings.average_booking_value
        ]
      base_view: se_sandbox_oscar__omnise_284_d5d6cc09_bookings
      limit: 20
      topic: omnise_284_d5d6cc09_trading_bookings
    description: Regional split of booking value for the pinned window 2026-06-01 to
      2026-08-31.
    prompt: What was GBV by region for Jun 1 to Aug 31 2026?
